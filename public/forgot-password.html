<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — YouSeries</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B0A1F;--panel:#16122E;--marigold:#7C5CFF;--cream:#EDEBFF;--cream-dim:#A9A3C9;--gold-line:rgba(124,92,255,0.35);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;display:flex;justify-content:center;padding:50px 20px;}
  .card{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;padding:32px;max-width:420px;width:100%;}
  h1{font-family:'Baloo 2',sans-serif;color:var(--marigold);font-size:26px;margin:0 0 6px;}
  p.sub{color:var(--cream-dim);font-size:14px;margin:0 0 24px;}
  label{display:block;font-size:13.5px;color:var(--cream-dim);margin:16px 0 6px;}
  input[type=text],input[type=email],input[type=password]{
    width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14.5px;
  }
  button{margin-top:22px;width:100%;background:var(--marigold);color:#fff;border:none;border-radius:8px;
    padding:13px;font-weight:600;font-size:15.5px;cursor:pointer;font-family:'Mukta',sans-serif;}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  #status{margin-top:14px;font-size:13.5px;}
  #status.ok{color:#8fd19e;}
  #status.err{color:#e88a8a;}
  a.back{color:var(--cream-dim);font-size:13px;display:inline-block;margin-bottom:18px;}
  .hidden{display:none !important;}
  .question-display{background:rgba(255,255,255,0.06);border-radius:8px;padding:12px;font-size:14px;color:var(--marigold);margin-top:16px;}
</style>
</head>
<body>
<div class="card">
  <a class="back" href="/login.html">← Back to Login</a>
  <h1>Forgot Password</h1>
  <p class="sub">Apna email daalo, security question aayega.</p>

  <form id="emailForm">
    <label>Email</label>
    <input type="email" id="email" required placeholder="you@example.com">
    <button type="submit" id="emailBtn">Continue</button>
    <div id="emailStatus"></div>
  </form>

  <form id="resetForm" class="hidden">
    <div class="question-display" id="questionDisplay"></div>
    <label>Answer</label>
    <input type="text" id="securityAnswer" required placeholder="Type your answer">
    <label>Naya password</label>
    <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
    <button type="submit" id="resetBtn">Reset password</button>
    <div id="resetStatus"></div>
  </form>
</div>

<script>
let userEmail = '';

document.getElementById('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('emailBtn');
  const status = document.getElementById('emailStatus');
  btn.disabled = true; btn.textContent = 'Checking...';
  status.className = ''; status.textContent = '';

  try {
    userEmail = document.getElementById('email').value;
    const res = await fetch('/api/forgot-password/question', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');

    document.getElementById('questionDisplay').textContent = data.securityQuestion;
    document.getElementById('emailForm').classList.add('hidden');
    document.getElementById('resetForm').classList.remove('hidden');
  } catch (err) {
    status.className = 'err';
    status.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Continue';
  }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('resetBtn');
  const status = document.getElementById('resetStatus');
  btn.disabled = true; btn.textContent = 'Resetting...';
  status.className = ''; status.textContent = '';

  try {
    const res = await fetch('/api/forgot-password/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: userEmail,
        securityAnswer: document.getElementById('securityAnswer').value,
        newPassword: document.getElementById('newPassword').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');

    status.className = 'ok';
    status.textContent = 'Password reset! Please log in.';
    setTimeout(() => window.location.href = '/login.html', 1500);
  } catch (err) {
    status.className = 'err';
    status.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Reset password';
  }
});
</script>
</body>
</html>
