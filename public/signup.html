<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — YouSeries</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B0A1F;--panel:#16122E;--marigold:#7C5CFF;--cream:#EDEBFF;--cream-dim:#A9A3C9;--gold-line:rgba(124,92,255,0.35);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;display:flex;justify-content:center;padding:50px 20px;}
  .card{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;padding:32px;max-width:420px;width:100%;}
  h1{font-family:'Baloo 2',sans-serif;color:var(--marigold);font-size:26px;margin:0 0 6px;}
  p.sub{color:var(--cream-dim);font-size:14px;margin:0 0 24px;}
  label{display:block;font-size:13.5px;color:var(--cream-dim);margin:16px 0 6px;}
  input[type=text],input[type=email],input[type=password]{
    width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14.5px;
  }
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;margin-top:16px;}
  .checkbox-row input{width:auto;margin-top:3px;}
  .checkbox-row label{margin:0;font-size:13px;color:var(--cream-dim);}
  button{margin-top:22px;width:100%;background:var(--marigold);color:#fff;border:none;border-radius:8px;
    padding:13px;font-weight:600;font-size:15.5px;cursor:pointer;font-family:'Mukta',sans-serif;}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  #status{margin-top:14px;font-size:13.5px;}
  #status.err{color:#e88a8a;}
  a.back{color:var(--cream-dim);font-size:13px;display:inline-block;margin-bottom:18px;}
  a.link{color:var(--marigold);}
  .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--cream-dim);font-size:13px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--gold-line);}
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:12px;font-weight:600;font-size:14.5px;color:var(--cream);cursor:pointer;
    font-family:'Mukta',sans-serif;text-decoration:none;
  }
  .google-btn:hover{background:rgba(255,255,255,0.12);}
</style>
</head>
<body>
<div class="card">
  <a class="back" href="/">← Back to YouSeries</a>
  <h1>Create account</h1>
  <p class="sub">Sign up karo aur apne videos share karo.</p>

  <form id="signupForm">
    <label>Username</label>
    <input type="text" id="username" required maxlength="20" placeholder="e.g. sohail_films">

    <label>Email</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label>Password</label>
    <input type="password" id="password" required minlength="6" placeholder="Kam se kam 6 characters">

    <label>Security question (password bhoolne pe kaam aayega)</label>
    <select id="securityQuestion" required style="width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14.5px;">
      <option value="">-- Select a question --</option>
      <option value="Aapke pehle pet ka naam?">Aapke pehle pet ka naam?</option>
      <option value="Aapke school ka naam?">Aapke school ka naam?</option>
      <option value="Aapki favorite movie?">Aapki favorite movie?</option>
      <option value="Aapke shehar ka naam jahan aap bade hue?">Aapke shehar ka naam jahan aap bade hue?</option>
    </select>

    <label>Answer</label>
    <input type="text" id="securityAnswer" required placeholder="Apna answer likho">

    <div class="checkbox-row">
      <input type="checkbox" id="ageConfirm" required>
      <label for="ageConfirm">Main confirm karta/karti hoon ki main 18+ (adult) content upload nahi karunga/karungi.</label>
    </div>

    <button type="submit" id="submitBtn">Sign up</button>
    <div id="status"></div>
  </form>

  <div class="divider"><span>or</span></div>
  <a href="/api/auth/google" class="google-btn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 6 29.6 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 6 29.6 4 24 4c-7.7 0-14.4 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.3 35.4 26.8 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2C40.5 36 44 30.6 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
    Continue with Google
  </a>

  <p style="margin-top:20px;font-size:13.5px;color:var(--cream-dim);">Already account hai? <a class="link" href="/login.html">Login karo</a></p>
  <p style="margin-top:14px;font-size:12px;color:var(--cream-dim);">By continuing, you agree to our <a class="link" href="/terms-of-service.html">Terms of Service</a> and <a class="link" href="/privacy-policy.html">Privacy Policy</a>.</p>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  btn.disabled = true; btn.textContent = 'Creating account...';
  status.className = ''; status.textContent = '';

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        ageConfirm: document.getElementById('ageConfirm').checked,
        securityQuestion: document.getElementById('securityQuestion').value,
        securityAnswer: document.getElementById('securityAnswer').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Signup failed');
    window.location.href = '/';
  } catch (err) {
    status.className = 'err';
    status.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Sign up';
  }
});
</script>
</body>
</html>
