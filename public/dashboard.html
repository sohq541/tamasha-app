<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>YouSeries — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B0A1F;--panel:#16122E;--marigold:#7C5CFF;--vermilion:#4361EE;--cream:#EDEBFF;--cream-dim:#A9A3C9;--gold-line:rgba(124,92,255,0.35);--ok:#5ad19a;--bad:#e88a8a;--field:rgba(255,255,255,.06);--chip:rgba(124,92,255,.2);}
  html[data-theme="light"]{--ink:#FFFFFF;--panel:#F4F3FA;--marigold:#5B3FE0;--vermilion:#3550D8;--cream:#15132B;--cream-dim:#5E5878;--gold-line:rgba(91,63,224,0.28);--ok:#1E8E5A;--bad:#C62E4B;--field:#FFFFFF;--chip:rgba(91,63,224,.12);}
  .themebtn{background:transparent;border:1px solid var(--gold-line);color:var(--cream);padding:6px 10px;border-radius:8px;font-size:15px;cursor:pointer;}
  .pwwrap{position:relative;width:100%;}
  .pwwrap input{padding-right:64px;}
  .pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--marigold);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px;}
  .loginbox{max-width:340px;margin:60px auto;background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;padding:22px;}
  .loginbox input{width:100%;background:var(--field);border:1px solid var(--gold-line);border-radius:10px;padding:11px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14.5px;margin-bottom:12px;}
  .loginbox button.go{width:100%;background:var(--marigold);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;}
  .hdtick{font-size:11.5px;padding:2px 8px;border-radius:10px;display:inline-block;}
  .bubble{padding:9px 12px;border-radius:12px;font-size:13.5px;margin-top:8px;max-width:92%;word-break:break-word;}
  .bubble.admin{background:var(--chip);margin-left:auto;}
  .bubble.user{background:var(--field);border:1px solid var(--gold-line);}
  .bubble small{display:block;font-size:11px;color:var(--cream-dim);margin-top:3px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;padding:20px 16px 70px;transition:background .2s,color .2s;}
  .wrap{max-width:760px;margin:0 auto;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  h1{font-family:'Baloo 2',sans-serif;color:var(--marigold);font-size:24px;margin:0;}
  p.sub{color:var(--cream-dim);font-size:13.5px;margin:0 0 16px;}
  a.link{color:var(--marigold);font-size:13px;font-weight:600;text-decoration:none;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .tab{flex-shrink:0;background:transparent;border:1px solid var(--gold-line);color:var(--cream-dim);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Mukta',sans-serif;}
  .tab.active{background:var(--marigold);border-color:var(--marigold);color:#fff;}
  .btn{background:transparent;border:1px solid var(--gold-line);color:var(--cream);padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Mukta',sans-serif;}
  .btn-danger{border-color:#E63950;color:var(--bad);}
  .btn-ok{border-color:var(--ok);color:var(--ok);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat{background:var(--panel);border:1px solid var(--gold-line);border-radius:12px;padding:14px;}
  .stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:26px;line-height:1.1;}
  .stat span{font-size:12.5px;color:var(--cream-dim);}
  .stat.warn b{color:#ffcf5c;}
  .card{background:var(--panel);border:1px solid var(--gold-line);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
  .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .name{font-weight:700;font-size:15px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block;}
  .dot.on{background:var(--ok);}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;}
  .pill.sus{background:rgba(230,57,80,.2);color:var(--bad);}
  .pill.g{background:rgba(67,97,238,.25);color:#8fa8ff;}
  .pill.rep{background:rgba(255,180,0,.2);color:#ffcf5c;}
  .meta{font-size:12px;color:var(--cream-dim);margin-top:4px;word-break:break-word;}
  .nums{display:flex;gap:14px;font-size:12px;color:var(--cream-dim);margin-top:8px;flex-wrap:wrap;}
  .nums b{color:var(--cream);}
  .push{margin-left:auto;}
  input.search{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--gold-line);border-radius:10px;padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;margin-bottom:12px;}
  .ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);}
  .ev:last-child{border-bottom:none;}
  .ev .ic{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
  .ev .txt{font-size:13.5px;word-break:break-word;}
  .ev .when{font-size:11.5px;color:var(--cream-dim);}
  .empty,.loading{color:var(--cream-dim);font-size:14px;text-align:center;padding:40px 0;}
  .meter{margin-top:8px;height:9px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;}
  .meter i{display:block;height:100%;background:var(--marigold);border-radius:6px;}
  .meter i.warn{background:#ffcf5c;} .meter i.bad{background:#e63950;}
  .big{font-family:'Baloo 2',sans-serif;font-size:22px;line-height:1.2;}
  .chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:12px;background:rgba(124,92,255,.2);color:var(--cream);margin:3px 4px 0 0;}
  .warnbox{background:rgba(255,180,0,.12);border:1px solid #ffcf5c;color:#ffe3a0;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  textarea.t{width:100%;min-height:90px;background:rgba(255,255,255,.06);border:1px solid var(--gold-line);border-radius:10px;padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;resize:vertical;}
  .vtick{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#3897f0;color:#fff;font-size:9.5px;font-weight:800;}
  h3.sec{font-size:13px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px;}

/* ===== Redesign: sidebar layout + colored stat cards ===== */
.app-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.side{background:linear-gradient(180deg,#2563eb 0%,#6d28d9 100%);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
.brand{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;margin:0 0 20px 6px;}
.brand small{display:block;font-family:'Mukta',sans-serif;font-size:12px;opacity:.75;font-weight:400;}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;}
.nav .tab{background:transparent;border:none;color:#dbeafe;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap;}
.nav .tab:hover{background:rgba(255,255,255,.10);}
.nav .tab.active{background:rgba(255,255,255,.2);color:#fff;}
.side-foot{margin-top:12px;}
.side-foot .btn{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;}
.main{padding:24px 28px 70px;min-width:0;}
.grid .stat{color:#fff;border:none;border-radius:16px;padding:18px;box-shadow:0 10px 22px rgba(0,0,0,.14);}
.grid .stat b{color:#fff;font-size:30px;}
.grid .stat span{color:rgba(255,255,255,.9);font-size:13px;}
.grid .stat:nth-child(4n+1){background:linear-gradient(135deg,#3b82f6,#1d4ed8);}
.grid .stat:nth-child(4n+2){background:linear-gradient(135deg,#8b5cf6,#6d28d9);}
.grid .stat:nth-child(4n+3){background:linear-gradient(135deg,#10b981,#047857);}
.grid .stat:nth-child(4n+4){background:linear-gradient(135deg,#f97316,#ea580c);}
.grid .stat.warn{background:linear-gradient(135deg,#f59e0b,#d97706);}
.card{border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);}
@media (min-width:1000px){ .grid{grid-template-columns:repeat(4,1fr);} }
.hidden{display:none !important;}
#loginWrap{position:fixed;inset:0;z-index:9999;background:var(--ink);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
#loginWrap .loginbox{width:100%;max-width:360px;margin:auto;box-shadow:0 18px 48px rgba(0,0,0,0.45);}
input.search,textarea.t,select.adm-select{background:var(--field);color:var(--cream);border:1px solid var(--gold-line);border-radius:10px;padding:9px 12px;font-family:'Mukta',sans-serif;font-size:13.5px;outline:none;}
.ev{border-bottom:1px solid var(--gold-line);}
@media (max-width:820px){
  .app-shell:not(.hidden){display:block !important;}
  .app-shell.hidden{display:none !important;}
  .side{display:none !important;}
  .main{padding:14px 12px 70px !important;}
  #logoutBtn{display:inline-flex !important;}
}
</style>
</head>
<body>
<div class="app-shell hidden" id="appWrap" style="display:none;">
<aside class="side">
  <div class="brand">📊 Admin<small>Dashboard</small></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="side-foot"><button class="btn" onclick="adminLogout()">Logout</button></div>
</aside>
<main class="main">
  <div class="top">
    <h1>📊 Dashboard</h1>
    <div style="display:flex;gap:8px;align-items:center;"><button class="themebtn" id="themeBtn" onclick="toggleTheme()" title="Dark / White mode">🌙</button><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" id="logoutBtn" onclick="adminLogout()" style="display:none;">Logout</button></div>
  </div>
  <p class="sub" id="updated">Loading…</p>

  <div class="tabs">
    <button class="tab active" data-t="overview" onclick="setTab('overview')">Overview</button>
    <button class="tab" data-t="reports" id="reportsTab" onclick="setTab('reports')">Reports</button>
    <button class="tab" data-t="datahub" onclick="setTab('datahub')">🛰️ Data Hub</button>
    <button class="tab" data-t="songs" onclick="setTab('songs')">🎵 Songs</button>
    <button class="tab" data-t="content" onclick="setTab('content')">🎬 Content Manager</button>
    <button class="tab" data-t="stories" onclick="setTab('stories')">🔵 Stories Manager</button>
    <button class="tab" data-t="users" onclick="setTab('users')">Users</button>
    <button class="tab" data-t="helpdesk" id="hdTab" onclick="setTab('helpdesk')">Help Desk</button>
    <button class="tab" data-t="bluetick" onclick="setTab('bluetick')">✔ Blue tick</button>
    <button class="tab" data-t="moderation" id="queueTab" onclick="setTab('moderation')">🛡️ Queue</button>
    <button class="tab" data-t="searches" onclick="setTab('searches')">🔎 Searches</button>
    <button class="tab" data-t="trending" onclick="setTab('trending')">Trending</button>
    <button class="tab" data-t="tools" onclick="setTab('tools')">Tools</button>
    <button class="tab" data-t="activity" onclick="setTab('activity')">Activity</button>
  </div>

  <div id="view"><div class="loading">Loading…</div></div>
</div>
</main>
</div>
<div class="wrap" id="loginWrap" style="display:none;">
  <form class="loginbox" onsubmit="event.preventDefault();adminLogin();">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <div style="font-family:'Baloo 2',sans-serif;font-size:22px;color:var(--marigold);">🔐 Admin Login</div>
      <button type="button" class="themebtn" onclick="toggleTheme()" title="Dark / White mode">🌙</button>
    </div>
    <div style="font-size:13px;color:var(--cream-dim);margin-bottom:14px;">Enter your admin username and password to unlock the dashboard.</div>
    <input id="lgUser" type="text" autocomplete="username" placeholder="Admin Username">
    <div class="pwwrap"><input id="lgPass" type="password" autocomplete="current-password" placeholder="Admin Password"><button type="button" class="pwtoggle" onclick="togglePw('lgPass', this)">Show</button></div>
    <button type="submit" class="go" id="lgSubmitBtn">Unlock Dashboard</button>
    <div id="lgErr" style="color:var(--bad);font-size:13px;margin-top:10px;min-height:18px;text-align:center;"></div>
  </form>
</div>

<script>
let D = null, R = [], H = [], tab = 'overview', q = '';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('themeBtn'); if (b) b.textContent = t === 'light' ? '🌙' : '☀️';
  try { localStorage.setItem('dashTheme', t); } catch (e) {}
}
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
(function(){ let t = 'dark'; try { t = localStorage.getItem('dashTheme') || 'dark'; } catch (e) {} applyTheme(t); })();
function togglePw(id, btn){
  const i = document.getElementById(id);
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Hide' : 'Show';
}
// Intercept all /api/admin/ fetch calls to attach x-no-prompt: 1 so browser never shows native Basic Auth popup
(function(){
  const origFetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.includes('/api/admin/') || url.includes('/api/songs')) {
      init = Object.assign({}, init || {});
      const h = new Headers(init.headers || {});
      if (!h.has('x-no-prompt')) h.set('x-no-prompt', '1');
      init.headers = h;
    }
    const res = await origFetch(input, init);
    if (res.status === 401 && url.includes('/api/admin/') && !url.includes('/api/admin/login')) {
      showLogin('Session expired — please log in again');
    }
    return res;
  };
})();

function wipeDashboardState(){
  D = null; R = []; H = [];
  if (typeof CM_LIST !== 'undefined') CM_LIST = [];
  if (typeof ADMIN_STORIES !== 'undefined') ADMIN_STORIES = [];
  if (typeof ADMIN_SONGS_LIST !== 'undefined') ADMIN_SONGS_LIST = [];
  if (typeof BT !== 'undefined') BT = null;
  if (typeof adminPreviewAudio !== 'undefined' && adminPreviewAudio) {
    try { adminPreviewAudio.pause(); } catch (e) {}
    adminPreviewAudio = null;
  }
  const v = document.getElementById('view');
  if (v) v.innerHTML = '';
  const u = document.getElementById('updated');
  if (u) u.textContent = '';
}

function showLogin(msg){
  wipeDashboardState();
  const appEl = document.getElementById('appWrap');
  if (appEl) {
    appEl.classList.add('hidden');
    appEl.style.display = 'none';
  }
  const lw = document.getElementById('loginWrap');
  if (lw) lw.style.display = 'flex';
  const err = document.getElementById('lgErr');
  if (err) err.textContent = msg || '';
  const pw = document.getElementById('lgPass');
  if (pw) pw.value = '';
  setTimeout(() => {
    const u = document.getElementById('lgUser');
    if (u) u.focus();
  }, 50);
}

async function adminLogin(){
  const username = document.getElementById('lgUser').value.trim();
  const password = document.getElementById('lgPass').value;
  const err = document.getElementById('lgErr');
  const btn = document.getElementById('lgSubmitBtn');
  if (!username || !password) { err.textContent = 'Please enter both username and password'; return; }
  err.textContent = 'Verifying credentials…';
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-no-prompt': '1' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = data.error || 'Invalid admin username or password';
      if (btn) btn.disabled = false;
      return;
    }
    try { sessionStorage.removeItem('dashLoggedOut'); } catch (e) {}
    document.getElementById('loginWrap').style.display = 'none';
    const appEl = document.getElementById('appWrap');
    if (appEl) {
      appEl.classList.remove('hidden');
      appEl.style.display = window.innerWidth <= 820 ? 'block' : 'grid';
    }
    document.getElementById('logoutBtn').style.display = '';
    if (btn) btn.disabled = false;
    load();
  } catch (e) {
    err.textContent = 'Network error — please try again';
    if (btn) btn.disabled = false;
  }
}

async function adminLogout(){
  try { sessionStorage.setItem('dashLoggedOut', '1'); } catch (e) {}
  await fetch('/api/admin/logout', { method: 'POST', headers: { 'x-no-prompt': '1' } }).catch(() => {});
  showLogin('✅ Successfully logged out of Admin Dashboard');
}
function fb(b){
  b = Number(b) || 0;
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(1) + ' MB';
  return (b / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}
const meterCls = p => p >= 90 ? 'bad' : p >= 70 ? 'warn' : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(iso){
  if (!iso) return 'never';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' hours ago';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' days ago';
  return new Date(iso).toLocaleDateString();
}

async function load(){
  try {
    if (sessionStorage.getItem('dashLoggedOut') === '1') {
      showLogin('Please log in to access the dashboard');
      return;
    }
  } catch (e) {}
  document.getElementById('updated').textContent = 'Loading…';
  try {
    const [res, res2, res3, res4] = await Promise.all([
      fetch('/api/admin/dashboard', { headers: { 'x-no-prompt': '1' } }),
      fetch('/api/admin/reports', { headers: { 'x-no-prompt': '1' } }),
      fetch('/api/admin/helpdesk', { headers: { 'x-no-prompt': '1' } }),
      fetch('/api/admin/r2-usage', { headers: { 'x-no-prompt': '1' } })
    ]);
    if (res.status === 401) { showLogin(); return; }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    D = data;
    try { D.r2 = await res4.json(); } catch (e) { D.r2 = null; }
    document.getElementById('loginWrap').style.display = 'none';
    const appEl = document.getElementById('appWrap');
    if (appEl) {
      appEl.classList.remove('hidden');
      appEl.style.display = window.innerWidth <= 820 ? 'block' : 'grid';
    }
    document.getElementById('logoutBtn').style.display = '';
    try { const rj = await res2.json(); R = res2.ok ? (rj.reports || []) : []; } catch (e) { R = []; }
    try { const hj = await res3.json(); H = res3.ok ? (hj.tickets || []) : []; window.HD_STATS = hj.analytics || null; } catch (e) { H = []; window.HD_STATS = null; }
    document.getElementById('updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t === tab));
    render();
  } catch (e) {
    document.getElementById('view').innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>';
    document.getElementById('updated').textContent = '';
  }
}

function setTab(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  render();
}

function render(){
  if (!D) return;
  const pend = R.filter(r => r.status === 'pending').length;
  D.overview.pendingReports = pend;
  document.getElementById('reportsTab').textContent = pend ? 'Reports (' + pend + ')' : 'Reports';
  const hOpen = H.filter(t => t.status === 'open').length;
  document.getElementById('hdTab').textContent = hOpen ? 'Help Desk (' + hOpen + ')' : 'Help Desk';
  const qPend = (D.overview && D.overview.pendingModeration) || 0;
  const qTabEl = document.getElementById('queueTab');
  if (qTabEl) qTabEl.textContent = qPend ? '🛡️ Queue (' + qPend + ')' : '🛡️ Queue';
  if (tab === 'overview') renderOverview();
  else if (tab === 'reports') renderReports();
  else if (tab === 'helpdesk') renderHelpdesk();
  else if (tab === 'datahub') renderDataHub();
  else if (tab === 'songs') renderSongs();
  else if (tab === 'bluetick') renderBluetickAdmin();
  else if (tab === 'content') renderContentManager();
  else if (tab === 'stories') renderAdminStories();
  else if (tab === 'moderation') renderModeration();
  else if (tab === 'searches') renderSearches();
  else if (tab === 'trending') renderTrending();
  else if (tab === 'tools') renderTools();
  else if (tab === 'users') renderUsers();
  else renderActivity();
}

function jumpToContentType(t){
  cmType = t;
  setTab('content');
}
function jumpToUsersFilter(f){
  userFilter = f;
  setTab('users');
}
function renderOverview(){
  const o = D.overview;
  const stat = (n, label, cls, onClickJs) => `<div class="stat ${cls || ''}" ${onClickJs ? `onclick="${onClickJs}" style="cursor:pointer;"` : ''}><b>${n}</b><span>${label}</span></div>`;
  const spamUsers = D.users.filter(u => u.reports > 0 && !u.suspended).sort((a, b) => b.reports - a.reports).slice(0, 5);
  const verifiedCount = D.users.filter(u => u.verified).length;
  document.getElementById('view').innerHTML =
    `<div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,rgba(124,92,255,0.14),rgba(67,97,238,0.08));">
      <div class="row1" style="justify-content:space-between;margin-bottom:8px;">

let ADMIN_SONGS_LIST = [], songFilter = 'all', songSearch = '';

function cleanSongTitleFilename(filename){
  if (!filename) return { title: '', artist: '' };
  let s = filename.replace(/\.[a-zA-Z0-9]+$/, ''); // strip .mp3, .m4a, etc.
  // strip website tags like (PagalWorld.com.sb), [Songspk.cc], (Pagalworld), etc.
  s = s.replace(/[\(\[\{][^\)\]\}]*(?:pagalworld|songspk|hungama|wynk|gaana|jiosaavn|mp3|download|ringtone|remix|dj|320kbps|128kbps|kbps|com|in|link|site|net|org)[^\)\]\}]*[\)\]\}]/gi, '');
  s = s.replace(/[-_]?(?:320kbps|128kbps|192kbps|256kbps|64kbps|kbps)/gi, '');
  s = s.replace(/https?:\/\/\S+/gi, '');
  s = s.replace(/www\.[a-z0-9\-]+\.[a-z]+/gi, '');
  s = s.replace(/[\._\+]+/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  let artist = '', title = s;
  if (/^\d{1,3}\s*[-–]\s*/.test(title)) {
    title = title.replace(/^\d{1,3}\s*[-–]\s*/, '').trim();
  }
  if (title.includes(' - ') || title.includes(' – ')) {
    const parts = title.split(/\s*[-–]\s*/);
    if (parts.length >= 2) {
      artist = parts[0].trim();
      title = parts.slice(1).join(' - ').trim();
    }
  }
  return { title, artist };
}

async function editSongPrompt(id, curTitle, curArtist, curCat){
  const newTitle = prompt('Edit Song Title:', curTitle || '');
  if (newTitle === null) return;
  const newArtist = prompt('Edit Artist Name:', curArtist || '');
  if (newArtist === null) return;
  const newCat = prompt('Edit Category (e.g. Lofi, Romantic, Viral):', curCat || 'General');
  if (newCat === null) return;
  try {
    const res = await fetch('/api/admin/songs/' + id + '/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-no-prompt': '1' },
      body: JSON.stringify({ title: newTitle.trim(), artist: newArtist.trim(), category: newCat.trim() })
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Edit failed');
    const item = ADMIN_SONGS_LIST.find(x => x.id === id);
    if (item) { item.title = d.title || newTitle; item.artist = d.artist || newArtist; item.category = d.category || newCat; }
    drawAdminSongs();
  } catch (e) { alert(e.message); }
}
function fmtMB(b){ return (b / 1048576).toFixed(2) + ' MB'; }

async function uploadSong(){
  const file = document.getElementById('snFile').files[0];
  const title = document.getElementById('snTitle').value.trim();
  if (!file || !title) { alert('Song file aur title dono do'); return; }
  const box = document.getElementById('snProgress');
  const txt = document.getElementById('snStatusText');
  const bar = document.getElementById('snBar');
  const nums = document.getElementById('snNums');
  const btn = document.getElementById('snBtn');
  box.style.display = 'block';
  bar.style.width = '0%';
  bar.style.background = 'var(--marigold)';
  txt.textContent = 'Uploading: ' + file.name;
  nums.textContent = '0 MB / ' + fmtMB(file.size) + ' (0%)';
  btn.disabled = true;
  const fd = new FormData();
  fd.append('song', file);
  fd.append('title', title);
  fd.append('artist', document.getElementById('snArtist').value.trim());
  const catEl = document.getElementById('snCategory');
  if (catEl && catEl.value.trim()) fd.append('category', catEl.value.trim());
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/admin/songs');
  xhr.setRequestHeader('x-no-prompt', '1');
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const pct = Math.round(e.loaded / e.total * 100);
    bar.style.width = pct + '%';
    nums.textContent = fmtMB(e.loaded) + ' / ' + fmtMB(e.total) + ' (' + pct + '%)';
  };
  xhr.onload = () => {
    btn.disabled = false;
    let data = {};
    try { data = JSON.parse(xhr.responseText || '{}'); } catch (e) {}
    if (xhr.status >= 200 && xhr.status < 300) {
      bar.style.width = '100%';
      txt.textContent = '✔ Uploaded: ' + title;
      nums.textContent = fmtMB(file.size) + ' uploaded';
      setTimeout(() => renderSongs(), 800);
    } else {
      bar.style.background = 'var(--bad)';
      txt.textContent = '❌ Upload failed: ' + (data.error || 'server error (' + xhr.status + ')');
    }
  };
  xhr.onerror = () => { btn.disabled = false; bar.style.background = 'var(--bad)'; txt.textContent = '❌ Network error, try again'; };
  xhr.send(fd);
}

  ['Feature Added', 'Dhanyavaad suggestion ke liye! Ye feature ab YouSeries me live ho chuka hai.'],

function renderHelpdesk(){
  const v = document.getElementById('view');
  if (!H.length) { v.innerHTML = '<div class="empty">No help desk messages yet.</div>'; return; }
  const total = H.length;
  const openCount = H.filter(t => t.status === 'open').length;
  const ansCount = H.filter(t => t.status === 'answered').length;
  const closedCount = H.filter(t => t.status === 'closed').length;

  const q = hdSearch.trim().toLowerCase();
  const filtered = H.filter(t => {
    if (hdFilter !== 'all' && t.status !== hdFilter) return false;
    if (q) {
      const hay = ((t.name || '') + ' ' + (t.username || '') + ' ' + (t.email || '') + ' ' + (t.problem || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  v.innerHTML = `
    <div class="grid" style="margin-bottom:14px;">
      <div class="stat ${openCount ? 'warn' : ''}" onclick="hdFilter='open';renderHelpdesk()" style="cursor:pointer;"><b>${openCount}</b><span>⏳ Open Tickets</span></div>
      <div class="stat" onclick="hdFilter='answered';renderHelpdesk()" style="cursor:pointer;"><b>${ansCount}</b><span>💬 Answered</span></div>
      <div class="stat" onclick="hdFilter='closed';renderHelpdesk()" style="cursor:pointer;"><b>${closedCount}</b><span>✔ Closed</span></div>
      <div class="stat" onclick="hdFilter='all';renderHelpdesk()" style="cursor:pointer;"><b>${total}</b><span>📋 Total Inquiries</span></div>
    </div>

    <div class="row1" style="margin-bottom:14px;gap:8px;flex-wrap:wrap;justify-content:space-between;">
      <div style="display:flex;gap:6px;overflow-x:auto;">
        <button class="tab ${hdFilter === 'all' ? 'active' : ''}" onclick="hdFilter='all';renderHelpdesk()">All (${total})</button>
        <button class="tab ${hdFilter === 'open' ? 'active' : ''}" onclick="hdFilter='open';renderHelpdesk()">Open (${openCount})</button>
        <button class="tab ${hdFilter === 'answered' ? 'active' : ''}" onclick="hdFilter='answered';renderHelpdesk()">Answered (${ansCount})</button>
        <button class="tab ${hdFilter === 'closed' ? 'active' : ''}" onclick="hdFilter='closed';renderHelpdesk()">Closed (${closedCount})</button>
      </div>
      <input type="text" placeholder="🔍 Search ticket by user, email or issue…" value="${esc(hdSearch)}" oninput="hdSearch=this.value;renderHelpdesk()" style="padding:7px 12px;border-radius:20px;border:1px solid var(--gold-line);background:var(--field);color:var(--cream);font-size:12.5px;outline:none;">
    </div>

    ` + (filtered.map(t => {
      const thread = (t.replies || []).map(r => `<div class="bubble ${r.from === 'admin' ? 'admin' : 'user'}">${esc(r.text)}<small>${r.from === 'admin' ? 'Tum (admin)' : esc(t.name)} · ${ago(r.at)}</small></div>`).join('');
      const st = t.status === 'open' ? '<span class="hdtick" style="background:rgba(255,180,0,.2);color:#ffcf5c;">open</span>'
        : t.status === 'answered' ? '<span class="hdtick" style="background:rgba(90,209,154,.2);color:var(--ok);">answered</span>'
        : '<span class="hdtick" style="background:var(--field);color:var(--cream-dim);">closed</span>';
      return `<div class="card" id="hdt-${t.id}">
        <div class="row1"><span class="name">${esc(t.name)}</span>${st}<span class="meta push" style="margin:0;">${ago(t.createdAt)}</span></div>
        <div class="meta">${esc(t.email || 'no email')} · ${t.username ? '@' + esc(t.username) : 'guest'} ${t.category ? '· <span class="pill g">' + esc(t.category) + '</span>' : ''}</div>
        <div class="bubble user" style="margin-top:10px;">
          ${esc(t.problem)}
          ${t.screenshotUrl ? `<div style="margin-top:8px;"><a href="${esc(t.screenshotUrl)}" target="_blank"><img src="${esc(t.screenshotUrl)}" style="max-height:160px;border-radius:8px;border:1px solid var(--gold-line);" loading="lazy"></a></div>` : ''}
          <small>${esc(t.name)} · ${ago(t.createdAt)}</small>
        </div>
        ${thread}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;">
          <button type="button" class="btn btn-ok" style="font-size:12px;padding:5px 10px;font-weight:700;display:inline-flex;align-items:center;gap:4px;" onclick="aiSuggestHelpReply('${t.id}', this)">✨ AI Auto-Write Reply</button>
          ${HD_CANNED.map(([lbl, txt]) => `<button type="button" class="btn" style="font-size:11.5px;padding:4px 8px;" onclick="insertCannedReply('${t.id}', ${JSON.stringify(txt)})">⚡ ${esc(lbl)}</button>`).join('')}
        </div>
        <textarea class="t" id="hr-${t.id}" placeholder="Jawab likho… (user ko app me aur email pe dikhega)" style="margin-top:10px;min-height:70px;"></textarea>
        <div class="row1" style="margin-top:8px;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-ok" onclick="replyHelpdesk('${t.id}')">Send reply</button>
          <button class="btn" onclick="setHelpStatus('${t.id}','${t.status === 'closed' ? 'open' : 'closed'}')">${t.status === 'closed' ? 'Reopen' : 'Close'}</button>
          ${t.username ? `<button class="btn" onclick="adminDmUser('${esc(t.userId || '')}', '${esc(t.username)}')">✉️ DM User</button>` : ''}
          <button class="btn btn-danger" onclick="deleteHelpdeskTicket('${t.id}')" style="margin-left:auto;">🗑️ Delete</button>
        </div>
      </div>`;
    }).join('') || '<div class="empty">No matching helpdesk tickets found.</div>');
}
function insertCannedReply(tid, txt){
  const el = document.getElementById('hr-' + tid);
  if (el) { el.value = txt; el.focus(); }
}
async function aiSuggestHelpReply(tid, btn){
  const el = document.getElementById('hr-' + tid);
  if (!el) return;
  const origBtnText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '🤖 Thinking…'; }
  try {
    const res = await fetch('/api/admin/helpdesk/' + tid + '/ai-suggest', {
      method: 'POST',
      headers: { 'x-no-prompt': '1' }
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'AI request failed');
    el.value = d.reply || d.suggestion || '';
    el.focus();
  } catch (e) {
    const t = H.find(x => x.id === tid);
    const uName = (t && (t.username || t.name)) || 'User';
    el.value = `Namaste @${uName}!\n\nAapki samasya par YouSeries ki support team ne kaam shuru kar diya hai. Kripya app ko ek baar refresh karke check karein. Agar koi aur dikkat aaye to humein turant batayein.\n\n— Sohail Parvez (Founder & CEO, YouSeries)`;
    el.focus();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origBtnText || '✨ AI Auto-Write Reply'; }
  }
}
async function deleteHelpdeskTicket(id){
  if (!confirm('Permanently delete this helpdesk ticket?')) return;
  try {
    const res = await fetch('/api/admin/helpdesk/' + id + '/delete', { method: 'POST', headers: { 'x-no-prompt': '1' } });
    if (!res.ok) throw new Error('Delete failed');
    H = H.filter(t => t.id !== id);
    renderHelpdesk();
  } catch (e) { alert(e.message); }
}
async function replyHelpdesk(id){
  const ta = document.getElementById('hr-' + id);
  const message = (ta && ta.value || '').trim();
  if (!message) { alert('Jawab likho'); return; }
  try {
    const res = await fetch('/api/admin/helpdesk/' + id + '/reply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    const t = H.find(x => x.id === id);
    if (t) { t.replies = (t.replies || []).concat([{ from: 'admin', text: message, at: new Date().toISOString() }]); t.status = 'answered'; }
    render();
    if (!data.emailed && t && t.email) alert('Reply saved in the app. Email was not sent (check the Resend settings).');
  } catch (e) { alert(e.message); }
}
async function setHelpStatus(id, status){
  try {
    const res = await fetch('/api/admin/helpdesk/' + id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
    if (!res.ok) throw new Error('Failed');
    const t = H.find(x => x.id === id); if (t) t.status = status;
    render();
  } catch (e) { alert(e.message); }
}

  if (!confirm('Approve all pending uploads in the queue?')) return;
  await fetch('/api/admin/moderation/approve-all', { method: 'POST', headers: { 'x-no-prompt': '1' } });
  renderModeration();
}
async function modDecide(id, approve, boost){
  let reason = '';
  if (!approve) {
    reason = prompt('Reject reason (sent to user in notifications, e.g. 18+ Content, Copyright, Spam, Low Quality):', 'Violates community guidelines');
    if (reason === null) return;
  }
  await fetch('/api/admin/moderation/' + id + (approve ? '/approve' : '/reject'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-no-prompt': '1' },
    body: JSON.stringify({ boost: !!boost, reason: reason || '' })
  });
  renderModeration();
}
let adminPreviewAudio = null, adminPreviewBtn = null;
function toggleAdminSongPreview(url, btn){
  if (adminPreviewAudio && adminPreviewAudio.src.endsWith(url) && !adminPreviewAudio.paused) {
    adminPreviewAudio.pause();
    btn.textContent = '▶ Play Preview';
    return;
  }
  if (adminPreviewAudio) {
    adminPreviewAudio.pause();
    if (adminPreviewBtn) adminPreviewBtn.textContent = '▶ Play Preview';
  }
  adminPreviewAudio = new Audio(url);
  adminPreviewBtn = btn;
  btn.textContent = '⏸ Pause Preview';
  adminPreviewAudio.onended = () => { btn.textContent = '▶ Play Preview'; };
  adminPreviewAudio.play().catch(e => { btn.textContent = '▶ Play Preview'; alert('Audio playback error: ' + e.message); });
}

  if (!rows.length) { box.innerHTML = '<div class="empty">No matching verification requests.</div>'; return; }
  box.innerHTML = rows.map(r => `

}

async function decideBluetick(id, approve){
  let reason = '';
  const durEl = document.getElementById('btdur-' + id);
  const duration = (durEl && durEl.value) || '30';
  if (!approve) { reason = prompt('Reject reason (shown to the user):', '') || ''; }
  else if (!confirm(`Approve this request for ${duration === 'permanent' ? 'Permanent' : duration + ' days'}?`)) return;
  try {
    const res = await fetch('/api/admin/bluetick/' + id + '/decide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-no-prompt': '1' },
      body: JSON.stringify({ approve, reason, duration })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    renderBluetickAdmin();
  } catch (e) { alert(e.message); }
}

let CM_LIST = [], cmType = 'all', cmQuery = '', cmSort = 'newest', cmBulkMode = false, cmSelected = new Set();
async function renderContentManager(){
  const v = document.getElementById('view');
  v.innerHTML = '<div class="loading">Loading posts…</div>';
  cmSelected.clear();
  try {
    const res = await fetch('/api/admin/content', { headers: { 'x-no-prompt': '1' } });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Failed');
    CM_LIST = d.content || d.films || (Array.isArray(d) ? d : []);
  } catch (e) {
    CM_LIST = [];
  }
  if (!CM_LIST.length) {
    try {
      const r2 = await fetch('/api/films');
      const d2 = await r2.json();
      const arr = Array.isArray(d2) ? d2 : (d2.films || []);
      CM_LIST = arr.map(f => ({
        id: f.id,
        title: f.title || 'Untitled',
        description: f.description || '',
        type: f.type === 'photo' ? ((f.slideUrls && f.slideUrls.length > 1) ? 'carousel' : 'photo') : (f.type === 'short' ? 'short' : 'film'),
        ownerId: f.ownerId,
        ownerUsername: f.ownerUsername || 'user',
        views: f.views || 0,
        likes: f.likes || 0,
        comments: Array.isArray(f.comments) ? f.comments.length : (f.comments || 0),
        uploadedAt: f.uploadedAt,
        pendingReview: !!f.pendingReview,
        isSensitive: !!f.isSensitive,
        adminBoosted: !!f.adminBoosted,
        posterUrl: f.posterUrl || (f.slideUrls && f.slideUrls[0]) || null,
        videoUrl: f.videoUrl || null
      }));
    } catch (e) {}
  }

  v.innerHTML = `
    <div class="row1" style="gap:8px;margin-bottom:10px;flex-wrap:wrap;justify-content:space-between;">
      <div id="cmFilterTabs" style="display:flex;gap:6px;overflow-x:auto;"></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <select class="adm-select" id="cmSortSelect" onchange="cmSort=this.value;drawContentList()">
          <option value="newest" ${cmSort === 'newest' ? 'selected' : ''}>🕒 Newest First</option>
          <option value="views" ${cmSort === 'views' ? 'selected' : ''}>👁️ Most Views</option>
          <option value="likes" ${cmSort === 'likes' ? 'selected' : ''}>❤️ Most Likes</option>
          <option value="comments" ${cmSort === 'comments' ? 'selected' : ''}>💬 Most Comments</option>
        </select>
        <button class="btn ${cmBulkMode ? 'btn-ok' : ''}" id="cmBulkToggleBtn" onclick="toggleCmBulkMode()">${cmBulkMode ? '✕ Cancel Select' : '☑️ Bulk Select'}</button>
      </div>
    </div>
    <div class="row1" style="margin-bottom:12px;gap:8px;">
      <input type="text" class="search" id="cmSearchInput" placeholder="🔍 Search post title, description or @username…" value="${esc(cmQuery)}" oninput="cmQuery=this.value;drawContentList()" style="margin:0;flex:1;">
    </div>
    <div id="cmBulkActionBar" class="card hidden" style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(230,57,80,0.12);border-color:var(--bad);">
      <span style="font-weight:700;font-size:13.5px;" id="cmBulkCountLbl">0 selected</span>
      <div class="row1" style="gap:8px;">
        <button class="btn" onclick="cmSelectAllVisible()">Select All Visible</button>
        <button class="btn btn-danger" onclick="cmDeleteSelected()">🗑️ Delete Selected</button>
      </div>
    </div>
    <div id="cmRows"></div>
  `;
  drawContentList();
}
function toggleCmBulkMode(){
  cmBulkMode = !cmBulkMode;
  cmSelected.clear();
  const btn = document.getElementById('cmBulkToggleBtn');
  if (btn) {
    btn.textContent = cmBulkMode ? '✕ Cancel Select' : '☑️ Bulk Select';
    btn.classList.toggle('btn-ok', cmBulkMode);
  }
  const bar = document.getElementById('cmBulkActionBar');
  if (bar) bar.classList.toggle('hidden', !cmBulkMode);
  drawContentList();
}
function toggleCmSelect(id, checked){
  if (checked) cmSelected.add(id);
  else cmSelected.delete(id);
  const lbl = document.getElementById('cmBulkCountLbl');
  if (lbl) lbl.textContent = cmSelected.size + ' post(s) selected';
}
function getFilteredCmRows(){
  const q = cmQuery.trim().toLowerCase();
  const rows = CM_LIST.filter(f => {
    let typeMatch = true;
    if (cmType === 'film') typeMatch = f.type === 'film';
    else if (cmType === 'short') typeMatch = f.type === 'short';
    else if (cmType === 'photo') typeMatch = (f.type === 'photo' || f.type === 'carousel');
    else if (cmType === 'boosted') typeMatch = !!f.adminBoosted;
    else if (cmType === 'sensitive') typeMatch = !!f.isSensitive;
    const qMatch = !q || (f.title || '').toLowerCase().includes(q) || (f.ownerUsername || '').toLowerCase().includes(q) || (f.description || '').toLowerCase().includes(q);
    return typeMatch && qMatch;
  });
  rows.sort((a, b) => {
    if (cmSort === 'views') return (b.views || 0) - (a.views || 0);
    if (cmSort === 'likes') return (b.likes || 0) - (a.likes || 0);
    if (cmSort === 'comments') return (b.comments || 0) - (a.comments || 0);
    return new Date(b.uploadedAt || 0) - new Date(a.uploadedAt || 0);
  });
  return rows;
}
function cmSelectAllVisible(){
  const visible = getFilteredCmRows();
  if (cmSelected.size === visible.length) cmSelected.clear();
  else visible.forEach(f => cmSelected.add(f.id));
  drawContentList();
  const lbl = document.getElementById('cmBulkCountLbl');
  if (lbl) lbl.textContent = cmSelected.size + ' post(s) selected';
}
async function cmDeleteSelected(){
  if (!cmSelected.size) { alert('Select at least 1 post first'); return; }
  if (!confirm('Permanently delete ' + cmSelected.size + ' selected post(s) and their media from R2?')) return;
  const ids = [...cmSelected];
  for (const id of ids) {
    try {
      const res = await fetch('/api/admin/content/' + id + '/delete', { method: 'POST', headers: { 'x-no-prompt': '1' } });
      if (res.ok) CM_LIST = CM_LIST.filter(x => x.id !== id);
    } catch (e) {}
  }
  cmSelected.clear();
  cmBulkMode = false;
  renderContentManager();
}

  const tabsBox = document.getElementById('cmFilterTabs');

    const vidCnt = CM_LIST.filter(f => f.type === 'film').length;
    const shCnt = CM_LIST.filter(f => f.type === 'short').length;

    tabsBox.innerHTML = `

      <button class="tab ${cmType === 'short' ? 'active' : ''}" onclick="cmType='short';drawContentList()">⚡ Shorts (${shCnt})</button>
      <button class="tab ${cmType === 'photo' ? 'active' : ''}" onclick="cmType='photo';drawContentList()">🖼️ Photos (${phCnt})</button>

      <button class="tab ${cmType === 'sensitive' ? 'active' : ''}" onclick="cmType='sensitive';drawContentList()">🔞 18+ (${senCnt})</button>
    `;
  }
  const box = document.getElementById('cmRows');
  if (!box) return;
  const rows = getFilteredCmRows();
  box.innerHTML = rows.map(f => {
    const thumbHtml = f.posterUrl
      ? `<img src="${esc(f.posterUrl)}" style="width:64px;height:64px;border-radius:8px;object-fit:cover;background:#000;flex-shrink:0;" loading="lazy">`
      : (f.videoUrl
          ? `<video src="${esc(f.videoUrl)}#t=0.5" muted playsinline preload="metadata" style="width:64px;height:64px;border-radius:8px;object-fit:cover;background:#000;flex-shrink:0;"></video>`
          : `<div style="width:64px;height:64px;border-radius:8px;background:var(--field);display:flex;align-items:center;justify-content:center;flex-shrink:0;">🎬</div>`);
    return `
    <div class="card" id="cm-${f.id}" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      ${cmBulkMode ? `<input type="checkbox" ${cmSelected.has(f.id) ? 'checked' : ''} onchange="toggleCmSelect('${f.id}', this.checked)" style="width:18px;height:18px;flex-shrink:0;">` : ''}
      ${thumbHtml}
      <div style="flex:1;min-width:180px;">
        <div class="row1">
          <span class="name">${esc(f.title)}</span>
          <span class="pill g">${esc(f.type)}</span>
          ${f.adminBoosted ? '<span class="pill g" style="background:rgba(255,190,60,0.2);color:#ffcf5c;">📌 Boosted</span>' : ''}
          ${f.pendingReview ? '<span class="pill rep">pending</span>' : ''}
          ${f.isSensitive ? '<span class="pill sus">18+/sensitive</span>' : ''}
        </div>
        <div class="meta">@${esc(f.ownerUsername)} · ${ago(f.uploadedAt)}</div>
        ${f.description ? `<div class="meta" style="font-size:12px;opacity:0.85;">${esc(f.description.slice(0, 100))}</div>` : ''}
        <div class="nums"><span><b>${f.views}</b> views</span><span><b>${f.likes}</b> likes</span><span><b>${f.comments}</b> comments</span></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <a class="btn" href="/?${f.type === 'short' ? 'short=' : 'film='}${f.id}" target="_blank" style="text-align:center;text-decoration:none;">↗ Open</a>
        <button class="btn" onclick="adminEditPost('${f.id}')">✏️ Edit</button>
        <button class="btn ${f.adminBoosted ? 'btn-ok' : ''}" onclick="adminBoostPost('${f.id}')">${f.adminBoosted ? '📌 Unboost' : '📌 Pin/Boost'}</button>
        <button class="btn btn-danger" onclick="adminDeletePost('${f.id}')">🗑️ Delete</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">No matching posts found.</div>';
}
async function adminEditPost(id){
  const f = CM_LIST.find(x => x.id === id);
  if (!f) return;
  const title = prompt('Edit post title:', f.title || '');
  if (title === null) return;
  const description = prompt('Edit post description / hashtags:', f.description || '');
  if (description === null) return;
  const isSensitive = confirm('Mark this post as 18+ / Sensitive content?\n(Click OK for 18+ Sensitive, Cancel for Normal)');
  try {
    const res = await fetch('/api/admin/content/' + id + '/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-no-prompt': '1' },
      body: JSON.stringify({ title: title.trim() || f.title, description, isSensitive })
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Edit failed');
    f.title = d.title;
    f.description = d.description;
    f.isSensitive = d.isSensitive;
    drawContentList();
  } catch (e) { alert(e.message); }
}
async function adminBoostPost(id){
  const f = CM_LIST.find(x => x.id === id);
  if (!f) return;
  try {
    const res = await fetch('/api/admin/content/' + id + '/boost', { method: 'POST', headers: { 'x-no-prompt': '1' } });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Boost failed');
    f.adminBoosted = d.adminBoosted;
    drawContentList();
  } catch (e) { alert(e.message); }
}
async function adminDeletePost(id){
  if (!confirm('Permanently delete this post and its media from R2?')) return;
  try {
    const res = await fetch('/api/admin/content/' + id + '/delete', { method: 'POST', headers: { 'x-no-prompt': '1' } });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Delete failed');
    CM_LIST = CM_LIST.filter(x => x.id !== id);
    drawContentList();
  } catch (e) { alert(e.message); }
}

// ---------------- Active Stories Manager ----------------
let ADMIN_STORIES = [];
async function renderAdminStories(){
  const v = document.getElementById('view');
  v.innerHTML = '<div class="loading">Loading active stories…</div>';
  try {
    const res = await fetch('/api/admin/stories', { headers: { 'x-no-prompt': '1' } });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Failed');
    ADMIN_STORIES = d.stories || [];
  } catch (e) { v.innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>'; return; }

  v.innerHTML = `
    <div class="row1" style="margin-bottom:12px;justify-content:space-between;">
      <h3 class="sec" style="margin:0;">🔵 Active Stories (${ADMIN_STORIES.length})</h3>
    </div>
    <div id="adminStoryRows">` +
    (ADMIN_STORIES.map(s => `
      <div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div style="width:64px;height:96px;border-radius:8px;overflow:hidden;background:#000;flex-shrink:0;">
          ${s.mediaType === 'video'
            ? `<video src="${esc(s.mediaUrl)}#t=0.5" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;"></video>`
            : `<img src="${esc(s.mediaUrl)}" style="width:100%;height:100%;object-fit:cover;" loading="lazy">`}
        </div>
        <div style="flex:1;min-width:180px;">
          <div class="row1">
            <span class="name">@${esc(s.ownerUsername)}</span>
            <span class="pill g">${esc(s.mediaType)}</span>
            ${s.song ? '<span class="pill" style="background:rgba(124,92,255,0.2);color:var(--marigold);">🎵 Song</span>' : ''}
          </div>
          ${s.textOverlay ? `<div class="meta" style="font-size:12.5px;color:var(--cream);margin-top:2px;">"${esc(s.textOverlay)}"</div>` : ''}
          <div class="nums" style="margin-top:6px;"><span><b>${s.viewCount || 0}</b> views</span><span><b>${s.likeCount || 0}</b> likes</span><span>Posted ${ago(s.createdAt)}</span></div>
        </div>
        <div style="display:flex;gap:6px;">
          <a class="btn" href="${esc(s.mediaUrl)}" target="_blank" style="text-decoration:none;">↗ Open Media</a>
          <button class="btn btn-danger" onclick="adminDeleteStory('${s.id}')">🗑️ Delete</button>
        </div>
      </div>
    `).join('') || '<div class="empty">No active stories in the last 24h.</div>') +
    `</div>`;
}
async function adminDeleteStory(id){
  if (!confirm('Permanently delete this story from the platform and R2?')) return;
  try {
    const res = await fetch('/api/admin/stories/' + id + '/delete', { method: 'POST', headers: { 'x-no-prompt': '1' } });
    if (!res.ok) throw new Error('Delete failed');
    ADMIN_STORIES = ADMIN_STORIES.filter(s => s.id !== id);
    renderAdminStories();
  } catch (e) { alert(e.message); }
}

let userFilter = 'all', userSort = 'newest';
function renderUsers(){
  const view = document.getElementById('view');
  const all = D.users || [];
  view.innerHTML = `
    <div class="row1" style="gap:8px;margin-bottom:10px;justify-content:space-between;flex-wrap:wrap;">
      <div id="userFilterTabs" style="display:flex;gap:6px;overflow-x:auto;"></div>
      <select class="adm-select" onchange="userSort=this.value;drawUsers()">
        <option value="newest" ${userSort === 'newest' ? 'selected' : ''}>🆕 Newest Joined</option>
        <option value="active" ${userSort === 'active' ? 'selected' : ''}>🟢 Recently Active</option>
        <option value="posts" ${userSort === 'posts' ? 'selected' : ''}>🎬 Most Posts</option>
        <option value="followers" ${userSort === 'followers' ? 'selected' : ''}>👥 Most Followers</option>
      </select>
    </div>
    <input class="search" id="uq" placeholder="🔍 Search by @username, email or role tag…" value="${esc(q)}">
    <div id="ulist"></div>
  `;
  const input = document.getElementById('uq');
  input.addEventListener('input', () => { q = input.value; drawUsers(); });
  drawUsers();
}
function drawUsers(){
  const all = D.users || [];
  const tabsBox = document.getElementById('userFilterTabs');
  if (tabsBox) {
    const onCnt = all.filter(u => u.online).length;
    const verCnt = all.filter(u => u.verified).length;
    const roleCnt = all.filter(u => u.roleBadge).length;
    const susCnt = all.filter(u => u.suspended).length;
    const repCnt = all.filter(u => u.reports > 0).length;
    tabsBox.innerHTML = `
      <button class="tab ${userFilter === 'all' ? 'active' : ''}" onclick="userFilter='all';drawUsers()">All (${all.length})</button>
      <button class="tab ${userFilter === 'online' ? 'active' : ''}" onclick="userFilter='online';drawUsers()">🟢 Online (${onCnt})</button>
      <button class="tab ${userFilter === 'verified' ? 'active' : ''}" onclick="userFilter='verified';drawUsers()">✔ Verified (${verCnt})</button>
      <button class="tab ${userFilter === 'role' ? 'active' : ''}" onclick="userFilter='role';drawUsers()">🏷️ Role Tagged (${roleCnt})</button>
      <button class="tab ${userFilter === 'suspended' ? 'active' : ''}" onclick="userFilter='suspended';drawUsers()">🚫 Suspended (${susCnt})</button>
      <button class="tab ${userFilter === 'reported' ? 'active' : ''}" onclick="userFilter='reported';drawUsers()">🚩 Reported (${repCnt})</button>
    `;
  }
  const t = q.trim().toLowerCase();
  const rows = all.filter(u => {
    if (userFilter === 'online' && !u.online) return false;
    if (userFilter === 'verified' && !u.verified) return false;
    if (userFilter === 'role' && !u.roleBadge) return false;
    if (userFilter === 'suspended' && !u.suspended) return false;
    if (userFilter === 'reported' && !(u.reports > 0)) return false;
    if (t && !(u.username || '').toLowerCase().includes(t) && !(u.email || '').toLowerCase().includes(t) && !(u.roleBadge || '').toLowerCase().includes(t)) return false;
    return true;
  });
  rows.sort((a, b) => {
    if (userSort === 'active') return new Date(b.lastActiveAt || 0) - new Date(a.lastActiveAt || 0);
    if (userSort === 'posts') return (b.posts || 0) - (a.posts || 0);
    if (userSort === 'followers') return (b.followers || 0) - (a.followers || 0);
    return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
  });
  document.getElementById('ulist').innerHTML = rows.length ? rows.map(userCard).join('') : '<div class="empty">No matching users found.</div>';
}

let actFilter = 'all', actSearch = '';
function renderActivity(){
  const icon = { signup: '🆕', upload: '⬆️', comment: '💬', story: '🔵' };
  const label = { signup: 'signup', upload: 'upload', comment: 'comment', story: 'story' };
  const all = D.activity || [];
  const sq = actSearch.trim().toLowerCase();
  const rows = all.filter(e => {
    if (actFilter !== 'all' && e.type !== actFilter) return false;
    if (sq && !((e.username || '') + ' ' + (e.text || '')).toLowerCase().includes(sq)) return false;
    return true;
  });
  document.getElementById('view').innerHTML = `
    <div class="row1" style="gap:8px;margin-bottom:12px;justify-content:space-between;flex-wrap:wrap;">
      <div style="display:flex;gap:6px;overflow-x:auto;">
        <button class="tab ${actFilter === 'all' ? 'active' : ''}" onclick="actFilter='all';renderActivity()">All (${all.length})</button>
        <button class="tab ${actFilter === 'signup' ? 'active' : ''}" onclick="actFilter='signup';renderActivity()">🆕 Signups (${all.filter(x => x.type === 'signup').length})</button>
        <button class="tab ${actFilter === 'upload' ? 'active' : ''}" onclick="actFilter='upload';renderActivity()">⬆️ Uploads (${all.filter(x => x.type === 'upload').length})</button>
        <button class="tab ${actFilter === 'comment' ? 'active' : ''}" onclick="actFilter='comment';renderActivity()">💬 Comments (${all.filter(x => x.type === 'comment').length})</button>
        <button class="tab ${actFilter === 'story' ? 'active' : ''}" onclick="actFilter='story';renderActivity()">🔵 Stories (${all.filter(x => x.type === 'story').length})</button>
      </div>
      <input type="text" placeholder="🔍 Filter activity…" value="${esc(actSearch)}" oninput="actSearch=this.value;renderActivity()" style="padding:7px 12px;border-radius:20px;border:1px solid var(--gold-line);background:var(--field);color:var(--cream);font-size:12.5px;outline:none;">
    </div>
  ` + (rows.length
    ? '<div class="card">' + rows.map(e => `
        <div class="ev"><div class="ic">${icon[e.type] || '•'}</div>
          <div><div class="txt"><b>@${esc(e.username || 'unknown')}</b> · ${label[e.type] || e.type}<br>${esc(e.text)}</div>
          <div class="when">${ago(e.at)}</div></div></div>`).join('') + '</div>'
    : '<div class="empty">No matching activity found.</div>');
}

async function toggleSuspend(id){
  const u = D.users.find(x => x.id === id);
  if (!u) return;
  if (!confirm(u.suspended ? '@' + u.username + ' ko unsuspend karna hai?' : '@' + u.username + ' ko suspend karna hai? Wo login no kar paayega aur uska session bhi band ho jayega.')) return;
  try {
    const res = await fetch('/api/admin/users/' + id + '/suspend', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    u.suspended = data.suspended;
    D.overview.suspended += data.suspended ? 1 : -1;
    render();
  } catch (e) { alert(e.message); }
}
