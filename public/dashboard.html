<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>YouSeries — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B0A1F;--panel:#16122E;--marigold:#7C5CFF;--vermilion:#4361EE;--cream:#EDEBFF;--cream-dim:#A9A3C9;--gold-line:rgba(124,92,255,0.35);--ok:#5ad19a;--bad:#e88a8a;--field:rgba(255,255,255,.06);--chip:rgba(124,92,255,.2);}
  html[data-theme="light"]{--ink:#FFFFFF;--panel:#F4F3FA;--marigold:#5B3FE0;--vermilion:#3550D8;--cream:#15132B;--cream-dim:#5E5878;--gold-line:rgba(91,63,224,0.28);--ok:#1E8E5A;--bad:#C62E4B;--field:#FFFFFF;--chip:rgba(91,63,224,.12);}
  .themebtn{background:transparent;border:1px solid var(--gold-line);color:var(--cream);padding:6px 10px;border-radius:8px;font-size:15px;cursor:pointer;}
  .pwwrap{position:relative;width:100%;}
  .pwwrap input{padding-right:64px;}
  .pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--marigold);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px;}
  .loginbox{max-width:340px;margin:60px auto;background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;padding:22px;}
  .loginbox input{width:100%;background:var(--field);border:1px solid var(--gold-line);border-radius:10px;padding:11px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14.5px;margin-bottom:12px;}
  .loginbox button.go{width:100%;background:var(--marigold);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;}
  .hdtick{font-size:11.5px;padding:2px 8px;border-radius:10px;display:inline-block;}
  .bubble{padding:9px 12px;border-radius:12px;font-size:13.5px;margin-top:8px;max-width:92%;word-break:break-word;}
  .bubble.admin{background:var(--chip);margin-left:auto;}
  .bubble.user{background:var(--field);border:1px solid var(--gold-line);}
  .bubble small{display:block;font-size:11px;color:var(--cream-dim);margin-top:3px;}
  :root{--ink:#0B0A1F;--panel:#16122E;--marigold:#7C5CFF;--vermilion:#4361EE;--cream:#EDEBFF;--cream-dim:#A9A3C9;--gold-line:rgba(124,92,255,0.35);--ok:#5ad19a;--bad:#e88a8a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;padding:20px 16px 70px;transition:background .2s,color .2s;}
  .wrap{max-width:760px;margin:0 auto;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  h1{font-family:'Baloo 2',sans-serif;color:var(--marigold);font-size:24px;margin:0;}
  p.sub{color:var(--cream-dim);font-size:13.5px;margin:0 0 16px;}
  a.link{color:var(--marigold);font-size:13px;font-weight:600;text-decoration:none;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .tab{flex-shrink:0;background:transparent;border:1px solid var(--gold-line);color:var(--cream-dim);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Mukta',sans-serif;}
  .tab.active{background:var(--marigold);border-color:var(--marigold);color:#fff;}
  .btn{background:transparent;border:1px solid var(--gold-line);color:var(--cream);padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Mukta',sans-serif;}
  .btn-danger{border-color:#E63950;color:var(--bad);}
  .btn-ok{border-color:var(--ok);color:var(--ok);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat{background:var(--panel);border:1px solid var(--gold-line);border-radius:12px;padding:14px;}
  .stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:26px;line-height:1.1;}
  .stat span{font-size:12.5px;color:var(--cream-dim);}
  .stat.warn b{color:#ffcf5c;}
  .card{background:var(--panel);border:1px solid var(--gold-line);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
  .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .name{font-weight:700;font-size:15px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block;}
  .dot.on{background:var(--ok);}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;}
  .pill.sus{background:rgba(230,57,80,.2);color:var(--bad);}
  .pill.g{background:rgba(67,97,238,.25);color:#8fa8ff;}
  .pill.rep{background:rgba(255,180,0,.2);color:#ffcf5c;}
  .meta{font-size:12px;color:var(--cream-dim);margin-top:4px;word-break:break-word;}
  .nums{display:flex;gap:14px;font-size:12px;color:var(--cream-dim);margin-top:8px;flex-wrap:wrap;}
  .nums b{color:var(--cream);}
  .push{margin-left:auto;}
  input.search{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--gold-line);border-radius:10px;padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;margin-bottom:12px;}
  .ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);}
  .ev:last-child{border-bottom:none;}
  .ev .ic{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
  .ev .txt{font-size:13.5px;word-break:break-word;}
  .ev .when{font-size:11.5px;color:var(--cream-dim);}
  .empty,.loading{color:var(--cream-dim);font-size:14px;text-align:center;padding:40px 0;}
  .meter{margin-top:8px;height:9px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;}
  .meter i{display:block;height:100%;background:var(--marigold);border-radius:6px;}
  .meter i.warn{background:#ffcf5c;} .meter i.bad{background:#e63950;}
  .big{font-family:'Baloo 2',sans-serif;font-size:22px;line-height:1.2;}
  .chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:12px;background:rgba(124,92,255,.2);color:var(--cream);margin:3px 4px 0 0;}
  .warnbox{background:rgba(255,180,0,.12);border:1px solid #ffcf5c;color:#ffe3a0;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  textarea.t{width:100%;min-height:90px;background:rgba(255,255,255,.06);border:1px solid var(--gold-line);border-radius:10px;padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;resize:vertical;}
  .vtick{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#3897f0;color:#fff;font-size:9.5px;font-weight:800;}
  h3.sec{font-size:13px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px;}
</style>
</head>
<body>
<div class="wrap" id="appWrap">
  <div class="top">
    <h1>📊 Dashboard</h1>
    <div style="display:flex;gap:8px;align-items:center;"><button class="themebtn" id="themeBtn" onclick="toggleTheme()" title="Dark / White mode">🌙</button><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" id="logoutBtn" onclick="adminLogout()" style="display:none;">Logout</button></div>
  </div>
  <p class="sub" id="updated">Loading…</p>

  <div class="tabs">
    <button class="tab active" data-t="overview" onclick="setTab('overview')">Overview</button>
    <button class="tab" data-t="reports" id="reportsTab" onclick="setTab('reports')">Reports</button>
    <button class="tab" data-t="users" onclick="setTab('users')">Users</button>
    <button class="tab" data-t="helpdesk" id="hdTab" onclick="setTab('helpdesk')">Help Desk</button>
    <button class="tab" data-t="bluetick" onclick="setTab('bluetick')">✔ Blue tick</button>
    <button class="tab" data-t="trending" onclick="setTab('trending')">Trending</button>
    <button class="tab" data-t="tools" onclick="setTab('tools')">Tools</button>
    <button class="tab" data-t="activity" onclick="setTab('activity')">Activity</button>
  </div>

  <div id="view"><div class="loading">Loading…</div></div>
</div>
<div class="wrap" id="loginWrap" style="display:none;">
  <div class="loginbox">
    <div style="font-family:'Baloo 2',sans-serif;font-size:22px;color:var(--marigold);margin-bottom:4px;">🔐 Admin login</div>
    <div style="font-size:13px;color:var(--cream-dim);margin-bottom:14px;">Dashboard dekhne ke liye admin username aur password daalo.</div>
    <input id="lgUser" type="text" autocomplete="username" placeholder="Username">
    <div class="pwwrap"><input id="lgPass" type="password" autocomplete="current-password" placeholder="Password"><button type="button" class="pwtoggle" onclick="togglePw('lgPass', this)">Show</button></div>
    <button class="go" onclick="adminLogin()">Login</button>
    <div id="lgErr" style="color:var(--bad);font-size:13px;margin-top:10px;"></div>
  </div>
</div>

<script>
let D = null, R = [], H = [], tab = 'overview', q = '';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('themeBtn'); if (b) b.textContent = t === 'light' ? '🌙' : '☀️';
  try { localStorage.setItem('dashTheme', t); } catch (e) {}
}
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
(function(){ let t = 'dark'; try { t = localStorage.getItem('dashTheme') || 'dark'; } catch (e) {} applyTheme(t); })();
function togglePw(id, btn){
  const i = document.getElementById(id);
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Hide' : 'Show';
}
function showLogin(msg){
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'block';
  document.getElementById('lgErr').textContent = msg || '';
  document.getElementById('lgPass').value = '';
  setTimeout(() => document.getElementById('lgUser').focus(), 50);
}
async function adminLogin(){
  const username = document.getElementById('lgUser').value.trim();
  const password = document.getElementById('lgPass').value;
  const err = document.getElementById('lgErr');
  if (!username || !password) { err.textContent = 'Username aur password dono likho'; return; }
  err.textContent = 'Checking…';
  try {
    const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { err.textContent = data.error || 'Login nahi hua'; return; }
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    document.getElementById('logoutBtn').style.display = '';
    load();
  } catch (e) { err.textContent = 'Network error — dobara try karo'; }
}
async function adminLogout(){
  await fetch('/api/admin/logout', { method: 'POST' }).catch(() => {});
  showLogin('Logout ho gaya');
}
function fb(b){
  b = Number(b) || 0;
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(1) + ' MB';
  return (b / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}
const meterCls = p => p >= 90 ? 'bad' : p >= 70 ? 'warn' : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(iso){
  if (!iso) return 'kabhi nahi';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'abhi abhi';
  if (s < 3600) return Math.floor(s / 60) + ' min pehle';
  if (s < 86400) return Math.floor(s / 3600) + ' ghante pehle';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' din pehle';
  return new Date(iso).toLocaleDateString();
}

async function load(){
  document.getElementById('updated').textContent = 'Loading…';
  try {
    const [res, res2, res3] = await Promise.all([fetch('/api/admin/dashboard', { headers: { 'x-no-prompt': '1' } }), fetch('/api/admin/reports', { headers: { 'x-no-prompt': '1' } }), fetch('/api/admin/helpdesk', { headers: { 'x-no-prompt': '1' } })]);
    if (res.status === 401) { showLogin(); return; }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    D = data;
    document.getElementById('appWrap').style.display = 'block';
    document.getElementById('logoutBtn').style.display = '';
    try { const rj = await res2.json(); R = res2.ok ? (rj.reports || []) : []; } catch (e) { R = []; }
    try { const hj = await res3.json(); H = res3.ok ? (hj.tickets || []) : []; } catch (e) { H = []; }
    document.getElementById('updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    document.getElementById('view').innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>';
    document.getElementById('updated').textContent = '';
  }
}

function setTab(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  render();
}

function render(){
  if (!D) return;
  const pend = R.filter(r => r.status === 'pending').length;
  D.overview.pendingReports = pend;
  document.getElementById('reportsTab').textContent = pend ? 'Reports (' + pend + ')' : 'Reports';
  const hOpen = H.filter(t => t.status === 'open').length;
  document.getElementById('hdTab').textContent = hOpen ? 'Help Desk (' + hOpen + ')' : 'Help Desk';
  if (tab === 'overview') renderOverview();
  else if (tab === 'reports') renderReports();
  else if (tab === 'helpdesk') renderHelpdesk();
  else if (tab === 'bluetick') renderBluetickAdmin();
  else if (tab === 'trending') renderTrending();
  else if (tab === 'tools') renderTools();
  else if (tab === 'users') renderUsers();
  else renderActivity();
}

function renderOverview(){
  const o = D.overview;
  const stat = (n, label, cls, go) => `<div class="stat ${cls || ''}" ${go ? `onclick="setTab('${go}')" style="cursor:pointer;"` : ''}><b>${n}</b><span>${label}</span></div>`;
  const spamUsers = D.users.filter(u => u.reports > 0 && !u.suspended).sort((a, b) => b.reports - a.reports).slice(0, 5);
  document.getElementById('view').innerHTML = usageCards() +
    '<div class="grid" style="margin-top:12px;">' +
      stat(o.onlineNow, '🟢 Abhi online') +
      stat(o.activeToday, 'Aaj active (24h)') +
      stat(o.totalUsers, 'Total users') +
      stat(o.newToday, 'Naye signup aaj') +
      stat(o.new7d, 'Naye signup (7 din)') +
      stat(o.suspended, 'Suspended') +
      stat(o.uploads24h, 'Uploads (24h)') +
      stat(o.comments24h, 'Comments (24h)') +
      stat(o.stories24h, 'Stories (24h)') +
      stat(o.pendingReports, 'Pending reports (tap)', o.pendingReports ? 'warn' : '', 'reports') +
    '</div>' +
    '<h3 class="sec">Total content</h3>' +
    '<div class="grid">' + stat(o.posts.film, 'Full videos') + stat(o.posts.short, 'Shorts') + stat(o.posts.photo, 'Photos') + '</div>' +
    (spamUsers.length ? '<h3 class="sec">Jin par reports hain</h3>' + spamUsers.map(userCard).join('') : '');
}

function driveCard(){
  const dr = D.drive || {}, eg = D.egress || {};
  if (!dr.enabled || dr.driveOnly) return '';
  if (dr.error) return `<div class="card"><b>☁️ Google Drive</b><div class="meta">❌ ${esc(dr.error)}</div></div>`;
  const p = dr.limitBytes ? Math.min(100, dr.usedBytes / dr.limitBytes * 100) : 0;
  return `<div class="card">
      <div class="row1"><b>☁️ Google Drive (videos/photos)</b></div>
      <div class="big">${fb(dr.usedBytes)} ${dr.limitBytes ? `<span style="font-size:14px;color:var(--cream-dim);">/ ${fb(dr.limitBytes)}</span>` : ''}</div>
      ${dr.limitBytes ? `<div class="meter"><i class="${meterCls(p)}" style="width:${p.toFixed(2)}%"></i></div>` : ''}
      <div class="meta">Is mahine server se stream hua: <b>${fb(eg.proxyBytes)}</b> (Render bandwidth me ginti hota hai)</div>
    </div>`;
}

function usageCards(){
  const st = D.storage || {}, eg = D.egress || {};
  const sp = st.limitBytes ? Math.min(100, st.usedBytes / st.limitBytes * 100) : 0;
  const ep = eg.allowedBytes ? Math.min(100, eg.totalBytes / eg.allowedBytes * 100) : (eg.totalBytes ? 100 : 0);
  const folders = Object.entries(st.byFolder || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="chip">${esc(k)}: ${fb(v)}</span>`).join('');
  const render = eg.mode === 'render';
  const warn = (render && ep >= 80)
    ? '<div class="warnbox">⚠️ Render ki free bandwidth (100 GB/mahina) paar hui to poori site us mahine ke liye band ho jati hai. Isliye videos ek limit pe rok diye jate hain. Zyada traffic ho to Render ka paid plan lo ya videos chhote rakho.</div>'
    : (!render && (sp >= 80 || ep >= 80))
    ? '<div class="warnbox">⚠️ IDrive free account me mahine ka download (egress) stored data ke 3 guna se zyada hua to account suspend ho sakta hai. Storage ya egress 80% ke paar hai — videos kam karo ya paid plan lo.</div>' : '';
  return `
    <div class="card">
      <div class="row1"><b>💾 Storage</b><span class="meta push" style="margin:0;">${st.objects || 0} files</span></div>
      ${st.ok ? `<div class="big">${fb(st.usedBytes)} <span style="font-size:14px;color:var(--cream-dim);">/ ${fb(st.limitBytes)}</span></div>
      <div class="meter"><i class="${meterCls(sp)}" style="width:${sp.toFixed(1)}%"></i></div>
      <div class="meta">${sp.toFixed(1)}% use hua · ${fb(Math.max(0, st.limitBytes - st.usedBytes))} bacha</div>
      <div style="margin-top:6px;">${folders}</div>` : `<div class="meta">❌ Storage ginti nahi ho payi: ${esc(st.error || 'unknown error')}</div>`}
    </div>
    <div class="card">
      <div class="row1"><b>${render ? '📡 Server bandwidth' : '📡 Egress'} (is mahine, ${esc(eg.month || '')})</b></div>
      <div class="big">${fb(eg.totalBytes)} <span style="font-size:14px;color:var(--cream-dim);">/ ${fb(eg.allowedBytes)} free</span></div>
      <div class="meter"><i class="${meterCls(ep)}" style="width:${ep.toFixed(1)}%"></i></div>
      <div class="meta">${ep.toFixed(1)}% use hua · ${render ? 'Render free plan = 5 GB/mahina (4 GB pe media rok diya jata hai)' : 'free limit = stored data ka 3 guna'}</div>
      ${render
        ? `<div class="nums"><span>Videos/photos stream hue: <b>${fb(eg.proxyBytes)}</b> (exact)</span><span>${eg.views || 0} views</span></div>
           <div class="meta" style="margin-top:6px;">Asli number: Render dashboard → service → Metrics. Server restart pe ye ginti thodi kam dikh sakti hai.</div>`
        : `<div class="nums"><span>Server reads: <b>${fb(eg.jsonBytes)}</b> (exact)</span><span>Videos/photos: <b>~${fb(eg.mediaBytes)}</b> (andaza, ${eg.views || 0} views)</span></div>
           <div class="meta" style="margin-top:6px;">Asli number ke liye: IDrive e2 → Billing → Billing Overview. Server restart hone par ye ginti thodi kam dikh sakti hai.</div>`}
      ${warn}
    </div>`;
}

function userCard(u){
  return `
    <div class="card" id="u-${u.id}">
      <div class="row1">
        <span class="dot ${u.online ? 'on' : ''}"></span>
        <span class="name">@${esc(u.username)}${u.verified ? ' <span class="vtick">✔</span>' : ''}</span>
        ${u.suspended ? '<span class="pill sus">suspended</span>' : ''}
        ${u.google ? '<span class="pill g">google</span>' : ''}
        ${u.reports ? `<span class="pill rep">${u.reports} report${u.reports > 1 ? 's' : ''}</span>` : ''}
        <button class="btn push ${u.suspended ? 'btn-ok' : 'btn-danger'}" onclick="toggleSuspend('${u.id}')">${u.suspended ? 'Unsuspend' : 'Suspend'}</button>
      </div>
      <div class="meta">${esc(u.email || '')}</div>
      <div class="meta">Joined: ${ago(u.createdAt)} · Last active: ${u.online ? '🟢 abhi online' : ago(u.lastActiveAt)}</div>
      <div class="nums"><span><b>${u.posts}</b> posts</span><span><b>${u.comments}</b> comments</span><span><b>${u.followers}</b> followers</span></div>
      <div class="row1" style="margin-top:10px;">
        <button class="btn" onclick="toggleVerify('${u.id}')">${u.verified ? '✔ Verified hatao' : '✔ Verify karo'}</button>
        <button class="btn btn-danger" onclick="deleteUser('${u.id}')">🗑️ Account delete</button>
      </div>
    </div>`;
}

const REASONS = { spam: 'Spam', nudity: 'Nudity or sexual content', harassment: 'Harassment or bullying', violence: 'Violence or dangerous content',
  hate_speech: 'Hate speech', misinformation: 'False information', other: 'Something else', 'auto-spam': 'Auto-flagged: repeated/link-heavy' };

const AUTO_REASON = 'Ek hi comment baar-baar ya ek se zyada link wala comment: spam check ne ise rok ke report banaya. Dekho aur confirm karo.';
function reportCard(r){
  const target = D.users.find(u => u.id === r.targetOwnerId);
  const pending = r.status === 'pending';
  const canRemove = (r.type === 'post' || r.type === 'comment') && pending;
  return `
    <div class="card">
      <div class="row1">
        <span class="pill g">${esc(r.type)}</span>
        ${r.reason === 'auto-spam' ? '<span class="pill rep">auto-flagged</span>' : ''}
        <span class="meta" style="margin:0 0 0 auto;">${esc(r.status)} · ${ago(r.createdAt)}</span>
      </div>
      <div class="name" style="margin-top:8px;">${esc(REASONS[r.reason] || r.reason)}</div>
      ${r.reason === 'auto-spam' ? `<div class="meta" style="color:#ffcf5c;">ℹ️ ${esc(AUTO_REASON)}</div>` : ''}
      ${r.targetPreview ? `<div class="meta">"${esc(String(r.targetPreview).slice(0, 200))}"</div>` : ''}
      <div class="meta">Report kiya: @${esc(r.reporterUsername || 'unknown')}${r.note ? ' · ' + esc(r.note) : ''}</div>
      ${target ? `<div class="meta">Jis par report hai: <b>@${esc(target.username)}</b>${target.suspended ? ' (suspended)' : ''}</div>` : ''}
      ${pending ? `<div class="row1" style="margin-top:10px;">
        <button class="btn" onclick="dismissReport('${r.id}')">Dismiss</button>
        ${canRemove ? `<button class="btn btn-danger" onclick="removeReported('${r.id}')">Remove content</button>` : ''}
        ${target ? `<button class="btn ${target.suspended ? 'btn-ok' : 'btn-danger'}" onclick="toggleSuspend('${target.id}')">${target.suspended ? 'Unsuspend user' : 'Suspend user'}</button>` : ''}
      </div>` : ''}
    </div>`;
}
function renderReports(){
  const pend = R.filter(r => r.status === 'pending'), old = R.filter(r => r.status !== 'pending').slice(0, 20);
  document.getElementById('view').innerHTML =
    (pend.length ? pend.map(reportCard).join('') : '<div class="empty">✅ Koi pending report nahi hai.</div>') +
    (old.length ? '<h3 class="sec">Purani reports</h3>' + old.map(reportCard).join('') : '');
}
async function dismissReport(id){
  try {
    const res = await fetch('/api/admin/reports/' + id + '/dismiss', { method: 'POST' });
    if (!res.ok) throw new Error('Failed');
    const r = R.find(x => x.id === id); if (r) r.status = 'dismissed';
    render();
  } catch (e) { alert(e.message); }
}
async function removeReported(id){
  if (!confirm('Ye content permanently delete karna hai?')) return;
  try {
    const res = await fetch('/api/admin/reports/' + id + '/remove-content', { method: 'POST' });
    if (!res.ok) throw new Error('Failed');
    const r = R.find(x => x.id === id); if (r) r.status = 'resolved';
    render();
  } catch (e) { alert(e.message); }
}

function renderHelpdesk(){
  const v = document.getElementById('view');
  if (!H.length) { v.innerHTML = '<div class="empty">Abhi koi help desk message nahi aaya.</div>'; return; }
  v.innerHTML = H.map(t => {
    const thread = (t.replies || []).map(r => `<div class="bubble ${r.from === 'admin' ? 'admin' : 'user'}">${esc(r.text)}<small>${r.from === 'admin' ? 'Tum (admin)' : esc(t.name)} · ${ago(r.at)}</small></div>`).join('');
    const st = t.status === 'open' ? '<span class="hdtick" style="background:rgba(255,180,0,.2);color:#ffcf5c;">open</span>'
      : t.status === 'answered' ? '<span class="hdtick" style="background:rgba(90,209,154,.2);color:var(--ok);">answered</span>'
      : '<span class="hdtick" style="background:var(--field);color:var(--cream-dim);">closed</span>';
    return `<div class="card">
      <div class="row1"><span class="name">${esc(t.name)}</span>${st}<span class="meta push" style="margin:0;">${ago(t.createdAt)}</span></div>
      <div class="meta">${esc(t.email || 'email nahi')} · ${t.username ? '@' + esc(t.username) : 'guest'}</div>
      <div class="bubble user" style="margin-top:10px;">${esc(t.problem)}<small>${esc(t.name)} · ${ago(t.createdAt)}</small></div>
      ${thread}
      <textarea class="t" id="hr-${t.id}" placeholder="Jawab likho… (user ko app me aur email pe dikhega)" style="margin-top:10px;min-height:70px;"></textarea>
      <div class="row1" style="margin-top:8px;">
        <button class="btn btn-ok" onclick="replyHelpdesk('${t.id}')">Jawab bhejo</button>
        <button class="btn" onclick="setHelpStatus('${t.id}','${t.status === 'closed' ? 'open' : 'closed'}')">${t.status === 'closed' ? 'Reopen' : 'Close'}</button>
      </div>
    </div>`;
  }).join('');
}
async function replyHelpdesk(id){
  const ta = document.getElementById('hr-' + id);
  const message = (ta && ta.value || '').trim();
  if (!message) { alert('Jawab likho'); return; }
  try {
    const res = await fetch('/api/admin/helpdesk/' + id + '/reply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    const t = H.find(x => x.id === id);
    if (t) { t.replies = (t.replies || []).concat([{ from: 'admin', text: message, at: new Date().toISOString() }]); t.status = 'answered'; }
    render();
    if (!data.emailed && t && t.email) alert('Jawab app me save ho gaya. Email nahi gaya (Resend ki setting check karo).');
  } catch (e) { alert(e.message); }
}
async function setHelpStatus(id, status){
  try {
    const res = await fetch('/api/admin/helpdesk/' + id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
    if (!res.ok) throw new Error('Failed');
    const t = H.find(x => x.id === id); if (t) t.status = status;
    render();
  } catch (e) { alert(e.message); }
}

let BT = null;
async function renderBluetickAdmin(){
  const v = document.getElementById('view');
  v.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch('/api/admin/bluetick', { headers: { 'x-no-prompt': '1' } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    BT = data;
  } catch (e) { v.innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>'; return; }
  const st = BT.settings || {};
  const pending = BT.requests.filter(r => r.status === 'pending');
  const done = BT.requests.filter(r => r.status !== 'pending').slice(0, 30);
  const rq = r => `<div class="card">
      <div class="row1"><span class="name">@${esc(r.username)}</span><span class="pill ${r.status === 'approved' ? 'g' : r.status === 'rejected' ? 'sus' : 'rep'}">${esc(r.status)}</span><span class="meta push" style="margin:0;">${ago(r.createdAt)}</span></div>
      <div class="meta">UTR: <b>${esc(r.utr)}</b> · ₹${esc(r.amount)}</div>
      ${r.reason ? `<div class="meta">Reason: ${esc(r.reason)}</div>` : ''}
      ${r.status === 'pending' ? `<div class="row1" style="margin-top:10px;">
        <button class="btn btn-ok" onclick="decideBluetick('${r.id}', true)">✔ Approve (30 din)</button>
        <button class="btn btn-danger" onclick="decideBluetick('${r.id}', false)">Reject</button>
      </div>` : ''}
    </div>`;
  v.innerHTML = `
    <div class="card">
      <b>💳 Payment settings</b>
      <div class="meta">Users ko yahi UPI ID aur QR dikhega. Price ₹5 se ₹49 ke beech.</div>
      <label class="meta" style="display:block;margin-top:10px;">Price (₹ / mahine)</label>
      <input id="btPrice" type="number" min="5" max="49" value="${esc(st.price || 49)}" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--gold-line);background:var(--field);color:var(--cream);box-sizing:border-box;">
      <label class="meta" style="display:block;margin-top:10px;">UPI ID</label>
      <input id="btUpi" type="text" value="${esc(st.upi || '')}" placeholder="yourname@upi" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--gold-line);background:var(--field);color:var(--cream);box-sizing:border-box;">
      <div class="row1" style="margin-top:10px;"><button class="btn btn-ok" onclick="saveBluetickSettings()">Save</button></div>
      <label class="meta" style="display:block;margin-top:14px;">QR image (UPI QR screenshot)</label>
      <input id="btQr" type="file" accept="image/*">
      <div class="row1" style="margin-top:8px;"><button class="btn" onclick="uploadBluetickQr()">QR upload karo</button>${st.qrUrl ? '<span class="meta" style="margin:0 0 0 8px;">✅ QR set hai</span>' : ''}</div>
    </div>
    <h3 class="sec">Pending (${pending.length})</h3>
    ${pending.map(rq).join('') || '<div class="empty">Koi pending request nahi.</div>'}
    <h3 class="sec">Purani requests</h3>
    ${done.map(rq).join('') || '<div class="empty">Abhi kuch nahi.</div>'}`;
}
async function decideBluetick(id, approve){
  let reason = '';
  if (!approve) { reason = prompt('Reject ka reason (user ko dikhega):', '') || ''; }
  else if (!confirm('Approve karke 30 din ka blue tick dena hai?')) return;
  try {
    const res = await fetch('/api/admin/bluetick/' + id + '/decide', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-no-prompt': '1' }, body: JSON.stringify({ approve, reason }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    renderBluetickAdmin();
  } catch (e) { alert(e.message); }
}
async function saveBluetickSettings(){
  try {
    const res = await fetch('/api/admin/bluetick/settings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-no-prompt': '1' }, body: JSON.stringify({ price: document.getElementById('btPrice').value, upi: document.getElementById('btUpi').value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    alert('Saved ✔');
    renderBluetickAdmin();
  } catch (e) { alert(e.message); }
}
async function uploadBluetickQr(){
  const f = document.getElementById('btQr').files[0];
  if (!f) { alert('QR image chuno'); return; }
  const fd = new FormData(); fd.append('qr', f);
  try {
    const res = await fetch('/api/admin/bluetick/qr', { method: 'POST', body: fd, headers: { 'x-no-prompt': '1' } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    alert('QR upload ho gaya ✔');
    renderBluetickAdmin();
  } catch (e) { alert(e.message); }
}

function renderTrending(){
  const t = D.trending || { posts: [], hashtags: [], creators: [] };
  const typeIcon = { film: '🎬', short: '⚡', photo: '🖼️', carousel: '❐' };
  document.getElementById('view').innerHTML =
    '<h3 class="sec" style="margin-top:0;">🔥 Top posts</h3>' +
    (t.posts.length ? t.posts.map((p, i) => `<div class="card"><div class="row1"><b>#${i + 1}</b><span class="name">${typeIcon[p.type] || ''} ${esc(p.title)}</span></div>
      <div class="meta">@${esc(p.owner || 'user')}</div>
      <div class="nums"><span><b>${p.views}</b> views</span><span><b>${p.likes}</b> likes</span><span><b>${p.comments}</b> comments</span></div></div>`).join('') : '<div class="empty">Abhi koi post nahi.</div>') +
    '<h3 class="sec">#️⃣ Trending hashtags (14 din)</h3>' +
    (t.hashtags.length ? '<div class="card">' + t.hashtags.map(h => `<span class="chip">#${esc(h.tag)} · ${h.count}</span>`).join('') + '</div>' : '<div class="empty">Koi hashtag nahi.</div>') +
    '<h3 class="sec">⭐ Top creators</h3>' +
    (t.creators.length ? t.creators.map((c, i) => `<div class="card"><div class="row1"><b>#${i + 1}</b><span class="name">@${esc(c.username || 'user')}</span></div><div class="nums"><span><b>${c.posts}</b> posts</span><span><b>${c.score}</b> score</span></div></div>`).join('') : '<div class="empty">Koi creator nahi.</div>');
}

let ANN = [], BANNED = [];
async function renderTools(){
  const view = document.getElementById('view');
  view.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const [a, b] = await Promise.all([fetch('/api/admin/announcements'), fetch('/api/admin/banned-words')]);
    ANN = (await a.json()).announcements || [];
    BANNED = (await b.json()).words || [];
  } catch (e) {}
  view.innerHTML = `
    <div class="card">
      <b>📢 Announcement bhejo</b>
      <div class="meta">Sab users ko app me banner + notification list me dikhega (aur push, agar unhone allow kiya ho).</div>
      <textarea class="t" id="annText" maxlength="300" placeholder="Jaise: Naya feature aa gaya — Carousel post try karo!"></textarea>
      <div class="row1" style="margin-top:8px;"><button class="btn btn-ok" onclick="sendAnnouncement()">📢 Bhejo</button></div>
      ${ANN.length ? '<h3 class="sec">Purane announcements</h3>' + ANN.map(x => `<div class="ev" style="align-items:center;"><div class="txt" style="flex:1;">${esc(x.message)}<div class="when">${ago(x.createdAt)}</div></div><button class="btn btn-danger" onclick="deleteAnnouncement('${x.id}')">Delete</button></div>`).join('') : ''}
    </div>
    <div class="card">
      <b>🔇 Banned words</b>
      <div class="meta">Inme se koi bhi shabd comment, post title/description ya note me aaya to wo post nahi hoga. Comma ya nayi line se alag karo.</div>
      <textarea class="t" id="bannedText" placeholder="shabd1, shabd2">${esc(BANNED.join(', '))}</textarea>
      <div class="row1" style="margin-top:8px;"><button class="btn btn-ok" onclick="saveBanned()">Save</button><span class="meta" id="bannedStatus" style="margin:0;"></span></div>
    </div>
    <div class="card">
      <b>📥 Users ki list (CSV)</b>
      <div class="meta">Naam, email, join date, posts, comments, followers — Excel/Sheets me khulega.</div>
      <div class="row1" style="margin-top:8px;"><button class="btn" onclick="exportCsv()">⬇️ Download CSV</button></div>
    </div>
    <div class="card">
      <b>🚨 Report alert</b>
      <div class="meta">Naya report aate hi tumhare account (email: tumhara ALERT_EMAIL_TO) ko app me notification + push milta hai. Gmail pe mail chahiye to Render me <b>RESEND_API_KEY</b> daalo (free plan pe SMTP band hai, isliye Resend use hota hai).</div>
    </div>`;
}
async function sendAnnouncement(){
  const text = document.getElementById('annText').value.trim();
  if (!text) { alert('Message likho'); return; }
  if (!confirm('Ye message sab users ko jayega. Bhejna hai?')) return;
  try {
    const res = await fetch('/api/admin/announce', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    renderTools();
  } catch (e) { alert(e.message); }
}
async function deleteAnnouncement(id){
  if (!confirm('Ye announcement hata dein?')) return;
  try { await fetch('/api/admin/announcements/' + id + '/delete', { method: 'POST' }); renderTools(); } catch (e) { alert(e.message); }
}
async function saveBanned(){
  const status = document.getElementById('bannedStatus');
  try {
    const res = await fetch('/api/admin/banned-words', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ words: document.getElementById('bannedText').value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    status.textContent = '✅ Saved (' + data.words.length + ' shabd)';
  } catch (e) { status.textContent = '❌ ' + e.message; }
}
async function exportCsv(){
  try {
    const res = await fetch('/api/admin/users.csv');
    if (!res.ok) throw new Error('Export failed');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'youseries-users.csv';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alert(e.message); }
}
async function toggleVerify(id){
  const u = D.users.find(x => x.id === id);
  if (!u) return;
  try {
    const res = await fetch('/api/admin/users/' + id + '/verify', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    u.verified = data.verified;
    render();
  } catch (e) { alert(e.message); }
}
async function deleteUser(id){
  const u = D.users.find(x => x.id === id);
  if (!u) return;
  if (!confirm('⚠️ @' + u.username + ' ka account, saari posts, comments, stories aur messages PERMANENTLY delete ho jayenge. Wapas nahi aa sakta.\n\nPakka delete karna hai?')) return;
  const typed = prompt('Confirm karne ke liye username likho: ' + u.username);
  if (typed === null) return;
  if (typed.trim().toLowerCase() !== (u.username || '').toLowerCase()) { alert('Username match nahi hua — delete nahi kiya.'); return; }
  try {
    const res = await fetch('/api/admin/users/' + id + '/delete', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    alert('@' + u.username + ' delete ho gaya.');
    load();
  } catch (e) { alert(e.message); }
}

function renderUsers(){
  const view = document.getElementById('view');
  view.innerHTML = '<input class="search" id="uq" placeholder="Username ya email se dhundho…" value="' + esc(q) + '"><div id="ulist"></div>';
  const input = document.getElementById('uq');
  input.addEventListener('input', () => { q = input.value; drawUsers(); });
  drawUsers();
}
function drawUsers(){
  const t = q.trim().toLowerCase();
  const rows = D.users.filter(u => !t || (u.username || '').toLowerCase().includes(t) || (u.email || '').toLowerCase().includes(t));
  document.getElementById('ulist').innerHTML = rows.length ? rows.map(userCard).join('') : '<div class="empty">Koi user nahi mila.</div>';
}

function renderActivity(){
  const icon = { signup: '🆕', upload: '⬆️', comment: '💬', story: '🔵' };
  const label = { signup: 'signup', upload: 'upload', comment: 'comment', story: 'story' };
  document.getElementById('view').innerHTML = D.activity.length
    ? '<div class="card">' + D.activity.map(e => `
        <div class="ev"><div class="ic">${icon[e.type] || '•'}</div>
          <div><div class="txt"><b>@${esc(e.username || 'unknown')}</b> · ${label[e.type] || e.type}<br>${esc(e.text)}</div>
          <div class="when">${ago(e.at)}</div></div></div>`).join('') + '</div>'
    : '<div class="empty">Abhi koi activity nahi.</div>';
}

async function toggleSuspend(id){
  const u = D.users.find(x => x.id === id);
  if (!u) return;
  if (!confirm(u.suspended ? '@' + u.username + ' ko unsuspend karna hai?' : '@' + u.username + ' ko suspend karna hai? Wo login nahi kar paayega aur uska session bhi band ho jayega.')) return;
  try {
    const res = await fetch('/api/admin/users/' + id + '/suspend', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    u.suspended = data.suspended;
    D.overview.suspended += data.suspended ? 1 : -1;
    render();
  } catch (e) { alert(e.message); }
}

load();
</script>
