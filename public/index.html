document.getElementById('quickUploadForm').addEventListener('submit', function(e){
  e.preventDefault();
  const type = document.querySelector('input[name="qType"]:checked').value;
  const meta = {
    title: document.getElementById('qTitle').value,
    type,
    year: document.getElementById('qYear').value,
    language: document.getElementById('qLanguage').value,
    genre: document.getElementById('qGenre').value,
    description: document.getElementById('qDescription').value,
    isSensitive: document.getElementById('qSensitive').checked
  };

  let mainFile, posterFile = null;
  if (type === 'photo') {
    mainFile = document.getElementById('qPhoto').files[0];
    if (!mainFile) { alert('Please choose a photo file'); return; }
  } else {
    mainFile = document.getElementById('qVideo').files[0];
    if (!mainFile) { alert('Please choose a video file'); return; }
    posterFile = document.getElementById('qPoster').files[0] || null;
  }

  const DIRECT_UPLOAD_THRESHOLD = 90 * 1024 * 1024; // 90MB — avoids Render's request size limit
  const totalSize = mainFile.size + (posterFile ? posterFile.size : 0);

  closeUploadModal();

  if (totalSize > DIRECT_UPLOAD_THRESHOLD) {
    startDirectUpload(meta, mainFile, posterFile);
  } else {
    const formData = new FormData();
    Object.entries(meta).forEach(([k, v]) => formData.append(k, v));
    if (type === 'photo') formData.append('photo', mainFile);
    else {
      formData.append('video', mainFile);
      if (posterFile) formData.append('poster', posterFile);
    }
    startUploadWithProgress(formData, meta.title);
  }

  document.getElementById('quickUploadForm').reset();
  toggleQType('film');
});

function formatBytes(bytes){
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function startUploadWithProgress(formData, title){
  const banner = document.getElementById('uploadBanner');
  const fill = document.getElementById('uploadProgressFill');
  const percentEl = document.getElementById('uploadBannerPercent');
  const statsEl = document.getElementById('uploadBannerStats');
  const titleEl = document.getElementById('uploadBannerTitle');

  banner.classList.remove('hidden');
  titleEl.textContent = 'Uploading: ' + title;
  fill.style.width = '0%';
  percentEl.textContent = '0%';
  statsEl.textContent = '';

  let lastLoaded = 0;
  let lastTime = Date.now();

  const xhr = new XMLHttpRequest();
  uploadXhr = xhr;
  xhr.open('POST', '/api/films');

  xhr.upload.onprogress = function(e){
    if (!e.lengthComputable) return;
    const percent = Math.round((e.loaded / e.total) * 100);
    fill.style.width = percent + '%';
    percentEl.textContent = percent + '%';

    const now = Date.now();
    const timeDelta = (now - lastTime) / 1000;
    const bytesDelta = e.loaded - lastLoaded;
    if (timeDelta > 0.3) {
      const speedMBps = (bytesDelta / timeDelta) / (1024*1024);
      const remainingMB = ((e.total - e.loaded) / (1024*1024)).toFixed(1);
      statsEl.textContent = `${speedMBps.toFixed(1)} MB/s · ${formatBytes(e.loaded)} / ${formatBytes(e.total)} · ${remainingMB} MB left`;
      lastLoaded = e.loaded;
      lastTime = now;
    }
  };

  xhr.onload = function(){
    uploadXhr = null;
    if (xhr.status >= 200 && xhr.status < 300) {
      titleEl.textContent = '✅ Upload complete: ' + title;
      fill.style.width = '100%';
      percentEl.textContent = '100%';
      statsEl.textContent = 'Done!';
      showToast('Upload successful! 🎉');
      loadFilms();
      setTimeout(() => banner.classList.add('hidden'), 3000);
    } else {
      let msg = 'Upload failed';
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch(e){}
      titleEl.textContent = '❌ Failed: ' + msg;
      statsEl.textContent = '';
      setTimeout(() => banner.classList.add('hidden'), 4000);
    }
  };

  xhr.onerror = function(){
    uploadXhr = null;
    titleEl.textContent = '❌ Upload failed (network error)';
    setTimeout(() => banner.classList.add('hidden'), 4000);
  };

  xhr.send(formData);
      }

async function presignFile(file, folder){
  const res = await fetch('/api/upload/presign-url', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fileName: file.name, contentType: file.type, folder })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Could not prepare the upload');
  return data;
}

function putFileWithProgress(uploadUrl, file, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    uploadXhr = xhr;
    xhr.open('PUT', uploadUrl);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = function(e){
      if (e.lengthComputable) onProgress(e.loaded);
    };
    xhr.onload = function(){
      uploadXhr = null;
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error('Upload failed (status ' + xhr.status + ')'));
    };
    xhr.onerror = function(){ uploadXhr = null; reject(new Error('Network error during upload')); };
    xhr.send(file);
  });
}

async function startDirectUpload(meta, mainFile, posterFile){
  const banner = document.getElementById('uploadBanner');
  const fill = document.getElementById('uploadProgressFill');
  const percentEl = document.getElementById('uploadBannerPercent');
  const statsEl = document.getElementById('uploadBannerStats');
  const titleEl = document.getElementById('uploadBannerTitle');

  banner.classList.remove('hidden');
  titleEl.textContent = 'Uploading: ' + meta.title;
  fill.style.width = '0%';
  percentEl.textContent = '0%';
  statsEl.textContent = 'Large file — uploading directly to storage...';

  const totalBytes = mainFile.size + (posterFile ? posterFile.size : 0);

  const updateProgress = (bytesDone) => {
    const percent = Math.round((bytesDone / totalBytes) * 100);
    fill.style.width = percent + '%';
    percentEl.textContent = percent + '%';
    statsEl.textContent = `${formatBytes(bytesDone)} / ${formatBytes(totalBytes)}`;
  };

  try {
    const mainFolder = meta.type === 'photo' ? 'posters' : 'videos';
    const mainPresign = await presignFile(mainFile, mainFolder);
    await putFileWithProgress(mainPresign.uploadUrl, mainFile, (loaded) => updateProgress(loaded));

    let posterKey = null;
    if (posterFile) {
      const posterPresign = await presignFile(posterFile, 'posters');
      await putFileWithProgress(posterPresign.uploadUrl, posterFile, (loaded) => updateProgress(mainFile.size + loaded));
      posterKey = posterPresign.key;
    }

    const finalizeRes = await fetch('/api/films/finalize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...meta, mediaKey: mainPresign.key, posterKey })
    });
    const finalizeData = await finalizeRes.json();
    if (!finalizeRes.ok) throw new Error(finalizeData.error || 'Could not finish the upload');

    titleEl.textContent = '✅ Upload complete: ' + meta.title;
    fill.style.width = '100%';
    percentEl.textContent = '100%';
    statsEl.textContent = 'Done!';
    showToast('Upload successful! 🎉');
    loadFilms();
    setTimeout(() => banner.classList.add('hidden'), 3000);
  } catch (err) {
    titleEl.textContent = '❌ Failed: ' + err.message;
    statsEl.textContent = '';
    setTimeout(() => banner.classList.add('hidden'), 4000);
  }
}

// ===== Unified back-button handling for every overlay/sheet =====
// Every overlay below is opened/closed purely via the 'open' CSS class.
// We watch each one with a MutationObserver: the moment it opens we push a
// history entry; the moment it closes (via X button OR via a physical back
// press) we keep our stack in sync. Physical back always closes just the
// topmost thing instead of leaving the app.
(function(){
  const overlayIds = [
    'profileMenuOverlay','menuOverlay','editSheetOverlay','sheetOverlay','overlay',
    'storyUploadOverlay','storyViewerOverlay','storyViewsOverlay','notifOverlay',
    'chatInboxOverlay','chatConvoOverlay','chatMsgMenuOverlay','chatEditOverlay','chatMediaLightbox',
    'sendToOverlay','userListOverlay','uploadModalOverlay','otherProfileOverlay'
  ];
  const CLOSERS = {
    profileMenuOverlay: () => closeProfileMenu(),
    menuOverlay: () => closeMenu(),
    editSheetOverlay: () => closeEditSheet(),
    sheetOverlay: () => closeSheet(),
    overlay: () => closeModal(),
    storyUploadOverlay: () => closeStoryUploadModal(),
    storyViewerOverlay: () => closeStoryViewer(),
    storyViewsOverlay: () => closeStoryViewsSheet(),
    notifOverlay: () => closeNotifications(),
    chatInboxOverlay: () => closeChatInbox(),
    chatConvoOverlay: () => closeChatConvo(),
    chatMsgMenuOverlay: () => closeChatMsgMenu(),
    chatEditOverlay: () => closeChatEdit(),
    chatMediaLightbox: () => closeChatMediaLightbox(),
    sendToOverlay: () => closeSendTo(),
    userListOverlay: () => closeUserList(),
    otherProfileOverlay: () => closeOtherProfile(),
    uploadModalOverlay: () => closeUploadModal()
  };

  let navStack = [];            // ids currently pushed into browser history, in open order
  let poppingFromBack = false;  // true while we're reacting to a real physical back press
  let selfTriggeredBackCount = 0; // how many pending history.back() calls WE issued to consume stale entries

  overlayIds.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    let wasOpen = el.classList.contains('open');
    new MutationObserver(() => {
      const nowOpen = el.classList.contains('open');
      if (nowOpen === wasOpen) return;
      if (nowOpen) {
        navStack.push(id);
        history.pushState({ ui: navStack.slice() }, '', location.pathname);
      } else {
        const idx = navStack.lastIndexOf(id);
        if (idx !== -1) navStack.splice(idx, 1);
        // Closed via its own X / tap-outside (not via a physical back press):
        // consume the history entry we pushed for it so depth never leaks.
        if (!poppingFromBack) { selfTriggeredBackCount++; history.back(); }
      }
      wasOpen = nowOpen;
    }).observe(el, { attributes: true, attributeFilter: ['class'] });
  });

  window.addEventListener('popstate', function(){
    if (selfTriggeredBackCount > 0) { selfTriggeredBackCount--; return; }
    if (navStack.length > 0) {
      const topId = navStack[navStack.length - 1];
      poppingFromBack = true;
      try { (CLOSERS[topId] || (() => {}))(); } finally { poppingFromBack = false; }
      return;
    }
    if (document.getElementById('shortsView').classList.contains('active')) {
      exitShorts();
      history.pushState({ page: 'home' }, '', location.pathname);
      return;
    }
    // Nothing open, not in Shorts — this is the "top" of the app. Re-plant the
    // base state so a physical back press never throws the user out of the
    // app entirely; it just stays put on Home.
    history.pushState({ page: 'home' }, '', location.pathname);
  });
})();
