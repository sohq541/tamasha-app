<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YouSeries</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0A1F">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0A1F; --panel:#16122E; --marigold:#7C5CFF; --marigold-deep:#5B3FE0;
    --vermilion:#4361EE; --cream:#EDEBFF; --cream-dim:#A9A3C9; --gold-line: rgba(124,92,255,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;height:100%;overscroll-behavior:none;touch-action:manipulation;}
  a{color:inherit;text-decoration:none;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--gold-line);}
  .brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:var(--marigold);}
  .header-right{display:flex;align-items:center;gap:14px;}

  html,body{padding-bottom:62px;}
  body.shorts-mode{padding-bottom:0;}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;justify-content:space-around;align-items:center;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--gold-line);border-bottom:none;
    background:var(--ink);}
  .tab-btn{background:transparent;border:none;color:var(--cream-dim);padding:9px 16px;flex:1;max-width:64px;
    border-radius:18px;font-family:'Mukta',sans-serif;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s ease;}
  .tab-btn svg{width:25px;height:25px;display:block;}
  .tab-btn.active{background:rgba(255,255,255,0.12);color:var(--cream);}
  .tab-btn.active svg path[fill="currentColor"]{fill:var(--cream);}
  .tab-btn .mini-avatar{width:25px;height:25px;margin-right:0;border:1.5px solid transparent;}
  .tab-btn.active .mini-avatar{border-color:var(--cream);}
  .tab-btn.has-dot::after{content:'';position:absolute;top:4px;right:12px;width:9px;height:9px;border-radius:50%;
    background:#FF5C5C;border:1.5px solid var(--ink);}
  .tab-badge{position:absolute;top:2px;right:10px;background:#FF5C5C;color:#fff;font-size:9.5px;font-weight:700;
    border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;
    border:1.5px solid var(--ink);}

  body.shorts-mode header, body.shorts-mode .tabs{display:none;}

  .shorts-header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 0;}
  .section-title{font-family:'Baloo 2',sans-serif;font-size:18px;color:var(--marigold);margin:0;white-space:nowrap;}
  .search-wrap{flex:1;max-width:220px;}
  #searchView .search-wrap{max-width:none;padding:14px 24px 0;}
  #searchView .search-results{padding-top:10px;}
  .search-placeholder{text-align:center;color:var(--cream-dim);padding:60px 20px;font-size:14px;}
  .search-wrap input{
    width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:999px;
    padding:9px 16px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
  }
  .search-results{padding:0 24px 10px;}
  .search-result-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;}
  .search-result-thumb{width:44px;height:62px;border-radius:6px;object-fit:cover;background:linear-gradient(150deg,#3A2E7A,#4361EE);flex-shrink:0;}
  .search-result-info{display:flex;flex-direction:column;}
  .search-result-title{font-size:14px;font-weight:600;color:var(--cream);}
  .search-result-tag{font-size:12px;color:var(--marigold);}

  .shorts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 24px 10px;}
  .shorts-grid-item{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:linear-gradient(150deg,#3A2E7A,#4361EE);cursor:pointer;}
  .shorts-grid-item img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .shorts-grid-play{position:absolute;top:8px;left:8px;color:#fff;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,0.7);}
  .shorts-grid-views{position:absolute;bottom:8px;left:8px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.7);display:flex;align-items:center;gap:4px;}

  .grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 10px 12px 30px;
  max-width: 520px;
  margin: 0 auto;
}
.card {
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: hidden;
  position: relative;
  margin-bottom: 20px;
}
.card-header-row {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 14px 26px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
}
.card-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  background: linear-gradient(150deg,#3A2E7A,#4361EE);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,0.85);
  flex-shrink: 0;
}
.card-username {
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  text-shadow: 0 1px 4px rgba(0,0,0,0.7);
}
.feed-follow-btn{background:var(--marigold);border:none;color:#fff;font-size:12px;font-weight:700;
  border-radius:6px;padding:4px 12px;cursor:pointer;margin-left:6px;font-family:'Mukta',sans-serif;}
.card-media-box {
  width: 100%;
  aspect-ratio: 9 / 16;
  max-height: 82vh;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.card-media-box img, .card-media-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.mute-toggle-btn{
  position:absolute; bottom:12px; right:12px; z-index:5;
  width:34px; height:34px; border-radius:50%; border:none;
  background:rgba(0,0,0,0.55); color:#fff; font-size:15px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.card-actions-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 14px 4px;
}
.feed-act-btn {
  background: transparent;
  border: none;
  color: var(--cream);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Mukta', sans-serif;
  font-weight: 600;
}
.feed-act-btn.liked {
  color: #ff3366;
}
.card-caption-area {
  padding: 4px 14px 12px;
  font-size: 13.5px;
  line-height: 1.4;
}
  .empty{padding:60px 44px;color:var(--cream-dim);text-align:center;}
  .empty a{color:var(--marigold);}

  .modal-overlay{position:fixed;inset:0;background:rgba(5,4,15,0.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:125;overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;max-width:820px;width:100%;overflow:hidden;margin:auto;}
  .modal video{width:100%;display:block;background:#000;max-height:60vh;}
  .modal-body{padding:20px 24px;}
  .modal-body h2{font-family:'Baloo 2',sans-serif;margin:0 0 4px;}
  .modal-owner{font-size:13px;color:var(--marigold);margin:0 0 8px;cursor:pointer;text-decoration:underline;display:inline-block;}
  .modal-body p{color:var(--cream-dim);line-height:1.6;}
  .modal-close{float:right;background:transparent;border:1px solid var(--gold-line);color:var(--cream);border-radius:8px;padding:6px 14px;cursor:pointer;}
  .action-row{display:flex;align-items:center;gap:14px;margin:16px 0 4px;}
  .action-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);
    color:var(--cream);padding:9px 16px;border-radius:999px;cursor:pointer;font-family:'Mukta',sans-serif;font-size:14px;}
  .action-btn:hover{background:rgba(255,255,255,0.12);}
  .action-btn.liked{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
  .action-btn:disabled{cursor:default;}
  .view-count{font-size:13px;color:var(--cream-dim);margin-left:auto;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--marigold);color:#fff;
    padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:200;display:none;}

  .comments-section{margin-top:22px;border-top:1px solid var(--gold-line);padding-top:16px;}
  .comments-section h3{font-family:'Baloo 2',sans-serif;font-size:16px;margin:0 0 12px;color:var(--marigold);}
  .comment-form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .comment-form input, .comment-form textarea{
    background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
  }
  .comment-form textarea{resize:vertical;min-height:50px;}
  .comment-form button{align-self:flex-end;background:var(--marigold);color:#fff;border:none;border-radius:8px;
    padding:8px 18px;font-weight:600;cursor:pointer;font-size:13.5px;}
  .comment-list{display:flex;flex-direction:column;gap:12px;max-height:220px;overflow-y:auto;}
  .comment-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 12px;}
  .comment-name{font-weight:600;font-size:13.5px;color:var(--marigold);}
  .comment-text{font-size:13.5px;color:var(--cream);margin-top:3px;line-height:1.5;}
  .comment-empty{color:var(--cream-dim);font-size:13.5px;}

  #shortsView{position:fixed;inset:0;z-index:40;display:none;}
  #shortsView.active{display:block;}
  .shorts-container{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;}
  .short-item{
    height:100vh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;position:relative;
    display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;
  }
  .short-item::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:260px;z-index:4;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);pointer-events:none;
  }
  .short-item video{width:100%;height:100%;object-fit:contain;background:#000;}
  .short-exit{
    position:fixed;top:18px;left:16px;z-index:60;background:rgba(0,0,0,0.45);border:none;
    color:#fff;width:62px;height:62px;border-radius:50%;font-size:36px;font-weight:700;
    display:flex;align-items:center;justify-content:center;text-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  .short-info{position:absolute;left:18px;bottom:34px;right:100px;color:#fff;z-index:5;}
  .short-owner{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;margin:0 0 10px;text-shadow:0 2px 12px rgba(0,0,0,0.9);cursor:pointer;}
  .short-info h3{font-family:'Baloo 2',sans-serif;font-size:36px;font-weight:800;margin:0 0 12px;text-shadow:0 2px 12px rgba(0,0,0,0.9);}
  .short-info p{font-size:21px;color:#fff;margin:0;text-shadow:0 2px 12px rgba(0,0,0,0.9);line-height:1.5;}
  .short-actions{
    position:absolute;right:14px;bottom:40px;display:flex;flex-direction:column;gap:24px;
    align-items:center;z-index:5;
  }
  .short-action-btn{
    background:transparent;border:none;color:#fff;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  .short-action-btn.liked{color:var(--vermilion);}
  .short-action-count{font-size:14px;font-weight:700;color:#fff;text-align:center;margin-top:5px;text-shadow:0 1px 5px rgba(0,0,0,0.8);}
  .short-center-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;
    color:rgba(255,255,255,0.9);z-index:6;pointer-events:none;text-shadow:0 4px 16px rgba(0,0,0,0.6);}
  .short-mute-btn{position:absolute;top:20px;right:20px;z-index:6;background:rgba(255,255,255,0.25);border:none;
    color:#fff;width:50px;height:50px;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .short-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--cream-dim);text-align:center;padding:40px;}

  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:150;}
  .sheet-overlay.open{display:flex;}
  .sheet{background:var(--panel);border-radius:16px 16px 0 0;max-width:600px;width:100%;max-height:70vh;
    display:flex;flex-direction:column;padding:18px 20px;}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sheet-header h3{font-family:'Baloo 2',sans-serif;margin:0;color:var(--marigold);font-size:16px;}
  .sheet-close{background:transparent;border:none;color:var(--cream);font-size:20px;cursor:pointer;}
  .menu-item{display:flex;align-items:center;gap:14px;padding:16px 22px;font-size:15px;color:var(--cream);cursor:pointer;}
  .menu-item:hover{background:rgba(255,255,255,0.06);}

  /* -------- Instagram-style profile -------- */
  .profile-wrap{max-width:560px;margin:0 auto;padding:24px 20px;position:relative;}
  .profile-top-row{display:flex;align-items:center;gap:20px;margin-bottom:18px;}
  .profile-avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(150deg,#3A2E7A,#4361EE);
    display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-size:34px;font-weight:800;
    overflow:hidden;position:relative;flex-shrink:0;cursor:pointer;}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .avatar-camera{position:absolute;bottom:0;right:0;background:var(--marigold);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .profile-stats{display:flex;flex:1;justify-content:space-around;text-align:center;}
  .profile-stat-num{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:800;color:var(--cream);}
  .profile-stat-label{font-size:12.5px;color:var(--cream-dim);}
  .profile-username{font-family:'Baloo 2',sans-serif;font-size:17px;color:var(--marigold);margin-bottom:4px;}
  .profile-bio{font-size:14px;color:var(--cream);line-height:1.5;white-space:pre-wrap;margin-bottom:4px;}
  .profile-link{font-size:13.5px;color:var(--marigold-deep);word-break:break-all;}
  .profile-btn-row{display:flex;gap:8px;margin-top:16px;}
  .profile-btn{flex:1;background:rgba(255,255,255,0.08);border:1px solid var(--gold-line);color:var(--cream);
    border-radius:8px;padding:9px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;}
  .profile-btn.primary{background:var(--marigold);border-color:var(--marigold);color:#fff;}
  .profile-tabs-row{display:flex;gap:8px;margin:20px 0 12px;}
  .profile-mygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .profile-mygrid-item{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:linear-gradient(150deg,#3A2E7A,#4361EE);}
  .profile-mygrid-item img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}

  .settings-panel{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;padding:22px;margin-bottom:20px;}
  .settings-panel input, .settings-panel textarea, .settings-panel select{
    width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;margin-bottom:10px;
  }
  .settings-panel textarea{min-height:60px;resize:vertical;}
  .settings-save-btn{width:100%;background:var(--marigold);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;}

  .mini-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;}
  #quickUploadForm label{display:block;font-size:13px;color:var(--cream-dim);margin:12px 0 6px;}
#quickUploadForm input[type=text], #quickUploadForm textarea{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
  padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
}
#quickUploadForm textarea{min-height:60px;resize:vertical;}
#quickUploadForm input[type=file]{width:100%;color:var(--cream-dim);font-size:13px;margin-top:4px;}
#quickUploadForm .row{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;}
#quickUploadForm .row label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--cream);margin:0;}
#quickUploadForm .row input[type=radio]{width:auto;}
#quickUploadForm button[type=submit]{margin-top:18px;width:100%;background:var(--marigold);color:#fff;border:none;
  border-radius:8px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;}

.upload-banner{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:300;background:var(--panel);
  border:1px solid var(--gold-line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,0.5);
}
.upload-banner-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--cream);margin-bottom:8px;}
.upload-progress-track{background:rgba(255,255,255,0.1);border-radius:999px;height:8px;overflow:hidden;}
.upload-progress-fill{background:var(--marigold);height:100%;width:0%;transition:width 0.2s;}
.upload-banner-stats{font-size:12px;color:var(--cream-dim);margin-top:6px;}
  .hidden{display:none !important;}
/* ===== STORIES ===== */
.stories-bar{display:flex;gap:14px;overflow-x:auto;padding:14px 16px;border-bottom:1px solid var(--gold-line);-webkit-overflow-scrolling:touch;}
.stories-bar::-webkit-scrollbar{display:none;}
.story-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;cursor:pointer;width:64px;}
.story-ring{position:relative;width:60px;height:60px;border-radius:50%;padding:2.5px;display:flex;align-items:center;justify-content:center;background:linear-gradient(45deg,#7C5CFF,#B388FF,#FF9D6C);}
.story-ring.seen{background:rgba(255,255,255,0.15);}
.story-ring.add-own{background:rgba(255,255,255,0.15);}
.story-avatar-inner{width:100%;height:100%;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--cream);}
.story-avatar-inner img{width:100%;height:100%;object-fit:cover;}
.story-username{font-size:11px;color:var(--cream-dim);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.story-add-badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--marigold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:2px solid var(--ink);}

.story-upload-preview{position:relative;width:100%;max-height:60vh;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.story-upload-preview img,.story-upload-preview video{max-width:100%;max-height:60vh;object-fit:contain;}
.story-upload-text-input{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#fff;font-size:20px;font-weight:700;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,0.7);outline:none;width:calc(100% - 32px);}

.story-viewer-overlay{position:fixed;inset:0;background:#000;display:none;z-index:300;flex-direction:column;}
.story-viewer-overlay.open{display:flex;}
.story-progress-row{display:flex;gap:4px;padding:8px 8px 0;}
.story-progress-track{flex:1;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;}
.story-progress-fill{height:100%;width:0%;background:#fff;}
.story-viewer-header{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.story-viewer-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.2);}
.story-viewer-username{color:#fff;font-weight:700;font-size:14px;}
.story-viewer-time{color:rgba(255,255,255,0.6);font-size:12px;}
.story-viewer-close{margin-left:auto;background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px;}
.story-media-area{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.story-media-area img,.story-media-area video{max-width:100%;max-height:100%;object-fit:contain;}
.story-tap-zone{position:absolute;top:0;bottom:70px;width:33%;z-index:5;}
.story-tap-left{left:0;}
.story-tap-right{right:0;}
.story-text-overlay{position:absolute;left:16px;right:16px;bottom:16px;color:#fff;font-size:20px;font-weight:700;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,0.6);z-index:4;pointer-events:none;word-break:break-word;}
.story-viewer-footer{display:flex;align-items:center;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));}
.story-comment-input{flex:1;min-width:0;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.3);border-radius:999px;padding:10px 16px;color:#fff;font-size:14px;}
.story-comment-input::placeholder{color:rgba(255,255,255,0.6);}
.story-heart-btn{background:transparent;border:none;font-size:24px;cursor:pointer;color:#fff;flex-shrink:0;}
.story-views-btn{background:transparent;border:none;color:#fff;font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;white-space:nowrap;}
.story-comments-drawer{position:absolute;left:0;right:0;bottom:0;max-height:55%;background:rgba(15,13,35,0.97);border-radius:16px 16px 0 0;padding:14px;display:none;flex-direction:column;z-index:20;}
.story-comments-drawer.open{display:flex;}
.story-comments-list{overflow-y:auto;flex:1;}

.story-views-overlay{position:fixed;inset:0;background:#141225;display:none;z-index:310;flex-direction:column;}
.story-views-overlay.open{display:flex;}
.story-views-header{display:flex;justify-content:flex-end;align-items:center;padding:14px 16px;}
.story-views-header button{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;}
.story-views-preview-row{display:flex;gap:10px;padding:0 16px 18px;}
.story-views-preview-row img,.story-views-preview-row video{width:110px;height:165px;border-radius:14px;object-fit:cover;background:#000;}
.story-views-tabs{display:flex;gap:10px;padding:0 16px 16px;}
.story-views-tab{background:rgba(255,255,255,0.08);border:none;color:var(--cream-dim);padding:8px 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;}
.story-views-tab.active{background:rgba(80,140,255,0.25);color:#6EA8FF;}
.story-views-count-row{padding:0 16px 12px;}
.story-views-count{font-size:22px;font-weight:800;color:#fff;}
.story-viewer-row{display:flex;align-items:center;gap:12px;padding:10px 16px;}
.story-viewer-row img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.story-viewer-row-fallback{width:48px;height:48px;border-radius:50%;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;}
.story-viewer-row-name{color:#fff;font-size:15px;}

/* ===== CHAT / DM ===== */
.chat-full-overlay{position:fixed;top:0;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom));background:var(--ink);display:none;z-index:120;flex-direction:column;}
.chat-full-overlay.open{display:flex;}
.chat-media-lightbox{position:fixed;inset:0;background:#000;display:none;z-index:130;align-items:center;justify-content:center;}
.chat-media-lightbox.open{display:flex;}
.chat-media-lightbox img,.chat-media-lightbox video{max-width:100%;max-height:100%;object-fit:contain;}
.chat-lightbox-close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,0.15);
  border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;z-index:2;}
.chat-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--gold-line);flex-shrink:0;}
.chat-header-back{background:transparent;border:none;color:var(--cream);font-size:20px;cursor:pointer;padding:4px 6px;flex-shrink:0;}
.chat-header-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--marigold);flex-shrink:0;cursor:pointer;}
.chat-header-avatar-fallback{width:36px;height:36px;border-radius:50%;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;cursor:pointer;}
.chat-header-name{font-weight:700;color:var(--cream);font-size:15px;cursor:pointer;flex:1;}
.chat-header-icon{background:transparent;border:none;color:var(--cream);font-size:18px;cursor:pointer;padding:4px 8px;}

.chat-inbox-list{flex:1;overflow-y:auto;padding:6px 10px;}
.chat-inbox-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;}
.chat-inbox-row:active{background:rgba(255,255,255,0.05);}
.chat-inbox-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--marigold);flex-shrink:0;}
.chat-inbox-avatar-fallback{width:52px;height:52px;border-radius:50%;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;flex-shrink:0;}
.chat-inbox-info{flex:1;min-width:0;}
.chat-inbox-name{font-weight:700;color:var(--cream);font-size:14.5px;}
.chat-inbox-preview{font-size:13px;color:var(--cream-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.chat-inbox-preview.unread{color:var(--cream);font-weight:600;}
.chat-inbox-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.chat-inbox-time{font-size:11.5px;color:var(--cream-dim);}
.chat-inbox-badge{background:var(--vermilion);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}

.chat-messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
.chat-msg-row{display:flex;max-width:78%;margin-bottom:4px;flex-direction:column;}
.chat-msg-row.mine{align-self:flex-end;align-items:flex-end;}
.chat-msg-row.theirs{align-self:flex-start;align-items:flex-start;}
.chat-bubble{background:var(--panel);border:1px solid var(--gold-line);color:var(--cream);padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.4;word-break:break-word;position:relative;cursor:pointer;}
.chat-msg-row.mine .chat-bubble{background:var(--marigold);border-color:var(--marigold);color:#fff;}
.chat-bubble.media-bubble{padding:4px;background:transparent;border:none;}
.chat-bubble img.chat-media-img{max-width:220px;max-height:280px;border-radius:14px;display:block;object-fit:cover;}
.chat-bubble video.chat-media-video{max-width:220px;max-height:280px;border-radius:14px;display:block;background:#000;}
.chat-voice-bubble{display:flex;align-items:center;gap:10px;min-width:170px;}
.chat-voice-play{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:inherit;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chat-voice-wave{flex:1;height:20px;background:repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px);opacity:0.5;border-radius:4px;}
.chat-voice-duration{font-size:12px;opacity:0.85;flex-shrink:0;}
.chat-short-bubble{width:180px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);padding:0;}
.chat-short-bubble img{width:100%;aspect-ratio:9/14;object-fit:cover;display:block;background:#000;}
.chat-short-bubble-info{padding:8px 10px;}
.chat-short-bubble-title{font-size:12.5px;font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-short-bubble-tag{font-size:11px;color:var(--marigold);margin-top:2px;}
.chat-msg-time{font-size:10.5px;color:var(--cream-dim);margin-top:2px;padding:0 4px;}
.chat-msg-edited{font-size:10px;opacity:0.7;margin-left:4px;}
.chat-msg-unsent .chat-bubble{font-style:italic;color:var(--cream-dim) !important;background:transparent !important;border:1px dashed var(--gold-line) !important;cursor:default;}

.chat-day-divider{text-align:center;color:var(--cream-dim);font-size:11.5px;margin:14px 0 6px;align-self:center;}

.chat-input-bar{display:flex;align-items:flex-end;gap:6px;padding:10px 12px;border-top:1px solid var(--gold-line);flex-shrink:0;background:var(--ink);}
.chat-input-icon-btn{background:transparent;border:none;color:var(--cream-dim);font-size:20px;cursor:pointer;padding:6px;flex-shrink:0;}
.chat-input-icon-btn.recording{color:#FF5C5C;}
.chat-text-input{flex:1;min-height:38px;max-height:100px;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:20px;padding:9px 16px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14.5px;resize:none;}
.chat-send-btn{background:var(--marigold);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chat-send-btn:disabled{opacity:0.5;}
.chat-attach-preview{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--gold-line);}
.chat-attach-preview img,.chat-attach-preview video{width:52px;height:52px;border-radius:10px;object-fit:cover;}
.chat-attach-cancel{background:transparent;border:none;color:var(--cream-dim);font-size:18px;cursor:pointer;margin-left:auto;}
.chat-recording-row{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#FF5C5C;font-size:13.5px;}
.chat-recording-dot{width:9px;height:9px;border-radius:50%;background:#FF5C5C;animation:chatPulse 1s infinite;}
@keyframes chatPulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.chat-empty{text-align:center;color:var(--cream-dim);padding:60px 20px;font-size:14px;}

.userlist-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,0.06);}
.userlist-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--marigold);flex-shrink:0;cursor:pointer;}
.userlist-avatar-fallback{width:44px;height:44px;border-radius:50%;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;cursor:pointer;}
.userlist-name{flex:1;font-size:14px;font-weight:600;color:var(--cream);cursor:pointer;}
.userlist-btn{background:rgba(255,255,255,0.08);border:1px solid var(--gold-line);color:var(--cream);padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.userlist-btn.primary{background:var(--marigold);border-color:var(--marigold);color:#fff;}
.userlist-btn.sent{background:rgba(255,255,255,0.06);color:var(--cream-dim);}

.sendto-search{width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);
  border-radius:20px;padding:10px 16px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;margin:4px 0 14px;}
.sendto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;padding:4px 0 16px;min-height:80px;}
.sendto-grid-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;background:none;border:none;padding:0;font-family:'Mukta',sans-serif;}
.sendto-grid-avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:var(--marigold);}
.sendto-grid-avatar-fallback{width:58px;height:58px;border-radius:50%;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px;}
.sendto-grid-name{font-size:12px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px;}
.sendto-grid-item.sent .sendto-grid-avatar,.sendto-grid-item.sent .sendto-grid-avatar-fallback{opacity:0.45;}
.sendto-grid-item.sent .sendto-grid-name{color:var(--cream-dim);}
.sendto-grid-check{margin-top:-2px;font-size:11px;color:var(--marigold);}
.sendto-actions{display:flex;gap:4px;padding-top:12px;border-top:1px solid var(--gold-line);}
.sendto-action-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:none;
  color:var(--cream-dim);font-size:11px;cursor:pointer;padding:6px 2px;font-family:'Mukta',sans-serif;}
.sendto-action-icon{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;
  align-items:center;justify-content:center;font-size:19px;color:var(--cream);}
</style>
</head>
<body>
<header>
  <div class="brand">YOUSERIES<div style="font-family:'Mukta',sans-serif;font-weight:600;font-size:9px;letter-spacing:1px;color:var(--cream-dim);margin-top:-2px;">VIDEO & SHORTS STREAMING</div></div>
  <div class="header-right" id="headerRight"><a href="#" onclick="openUploadModal();return false;">+ Upload</a></div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabHome" onclick="switchTab('home')" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
  </button>
  <button class="tab-btn" id="tabShorts" onclick="switchTab('shorts')" aria-label="Shorts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8.3v7.4l6.3-3.7Z" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="tab-btn" id="tabSearch" onclick="switchTab('search')" aria-label="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </button>
  <button class="tab-btn" id="tabChat" onclick="openChatInbox()" aria-label="Messages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/></svg>
    <span id="tabChatBadge" class="tab-badge hidden">0</span>
  </button>
  <button class="tab-btn" id="tabProfile" onclick="goToMyProfile()" aria-label="Profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
  </button>
</div>

<div id="homeView">
  <div class="stories-bar" id="storiesBar"></div>
  <div class="shorts-header-row">
    <h3 class="section-title" id="shortsGridTitle" style="display:none;">Shorts</h3>
  </div>
  <div class="shorts-grid hidden" id="shortsGrid"></div>
  <div id="homeMainContent">
  <div id="grid" class="grid"></div>
  </div>
</div>

<div id="searchView" class="hidden">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search films, shorts, people..." oninput="doSearch(this.value)">
  </div>
  <div class="search-results hidden" id="searchResults"></div>
  <div class="search-placeholder" id="searchPlaceholder">Kuch bhi search karo — films, shorts ya log.</div>
</div>

<div id="shortsView">
  <button class="short-exit" onclick="exitShorts()">←</button>
  <div class="shorts-container" id="shortsContainer"></div>
</div>

<div id="profileView" class="hidden">
  <div class="profile-wrap" id="profileContent"></div>
</div>

<div class="modal-overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <video id="player" controls></video>
    <img id="playerImg" style="width:100%;display:none;max-height:70vh;object-fit:contain;background:#000;">
    <div class="modal-body">
      <button class="modal-close" onclick="closeModal()">Close</button>
      <h2 id="mTitle"></h2>
      <span class="modal-owner" id="mOwner"></span>
      <p id="mMeta" style="color:var(--marigold);"></p>
      <p id="mDesc"></p>
      <div class="action-row">
        <button class="action-btn" id="likeBtn" onclick="likeCurrentFilm()">♡ <span id="likeCount">0</span></button>
        <button class="action-btn" onclick="shareCurrentFilm()">↗ Share</button>
        <button class="action-btn hidden" id="modalEditBtn" onclick="editCurrentFilmModal()">✏️ Edit</button>
        <button class="action-btn hidden" id="modalDeleteBtn" onclick="deleteCurrentFilmModal()" style="color:#e88a8a;">🗑️ Delete</button>
        <button class="action-btn" onclick="reportCurrentFilm()" style="color:var(--cream-dim);">🚩 Report</button>
        <span class="view-count" id="viewCount"></span>
      </div>
      <div class="comments-section">
        <h3>Comments</h3>
        <form class="comment-form" id="commentForm">
          <textarea id="commentText" placeholder="Add a comment..." maxlength="500" required></textarea>
          <button type="submit">Post</button>
        </form>
        <div class="comment-list" id="commentList"></div>
      </div>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-header"><h3>Comments</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <form class="comment-form" id="sheetCommentForm">
      <textarea id="sheetCommentText" placeholder="Add a comment..." maxlength="500" required></textarea>
      <button type="submit">Post</button>
    </form>
    <div class="comment-list" id="sheetCommentList" style="max-height:280px;"></div>
  </div>
</div>

<div class="sheet-overlay" id="menuOverlay" onclick="if(event.target===this) closeMenu()">
  <div class="sheet"><div id="menuItemsContainer"></div></div>
</div>

<div class="sheet-overlay" id="editSheetOverlay" onclick="if(event.target===this) closeEditSheet()">
  <div class="sheet" style="max-height:85vh;overflow-y:auto;">
    <div class="sheet-header"><h3>Edit</h3><button class="sheet-close" onclick="closeEditSheet()">✕</button></div>
    <form id="editShortForm">
      <label style="display:block;font-size:13px;color:var(--cream-dim);margin:10px 0 6px;">Title</label>
      <input type="text" id="editShortTitle" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;">
      <label style="display:block;font-size:13px;color:var(--cream-dim);margin:10px 0 6px;">Description</label>
      <textarea id="editShortDesc" style="width:100%;min-height:60px;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;"></textarea>
      <label style="display:block;font-size:13px;color:var(--cream-dim);margin:10px 0 6px;">Replace thumbnail (optional)</label>
      <input type="file" id="editShortPoster" accept="image/*" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;">
      <button type="submit" style="margin-top:16px;width:100%;background:var(--marigold);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;">Save changes</button>
      <div id="editShortStatus" style="margin-top:8px;font-size:13px;"></div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ===== STORY UPLOAD MODAL ===== -->
<div class="sheet-overlay" id="storyUploadOverlay" onclick="if(event.target===this) closeStoryUploadModal()">
  <div class="sheet" style="max-height:88vh;overflow-y:auto;">
    <div class="sheet-header"><h3>Add to Story</h3><button class="sheet-close" onclick="closeStoryUploadModal()">✕</button></div>
    <input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none;" onchange="onStoryFilePicked(event)">
    <div id="storyPickArea" onclick="document.getElementById('storyFileInput').click()" style="border:2px dashed var(--gold-line);border-radius:12px;padding:40px 16px;text-align:center;cursor:pointer;color:var(--cream-dim);">
      📷 Photo ya video chuno
    </div>
    <div class="story-upload-preview hidden" id="storyPreviewArea">
      <img id="storyPreviewImg" class="hidden">
      <video id="storyPreviewVideo" class="hidden" muted playsinline controls></video>
      <input type="text" id="storyTextOverlay" class="story-upload-text-input" placeholder="Write something (optional)" maxlength="200">
    </div>
    <button id="storyPostBtn" class="hidden" onclick="postStory()" style="width:100%;background:var(--marigold);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;">Share to Story</button>
    <div id="storyUploadStatus" style="margin-top:8px;font-size:13px;color:var(--cream-dim);"></div>
  </div>
</div>

<!-- ===== STORY VIEWS LIST (Instagram-style full screen) ===== -->
<!-- ===== NOTIFICATIONS ===== -->
<div class="sheet-overlay" id="notifOverlay" onclick="if(event.target===this) closeNotifications()">
  <div class="sheet" style="max-height:78vh;overflow-y:auto;">
    <div class="sheet-header"><h3>Notifications</h3><button class="sheet-close" onclick="closeNotifications()">✕</button></div>

<script>
  window.onerror = function(msg, url, line, col) {
  alert('JS ERROR: ' + msg + ' at line ' + line);
};
let currentFilm = null;
let currentShortId = null;
let allFilms = [];
let currentUser = null;
let viewingProfile = null;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
  function normalizeUrl(url){
  if (!url) return '#';
  if (!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
  }
function getViewedList(){ return JSON.parse(localStorage.getItem('viewedFilms') || '[]'); }
function markViewed(id){
  const list = getViewedList();
  if (!list.includes(id)) { list.push(id); localStorage.setItem('viewedFilms', JSON.stringify(list)); return true; }
  return false;
}

function closeAllOverlays(){
  const closers = {
    overlay: closeModal, profileMenuOverlay: closeProfileMenu, menuOverlay: closeMenu,
    editSheetOverlay: closeEditSheet, sheetOverlay: closeSheet, storyUploadOverlay: closeStoryUploadModal,
    storyViewerOverlay: closeStoryViewer, storyViewsOverlay: closeStoryViewsSheet,
    storyCommentsDrawer: toggleStoryCommentsDrawer, notifOverlay: closeNotifications,
    chatInboxOverlay: closeChatInbox, chatConvoOverlay: closeChatConvo,
    chatMsgMenuOverlay: closeChatMsgMenu, chatEditOverlay: closeChatEdit, chatMediaLightbox: closeChatMediaLightbox,
    sendToOverlay: closeSendTo, userListOverlay: closeUserList, uploadModalOverlay: closeUploadModal,
    otherProfileOverlay: closeOtherProfile
  };
  Object.keys(closers).forEach(id => {
    const el = document.getElementById(id);
    if (el && el.classList.contains('open')) { try { closers[id](); } catch (e) {} }
  });
}

let shortsReturnTo = null; // { type:'chat', userId, username } — where to go back to when exiting a short opened from elsewhere

function switchTab(tab){
  closeAllOverlays();
  if (tab !== 'shorts') shortsReturnTo = null;
  document.getElementById('tabHome').classList.toggle('active', tab === 'home');
  document.getElementById('tabShorts').classList.toggle('active', tab === 'shorts');
  document.getElementById('tabSearch').classList.toggle('active', tab === 'search');
  document.getElementById('tabProfile').classList.toggle('active', tab === 'profile');
  document.getElementById('homeView').classList.toggle('hidden', tab !== 'home');
  document.getElementById('searchView').classList.toggle('hidden', tab !== 'search');
  document.getElementById('shortsView').classList.toggle('active', tab === 'shorts');
  document.getElementById('profileView').classList.toggle('hidden', tab !== 'profile');
  document.body.classList.toggle('shorts-mode', tab === 'shorts');

  if (tab === 'shorts') {
    setupShortsObserver();
    const firstVideo = document.querySelector('.short-item video');
    if (firstVideo) { if (!firstVideo.src && firstVideo.dataset.src) firstVideo.src = firstVideo.dataset.src; firstVideo.play().catch(() => {}); }
  } else {
    document.querySelectorAll('.short-item video').forEach(v => v.pause());
  }
  if (tab === 'home') setupHomeVideoObserver();
  if (tab === 'profile') renderProfile();
  if (tab === 'search') setTimeout(() => document.getElementById('searchInput').focus(), 50);
}

async function loadProfile(){
  try {
    const res = await fetch('/api/me');
    currentUser = await res.json();
    const headerRight = document.getElementById('headerRight');
    const gotApp = localStorage.getItem('appDownloaded') === '1';
    if (currentUser) {
      let avatarUrl = null;
      try {
        const pubRes = await fetch('/api/users/' + currentUser.id + '/public');
        const pubData = await pubRes.json();
        avatarUrl = pubData.profileImage;
      } catch (err) {}

      headerRight.innerHTML = `
        <span id="notifBell" onclick="openNotifications()" style="position:relative;cursor:pointer;margin-right:14px;font-size:18px;">🔔<span id="notifBadge" class="hidden" style="position:absolute;top:-6px;right:-8px;background:#FF5C5C;color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;">0</span></span>
        <a href="#" onclick="openUploadModal();return false;">+ Upload</a>
      `;
      document.getElementById('tabProfile').innerHTML = avatarUrl
        ? `<img class="mini-avatar" src="${avatarUrl}">`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>`;
      pollNotificationCount();
      pollMessagesCount();
    } else {
      headerRight.innerHTML = `
        <a href="/login.html" style="margin-right:14px;">Login</a>
        ${gotApp ? '' : `<a href="https://github.com/sohq541/tamasha-app/releases/download/v1.0/Youseries.apk" onclick="localStorage.setItem('appDownloaded','1')" style="margin-right:14px;">📲 Get App</a>`}
        <a href="#" onclick="openUploadModal();return false;">+ Upload</a>
      `;
    }
  } catch (err) {}
}

function viewProfile(userId, username){
  if (!userId) return;
  if (currentUser && userId === currentUser.id) { goToMyProfile(); return; }
  const stories = (window.activeStoriesByUser || {})[userId];
  if (stories && stories.length) {
    closeModal(); closeSheet();
    openStoryViewer(userId);
    return;
  }
  openOtherProfile(userId, username);
}

function goToProfileDirect(userId, username){
  if (!userId) return;
  if (currentUser && userId === currentUser.id) { goToMyProfile(); return; }
  closeModal(); closeSheet();
  openOtherProfile(userId, username);
}

function goToMyProfile(){
  switchTab('profile');
}

  if (!userId) return;
  otherProfileUserId = userId;
  document.getElementById('otherProfileHeaderName').textContent = '@' + (username || '');
  document.getElementById('otherProfileOverlay').classList.add('open');
  await renderOtherProfile(userId, username);
}

  document.getElementById('otherProfileOverlay').classList.remove('open');
  otherProfileUserId = null;
}

  el.innerHTML = `

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function enablePushNotifications(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    showToast('This browser does not support push notifications');
    renderSettingsPrivacyMenu();
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { showToast('Notification permission was denied'); renderSettingsPrivacyMenu(); return; }
    const reg = await navigator.serviceWorker.ready;
    const keyRes = await fetch('/api/push/vapid-public-key');
    const { publicKey } = await keyRes.json();
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    await fetch('/api/push/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: sub })
    });
    localStorage.setItem('pushEnabled', '1');
    showToast('Push notifications enabled!');
  } catch (e) {
    showToast('Could not enable push notifications');
  }
  renderSettingsPrivacyMenu();
}

async function disablePushNotifications(){
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await fetch('/api/push/unsubscribe', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: sub.endpoint })
      });
      await sub.unsubscribe();
    }
  } catch (e) {}
  localStorage.setItem('pushEnabled', '0');
  showToast('Push notifications turned off');
  renderSettingsPrivacyMenu();
}

async function submitHelpDesk(){
  const name = document.getElementById('hdName').value.trim();
  const id = document.getElementById('hdId').value.trim();
  const problem = document.getElementById('hdProblem').value.trim();
  const btn = document.getElementById('hdSubmitBtn');
  const statusEl = document.getElementById('hdStatus');
  if (!problem) { showToast('Please describe your problem'); return; }
  btn.disabled = true; btn.textContent = 'Bhej rahe hain...'; statusEl.textContent = '';
  const timeoutMs = 20000;
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const res = await fetch('/api/help-desk', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, userId: id, problem }),
      signal: controller.signal
    });
    clearTimeout(timer);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong while sending');
    showToast('Sent! We\'ll reply soon.');
    renderSettingsPrivacyMenu();
  } catch (err) {
    statusEl.textContent = err.name === 'AbortError' ? 'Request timed out — the site is slow right now, please try again' : err.message;
    statusEl.style.color = '#e88a8a';
    btn.disabled = false; btn.textContent = 'Send';
  }
}

async function loadFilms() {
  try {
    const res = await fetch('/api/films');
    const data = await res.json();
    if (!res.ok || !Array.isArray(data)) throw new Error((data && data.error) || 'Could not load content');
    allFilms = shuffleArray(data);
  } catch (err) {
    allFilms = [];
    showToast('Could not load content: ' + err.message);
  }
  const shorts = allFilms.filter(f => f.type === 'short');
  renderHome(allFilms);
  renderShortsGrid(shorts);
  renderShorts(shorts);

  const params = new URLSearchParams(location.search);
  const sharedId = params.get('film');
  const shortId = params.get('short');
  const profileId = params.get('profile');

  const chatUserId = params.get('chat');

  if (sharedId) playFilm(sharedId);
  if (shortId) openShortAt(shortId);
  if (profileId) {
    const f = allFilms.find(x => x.ownerId === profileId);
    goToProfileDirect(profileId, f ? f.ownerUsername : 'user');
  }
  if (chatUserId && currentUser) {

function doSearch(query){
  const resultsEl = document.getElementById('searchResults');
  const placeholderEl = document.getElementById('searchPlaceholder');
  const q = query.trim().toLowerCase();
  if (!q) { resultsEl.classList.add('hidden'); placeholderEl.classList.remove('hidden'); return; }

  const matches = allFilms.filter(f => f.title.toLowerCase().includes(q));

  const seenUsers = new Set();
  const userMatches = [];
  allFilms.forEach(f => {
    if (f.ownerUsername && f.ownerId && !seenUsers.has(f.ownerId) && f.ownerUsername.toLowerCase().includes(q)) {
      seenUsers.add(f.ownerId);
      userMatches.push({ id: f.ownerId, username: f.ownerUsername, profileImage: f.ownerProfileImage });
    }
  });

  placeholderEl.classList.add('hidden'); resultsEl.classList.remove('hidden');

  if (matches.length === 0 && userMatches.length === 0) {
    resultsEl.innerHTML = '<p class="comment-empty">No matches found.</p>';
    return;
  }

  const userHtml = userMatches.map(u => `
    <div class="search-result-item" onclick="goToProfileDirect('${u.id}','${escapeHtml(u.username)}')">
      ${u.profileImage
        ? `<img class="search-result-thumb" src="${u.profileImage}" style="border-radius:50%;aspect-ratio:1/1;">`
        : `<div class="search-result-thumb" style="border-radius:50%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;">${escapeHtml(u.username[0].toUpperCase())}</div>`}
      <div class="search-result-info">
        <span class="search-result-title">@${escapeHtml(u.username)}</span>
        <span class="search-result-tag">Profile</span>
      </div>
    </div>
  `).join('');

  const filmHtml = matches.map(f => `
    <div class="search-result-item" onclick="${f.type === 'short' ? `openShortAt('${f.id}')` : `playFilm('${f.id}')`}">
      <img class="search-result-thumb" src="${f.posterUrl || ''}">
      <div class="search-result-info">
        <span class="search-result-title">${escapeHtml(f.title)}</span>
        <span class="search-result-tag">${f.type === 'short' ? 'Short' : 'Film'}</span>
      </div>
    </div>
  `).join('');

  resultsEl.innerHTML = userHtml + filmHtml;
}

let homeVideoObserver = null;
function tryPlayHomeVideo(video){
  video.playsInline = true;
  const p = video.play();
  if (p && p.catch) {
    p.catch(() => {
      const retry = () => { video.play().catch(() => {}); };
      video.addEventListener('canplay', retry, { once: true });
    });
  }
}
function setupHomeVideoObserver(){
  if (homeVideoObserver) homeVideoObserver.disconnect();
  const videos = document.querySelectorAll('#grid .card-media-box video');
  homeVideoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
        tryPlayHomeVideo(video);
      } else {
        video.pause();
      }
    });
  }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
  videos.forEach(v => {
    v.muted = true;
    v.playsInline = true;
    homeVideoObserver.observe(v);
  });
}

let shortsObserver = null;
function setupShortsObserver(){
  if (shortsObserver) shortsObserver.disconnect();
  const videos = document.querySelectorAll('.short-item video');
  shortsObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        if (!video.src && video.dataset.src) video.src = video.dataset.src;
        video.play().catch(() => {
          video.muted = true;
          const btn = video.closest('.short-item').querySelector('.short-mute-btn');
          if (btn) btn.textContent = '🔇';
          video.play().catch(() => {});
        });
        const id = video.dataset.id;
        if (markViewed(id)) fetch('/api/films/' + id + '/view', { method: 'POST' }).catch(() => {});
      } else {
        video.pause();
      }
    });
  }, { threshold: [0.6] });
  videos.forEach(v => shortsObserver.observe(v));
}

function storyTimeAgo(iso){
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'now';
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + 'd';
  const months = Math.floor(days / 30);
  if (months < 12) return months + 'mo';
  const years = Math.floor(days / 365);
  return years + 'y';
}

// ---- Viewer ----
function renderStoryProgressBars(count){
  const row = document.getElementById('storyProgressRow');
  row.innerHTML = Array.from({ length: count }).map((_, i) =>
    `<div class="story-progress-track"><div class="story-progress-fill" id="storyProgFill${i}"></div></div>`
  ).join('');
}

function clearStoryTimer(){
  if (storyProgressTimeoutHandle) { clearTimeout(storyProgressTimeoutHandle); storyProgressTimeoutHandle = null; }
}

function runStoryProgress(durationMs){
  const idx = currentStoryIndex;
  const group = currentStoryUserQueue[currentStoryGroupIndex];
  for (let i = 0; i < idx; i++) {
    const f = document.getElementById('storyProgFill' + i);
    if (f) { f.style.transition = 'none'; f.style.width = '100%'; }
  }
  for (let i = idx + 1; i < group.stories.length; i++) {
    const f = document.getElementById('storyProgFill' + i);
    if (f) { f.style.transition = 'none'; f.style.width = '0%'; }
  }
  storyDurationMs = durationMs;
  storyElapsedMs = 0;
  storyIsPaused = false;
  startStorySegment(durationMs);
}

function startStorySegment(remainingMs){
  const idx = currentStoryIndex;
  const fill = document.getElementById('storyProgFill' + idx);
  if (fill) {
    fill.style.transition = 'none';
    fill.style.width = (storyElapsedMs / storyDurationMs * 100) + '%';
    requestAnimationFrame(() => {
      fill.style.transition = `width ${remainingMs}ms linear`;
      fill.style.width = '100%';
    });
  }
  clearStoryTimer();
  storySegStartTime = Date.now();
  storyProgressTimeoutHandle = setTimeout(() => storyGoNext(), remainingMs);
}

function pauseStoryProgress(){
  if (storyIsPaused) return;
  storyIsPaused = true;
  storyElapsedMs = Math.min(storyDurationMs, storyElapsedMs + (Date.now() - storySegStartTime));
  clearStoryTimer();
  const fill = document.getElementById('storyProgFill' + currentStoryIndex);
  if (fill) { fill.style.transition = 'none'; fill.style.width = getComputedStyle(fill).width; }
  const vidEl = document.getElementById('storyViewVideo');
  if (vidEl && !vidEl.classList.contains('hidden')) vidEl.pause();
}

function resumeStoryProgress(){
  if (!storyIsPaused) return;
  storyIsPaused = false;
  const remaining = Math.max(250, storyDurationMs - storyElapsedMs);
  const vidEl = document.getElementById('storyViewVideo');
  if (vidEl && !vidEl.classList.contains('hidden')) vidEl.play().catch(() => {});
  startStorySegment(remaining);
}

(function setupStoryHoldToPause(){
  const area = document.getElementById('storyMediaArea');
  if (!area) return;
  let pressTimer = null;
  let longPressed = false;

  function onPressStart(){
    longPressed = false;
    pressTimer = setTimeout(() => { longPressed = true; pauseStoryProgress(); }, 180);
  }
  function onPressEnd(){
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (longPressed) resumeStoryProgress();
  }
  function onTapZoneClick(e){
    if (longPressed) { e.stopPropagation(); e.preventDefault(); longPressed = false; }
  }

  area.addEventListener('touchstart', onPressStart, { passive: true });
  area.addEventListener('touchend', onPressEnd);
  area.addEventListener('touchcancel', onPressEnd);
  area.addEventListener('mousedown', onPressStart);
  area.addEventListener('mouseup', onPressEnd);
  area.addEventListener('mouseleave', onPressEnd);
  area.querySelectorAll('.story-tap-zone').forEach(z => z.addEventListener('click', onTapZoneClick, true));
})();

function startStoryPlayback(){
  const group = currentStoryUserQueue[currentStoryGroupIndex];
  if (!group) { closeStoryViewer(); return; }
  const story = group.stories[currentStoryIndex];
  if (!story) { storyAdvanceUser(1); return; }

  document.getElementById('storyViewerAvatar').src = group.ownerProfileImage || '';
  document.getElementById('storyViewerUsername').textContent = '@' + group.ownerUsername;
  document.getElementById('storyViewerTime').textContent = storyTimeAgo(story.createdAt);
  document.getElementById('storyViewTextOverlay').textContent = story.textOverlay || '';

  const isOwner = currentUser && currentUser.id === group.ownerId;
  document.getElementById('storyOwnerViewsBtn').classList.toggle('hidden', !isOwner);
  document.getElementById('storyDeleteBtn').classList.toggle('hidden', !isOwner);
  document.getElementById('storyViewCountLabel').textContent = story.viewCount || 0;
  document.getElementById('storyCommentCountLabel').textContent = story.commentCount || 0;
  document.getElementById('storyLikeBtn').textContent = '🤍';

  const imgEl = document.getElementById('storyViewImg');
  const vidEl = document.getElementById('storyViewVideo');
  vidEl.onended = null; vidEl.onloadedmetadata = null;
  imgEl.onload = null; imgEl.onerror = null;
  clearStoryTimer();

  if (story.mediaType === 'photo') {
    vidEl.pause(); vidEl.classList.add('hidden'); vidEl.src = '';
    imgEl.classList.add('hidden');
    imgEl.onload = () => { imgEl.classList.remove('hidden'); runStoryProgress(5000); };
    imgEl.onerror = () => { imgEl.classList.remove('hidden'); runStoryProgress(5000); };
    imgEl.src = story.mediaUrl;
  } else {
    imgEl.classList.add('hidden'); imgEl.src = '';
    vidEl.src = story.mediaUrl;
    vidEl.classList.remove('hidden');
    vidEl.muted = false;
    vidEl.play().catch(() => {});
    vidEl.onloadedmetadata = () => runStoryProgress((vidEl.duration || 5) * 1000);
    vidEl.onended = () => storyGoNext();
  }

  currentStoryId = story.id;
  recordStoryView(story.id);
  loadStoryComments(story.id);
  preloadNextStoryMedia();
}

function preloadNextStoryMedia(){
  const group = currentStoryUserQueue[currentStoryGroupIndex];
  if (!group) return;
  let next = group.stories[currentStoryIndex + 1];
  if (!next) next = (currentStoryUserQueue[currentStoryGroupIndex + 1] || {}).stories?.[0];
  if (!next || !next.mediaUrl) return;
  if (next.mediaType === 'photo') { const img = new Image(); img.src = next.mediaUrl; }
  else { const v = document.createElement('video'); v.preload = 'auto'; v.src = next.mediaUrl; }
}

function storyGoNext(){
  const group = currentStoryUserQueue[currentStoryGroupIndex];
  if (currentStoryIndex < group.stories.length - 1) {
    currentStoryIndex++;
    startStoryPlayback();
  } else {
    storyAdvanceUser(1);
  }
}
function storyGoPrev(){
  if (currentStoryIndex > 0) {
    currentStoryIndex--;
    startStoryPlayback();
  } else {
    storyAdvanceUser(-1);
  }
}
function storyAdvanceUser(direction){
  currentStoryGroupIndex += direction;
  if (currentStoryGroupIndex < 0 || currentStoryGroupIndex >= currentStoryUserQueue.length) {
    closeStoryViewer();
    return;
  }
  const group = currentStoryUserQueue[currentStoryGroupIndex];
  currentStoryIndex = direction > 0 ? 0 : (group.stories.length - 1);
  renderStoryProgressBars(group.stories.length);
  startStoryPlayback();
}

function openStoryViewer(ownerId){
  if (!storyGroups.length) return;
  currentStoryUserQueue = storyGroups;
  currentStoryGroupIndex = storyGroups.findIndex(g => g.ownerId === ownerId);
  if (currentStoryGroupIndex === -1) return;
  const group = storyGroups[currentStoryGroupIndex];

  document.getElementById('storyViewerOverlay').classList.add('open');
  document.getElementById('storyCommentsDrawer').classList.remove('open');
  renderStoryProgressBars(group.stories.length);
  startStoryPlayback();
}

async function pollMessagesCount(){
  try {
    const res = await fetch('/api/conversations/unread-count');

    const label = data.unreadCount > 99 ? '99+' : data.unreadCount;
    [document.getElementById('msgBadge'), document.getElementById('tabChatBadge')].forEach(badge => {
      if (!badge) return;
      if (data.unreadCount > 0) { badge.textContent = label; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');
    });
  } catch (e) {}
  if (!chatInboxPollHandle) chatInboxPollHandle = setInterval(pollMessagesCount, 20000);

function avatarOrFallback(url, username, cls, fallbackCls){
  const letter = escapeHtml((username || '?')[0].toUpperCase());
  return url
    ? `<img class="${cls}" src="${url}">`
    : `<div class="${fallbackCls}">${letter}</div>`;
}

function chatTimeShort(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function chatDayLabel(iso){
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return 'Today';
  if (sameDay(d, yest)) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
}

async function openChatConvo(userId, usernameHint){
  if (!currentUser) { window.location.href = '/login.html'; return; }
  if (document.getElementById('chatInboxOverlay').classList.contains('open')) closeChatInbox();
  if (document.getElementById('otherProfileOverlay').classList.contains('open')) closeOtherProfile();
  stopVoiceRecording(true);
  clearChatAttachPreview();
  document.getElementById('chatTextInput').value = '';
  chatConvoId = null;
  chatOtherUser = { id: userId, username: usernameHint || '...' };
  chatMessagesCache = [];
  chatLastFetchAt = null;
  document.getElementById('chatConvoHeaderName').textContent = '@' + (usernameHint || '');
  document.getElementById('chatConvoHeaderAvatarWrap').innerHTML = avatarOrFallback(null, usernameHint, 'chat-header-avatar', 'chat-header-avatar-fallback');
  document.getElementById('chatMessagesArea').innerHTML = '<p class="comment-empty">Loading...</p>';
  document.getElementById('chatConvoOverlay').classList.add('open');

  try {

    const data = await res.json();

    chatConvoId = data.id;
    chatOtherUser = data.otherUser;
    document.getElementById('chatConvoHeaderName').textContent = '@' + data.otherUser.username;

    scrollChatToBottom();
    markChatRead();

    chatPollHandle = setInterval(pollChatMessages, 3500);

function closeChatConvo(){

  clearChatAttachPreview();
  chatConvoId = null;
  chatOtherUser = null;

async function markChatRead(){
  if (!chatConvoId) return;
  try { await fetch('/api/conversations/' + chatConvoId + '/read', { method: 'POST' }); pollMessagesCount(); } catch (e) {}
}

async function pollChatMessages(){
  if (!chatConvoId) return;
  try {
    const url = '/api/conversations/' + chatConvoId + '/messages' + (chatLastFetchAt ? ('?since=' + encodeURIComponent(chatLastFetchAt)) : '');
    const res = await fetch(url);
    const data = await res.json();
    const incoming = data.messages || [];
    if (incoming.length) {
      let hasNewFromOther = false;
      incoming.forEach(m => {
        const idx = chatMessagesCache.findIndex(x => x.id === m.id);
        if (idx === -1) { chatMessagesCache.push(m); if (m.senderId !== currentUser.id) hasNewFromOther = true; }
        else chatMessagesCache[idx] = m;
      });
      chatMessagesCache.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      chatLastFetchAt = new Date().toISOString();
      renderChatMessages();
      if (hasNewFromOther) { scrollChatToBottom(); markChatRead(); }
    }
  } catch (e) {}
}

function renderChatMessages(){
  const el = document.getElementById('chatMessagesArea');
  if (!chatMessagesCache.length) { el.innerHTML = '<div class="chat-empty">Say hi 👋</div>'; return; }
  let html = '';
  let lastDay = null;
  chatMessagesCache.forEach(m => {
    const day = chatDayLabel(m.createdAt);
    if (day !== lastDay) { html += `<div class="chat-day-divider">${day}</div>`; lastDay = day; }
    const mine = m.senderId === currentUser.id;
    html += renderChatBubble(m, mine);
  });
  el.innerHTML = html;
}

function renderChatBubble(m, mine){
  const rowCls = 'chat-msg-row ' + (mine ? 'mine' : 'theirs') + (m.unsent ? ' chat-msg-unsent' : '');
  const menuBtn = `<button class="chat-input-icon-btn" style="font-size:13px;padding:2px 6px;" onclick='openChatMsgMenu(${JSON.stringify(m.id)})'>⋮</button>`;
  let bubbleInner = '';

  if (m.unsent) {
    bubbleInner = `<div class="chat-bubble">${m.type === 'short' ? 'Short unsent' : 'Message unsent'}</div>`;
    return `<div class="${rowCls}"><div class="chat-msg-outer" style="display:flex;align-items:flex-end;gap:4px;${mine ? 'flex-direction:row-reverse;' : ''}">${bubbleInner}</div></div>`;
  }

  if (m.type === 'text') {
    bubbleInner = `<div class="chat-bubble">${escapeHtml(m.text || '')}</div>`;
  } else if (m.type === 'photo') {
    bubbleInner = `<div class="chat-bubble media-bubble"><img class="chat-media-img" src="${m.mediaUrl}" onclick="openChatMediaLightbox('${m.mediaUrl}','photo')"></div>`;
  } else if (m.type === 'video') {
    bubbleInner = `<div class="chat-bubble media-bubble"><video class="chat-media-video" src="${m.mediaUrl}" playsinline muted onclick="openChatMediaLightbox('${m.mediaUrl}','video')"></video></div>`;
  } else if (m.type === 'voice') {
    const dur = m.duration ? Math.round(m.duration) : 0;
    const mm = Math.floor(dur / 60), ss = String(dur % 60).padStart(2, '0');
    bubbleInner = `<div class="chat-bubble chat-voice-bubble" onclick="toggleVoicePlay(this,'${m.mediaUrl}')">
      <button class="chat-voice-play">▶</button><div class="chat-voice-wave"></div><span class="chat-voice-duration">${mm}:${ss}</span>
    </div>`;
  } else if (m.type === 'short') {
    bubbleInner = `<div class="chat-bubble chat-short-bubble" onclick="openSharedShort('${m.shortId}')">
      <img src="${m.shortThumb}" onerror="this.style.display='none'">
      <div class="chat-short-bubble-info">
        <div class="chat-short-bubble-title">${escapeHtml(m.shortTitle || 'Short')}</div>
        <div class="chat-short-bubble-tag">▶ ${m.shortOwnerUsername ? '@' + escapeHtml(m.shortOwnerUsername) : 'Short'}</div>
      </div>
    </div>`;
  } else {
    bubbleInner = `<div class="chat-bubble">${escapeHtml(m.text || '')}</div>`;
  }

  return `<div class="${rowCls}">
    <div class="chat-msg-outer" style="display:flex;align-items:flex-end;gap:4px;${mine ? 'flex-direction:row-reverse;' : ''}">${menuBtn}${bubbleInner}</div>
    <div class="chat-msg-time">${chatTimeShort(m.createdAt)}${m.editedAt ? '<span class="chat-msg-edited">(edited)</span>' : ''}</div>
  </div>`;
}

function toggleVoicePlay(bubbleEl, url){
  let audio = bubbleEl._audioEl;
  if (!audio) {
    audio = new Audio(url);
    bubbleEl._audioEl = audio;
    const btn = bubbleEl.querySelector('.chat-voice-play');
    audio.addEventListener('ended', () => { btn.textContent = '▶'; });
    audio.addEventListener('play', () => { btn.textContent = '⏸'; });
    audio.addEventListener('pause', () => { btn.textContent = '▶'; });
  }
  if (audio.paused) audio.play().catch(() => showToast('Could not play voice message')); else audio.pause();
}

// ---- Voice recording ----
async function toggleVoiceRecording(){
  if (chatIsRecording) { stopVoiceRecording(false); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chatRecordedChunks = [];
    chatMediaRecorder = new MediaRecorder(stream);
    chatMediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chatRecordedChunks.push(e.data); };
    chatMediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
    };
    chatMediaRecorder.start();
    chatIsRecording = true;
    chatRecordingSeconds = 0;
    document.getElementById('chatMicBtn').classList.add('recording');
    document.getElementById('chatMicBtn').textContent = '⏹';
    document.getElementById('chatRecordingRow').classList.remove('hidden');
    document.getElementById('chatInputBar').classList.add('hidden');
    chatRecordingTimerHandle = setInterval(() => {
      chatRecordingSeconds++;
      const mm = Math.floor(chatRecordingSeconds / 60), ss = String(chatRecordingSeconds % 60).padStart(2, '0');
      document.getElementById('chatRecordingTime').textContent = mm + ':' + ss;
    }, 1000);
  } catch (err) {
    showToast('Mic access nahi mila');
  }
}

function stopVoiceRecording(discard){
  if (!chatIsRecording) return;
  chatIsRecording = false;
  document.getElementById('chatMicBtn').classList.remove('recording');
  document.getElementById('chatMicBtn').textContent = '🎤';
  document.getElementById('chatRecordingRow').classList.add('hidden');
  document.getElementById('chatInputBar').classList.remove('hidden');
  if (chatRecordingTimerHandle) { clearInterval(chatRecordingTimerHandle); chatRecordingTimerHandle = null; }
  const seconds = chatRecordingSeconds;
  chatRecordingSeconds = 0;

  if (!chatMediaRecorder) return;
  const recorder = chatMediaRecorder;
  chatMediaRecorder = null;
  recorder.onstop = async () => {
    recorder.stream.getTracks().forEach(t => t.stop());
    if (discard || seconds < 1) return;
    const blob = new Blob(chatRecordedChunks, { type: 'audio/webm' });
    const fd = new FormData();
    fd.append('media', blob, 'voice.webm');
    fd.append('isVoice', 'true');
    fd.append('duration', String(seconds));
    try {
      const res = await fetch('/api/conversations/' + chatConvoId + '/messages', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send voice message');
      chatMessagesCache.push(data);
      chatLastFetchAt = new Date().toISOString();
      renderChatMessages();
      scrollChatToBottom();
      loadChatInbox().catch(() => {});
    } catch (err) { showToast(err.message); }
  };
  recorder.stop();
}

async function saveChatEdit(){
  if (!chatEditTarget || !chatConvoId) return;
  const text = document.getElementById('chatEditText').value.trim();
  if (!text) { showToast('Message khali nahi ho sakta'); return; }
  try {
    const res = await fetch('/api/conversations/' + chatConvoId + '/messages/' + chatEditTarget, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not edit');
    const idx = chatMessagesCache.findIndex(x => x.id === data.id);
    if (idx !== -1) chatMessagesCache[idx] = data;
    renderChatMessages();
    closeChatEdit();
  } catch (err) { showToast(err.message); }
}

async function chatMsgMenuDelete(scope){
  if (!chatMsgMenuTarget || !chatConvoId) return;
  const id = chatMsgMenuTarget.id;
  closeChatMsgMenu();
  try {
    const res = await fetch('/api/conversations/' + chatConvoId + '/messages/' + id + '/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scope })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not delete');
    if (scope === 'everyone') {
      const idx = chatMessagesCache.findIndex(x => x.id === id);
      if (idx !== -1) { chatMessagesCache[idx].unsent = true; chatMessagesCache[idx].text = null; chatMessagesCache[idx].mediaUrl = null; }
    } else {
      chatMessagesCache = chatMessagesCache.filter(x => x.id !== id);
    }
    renderChatMessages();
    loadChatInbox().catch(() => {});
  } catch (err) { showToast(err.message); }
}

// ---- Send To (share a short into chat) ----
let sendToPeople = [];

async function openSendTo(shortId){
  sendToShortId = shortId;
  sendToPeople = [];
  document.getElementById('sendToSearch').value = '';
  document.getElementById('sendToOverlay').classList.add('open');
  const listEl = document.getElementById('sendToList');
  listEl.innerHTML = '<p class="comment-empty">Loading...</p>';
  if (!currentUser) { listEl.innerHTML = '<p class="comment-empty">Login required.</p>'; return; }
  try {
    const [convRes, followRes] = await Promise.all([
      fetch('/api/conversations'), fetch('/api/users/' + currentUser.id + '/following')
    ]);
    const convData = await convRes.json();
    const followData = await followRes.json();
    const seen = new Set();
    (convData.conversations || []).forEach(c => { if (!seen.has(c.otherUser.id)) { seen.add(c.otherUser.id); sendToPeople.push(c.otherUser); } });
    (followData.users || []).forEach(u => { if (!seen.has(u.id)) { seen.add(u.id); sendToPeople.push(u); } });

    if (!sendToPeople.length) {
      listEl.innerHTML = '<div class="chat-empty">Pehle kisi ko follow karo taaki unhe bhej sako.</div>';
      return;

// ===================== SWIPE GESTURES =====================
function addSwipeLeftListener(el, callback, opts){
  opts = opts || {};
  const minDeltaX = opts.minDeltaX || 65;
  const maxDeltaY = opts.maxDeltaY || 55;
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    if (dx < -minDeltaX && Math.abs(dy) < maxDeltaY) callback(e);
  }, { passive: true });
}
