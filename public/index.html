<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouSeries</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0A1F">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0A1F; --panel:#16122E; --marigold:#7C5CFF; --marigold-deep:#5B3FE0;
    --vermilion:#4361EE; --cream:#EDEBFF; --cream-dim:#A9A3C9; --gold-line: rgba(124,92,255,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;height:100%;}
  a{color:inherit;text-decoration:none;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--gold-line);}
  .brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:var(--marigold);}
  .brand a{color:var(--cream-dim);font-size:13px;border:1px solid var(--gold-line);padding:7px 14px;border-radius:999px;}
  .header-right{display:flex;align-items:center;gap:14px;}

  .tabs{display:flex;justify-content:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--gold-line);}
  .tab-btn{background:transparent;border:1px solid var(--gold-line);color:var(--cream-dim);padding:8px 22px;
    border-radius:999px;font-family:'Mukta',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .tab-btn.active{background:var(--marigold);color:#fff;border-color:var(--marigold);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding:30px 44px;}
  .card{cursor:pointer;}
  .poster{width:100%;aspect-ratio:2/3;border-radius:10px;background:linear-gradient(150deg,#3A2E7A,#4361EE);
    display:flex;align-items:flex-end;padding:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.08);}
  .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,0.6) 100%);}
  .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .ptitle{position:relative;z-index:2;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,0.5);}
  .meta{font-size:12.5px;color:var(--cream-dim);padding-top:8px;display:flex;justify-content:space-between;}
  .empty{padding:60px 44px;color:var(--cream-dim);text-align:center;}
  .empty a{color:var(--marigold);}

  .modal-overlay{position:fixed;inset:0;background:rgba(5,4,15,0.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;max-width:820px;width:100%;overflow:hidden;margin:auto;}
  .modal video{width:100%;display:block;background:#000;max-height:60vh;}
  .modal-body{padding:20px 24px;}
  .modal-body h2{font-family:'Baloo 2',sans-serif;margin:0 0 8px;}
  .modal-body p{color:var(--cream-dim);line-height:1.6;}
  .modal-close{float:right;background:transparent;border:1px solid var(--gold-line);color:var(--cream);border-radius:8px;padding:6px 14px;cursor:pointer;}
  .action-row{display:flex;align-items:center;gap:14px;margin:16px 0 4px;}
  .action-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);
    color:var(--cream);padding:9px 16px;border-radius:999px;cursor:pointer;font-family:'Mukta',sans-serif;font-size:14px;}
  .action-btn:hover{background:rgba(255,255,255,0.12);}
  .action-btn.liked{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
  .action-btn:disabled{cursor:default;}
  .view-count{font-size:13px;color:var(--cream-dim);margin-left:auto;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--marigold);color:#fff;
    padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:200;display:none;}

  .comments-section{margin-top:22px;border-top:1px solid var(--gold-line);padding-top:16px;}
  .comments-section h3{font-family:'Baloo 2',sans-serif;font-size:16px;margin:0 0 12px;color:var(--marigold);}
  .comment-form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .comment-form input, .comment-form textarea{
    background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
  }
  .comment-form textarea{resize:vertical;min-height:50px;}
  .comment-form button{align-self:flex-end;background:var(--marigold);color:#fff;border:none;border-radius:8px;
    padding:8px 18px;font-weight:600;cursor:pointer;font-size:13.5px;}
  .comment-list{display:flex;flex-direction:column;gap:12px;max-height:220px;overflow-y:auto;}
  .comment-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 12px;}
  .comment-name{font-weight:600;font-size:13.5px;color:var(--marigold);}
  .comment-text{font-size:13.5px;color:var(--cream);margin-top:3px;line-height:1.5;}
  .comment-empty{color:var(--cream-dim);font-size:13.5px;}

  /* -------- Shorts feed (Instagram/YouTube-Shorts style) -------- */
  .shorts-container{
    height:calc(100vh - 110px); overflow-y:scroll; scroll-snap-type:y mandatory;
    background:#000;
  }
  .short-item{
    height:100%; width:100%; scroll-snap-align:start; position:relative;
    display:flex; align-items:center; justify-content:center; background:#000;
  }
  .short-item video{width:100%;height:100%;object-fit:contain;background:#000;}
  .short-info{position:absolute;left:14px;bottom:18px;right:76px;color:#fff;z-index:5;}
  .short-info h3{font-family:'Baloo 2',sans-serif;font-size:16px;margin:0 0 4px;text-shadow:0 2px 8px rgba(0,0,0,0.7);}
  .short-info p{font-size:13px;color:#eee;margin:0;text-shadow:0 2px 8px rgba(0,0,0,0.7);line-height:1.4;}
  .short-actions{
    position:absolute; right:12px; bottom:24px; display:flex; flex-direction:column; gap:20px;
    align-items:center; z-index:5;
  }
  .short-action-btn{
    background:rgba(255,255,255,0.15); border:none; color:#fff; width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;
  }
  .short-action-btn.liked{background:var(--vermilion);}
  .short-action-count{font-size:11px;color:#fff;text-align:center;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,0.7);}
  .short-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--cream-dim);text-align:center;padding:40px;}

  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:150;}
  .sheet-overlay.open{display:flex;}
  .sheet{background:var(--panel);border-radius:16px 16px 0 0;max-width:600px;width:100%;max-height:70vh;
    display:flex;flex-direction:column;padding:18px 20px;}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sheet-header h3{font-family:'Baloo 2',sans-serif;margin:0;color:var(--marigold);font-size:16px;}
  .sheet-close{background:transparent;border:none;color:var(--cream);font-size:20px;cursor:pointer;}

  .hidden{display:none !important;}
</style>
</head>
<body>
<header>
  <div class="brand">◆ YOUSERIES</div>
  <div class="header-right"><a href="/admin.html">+ Upload</a></div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabHome" onclick="switchTab('home')">🏠 Home</button>
  <button class="tab-btn" id="tabShorts" onclick="switchTab('shorts')">▶ Shorts</button>
</div>

<div id="homeView">
  <div id="grid" class="grid"></div>
</div>

<div id="shortsView" class="hidden">
  <div class="shorts-container" id="shortsContainer"></div>
</div>

<!-- Home modal player -->
<div class="modal-overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <video id="player" controls></video>
    <div class="modal-body">
      <button class="modal-close" onclick="closeModal()">Close</button>
      <h2 id="mTitle"></h2>
      <p id="mMeta" style="color:var(--marigold);"></p>
      <p id="mDesc"></p>
      <div class="action-row">
        <button class="action-btn" id="likeBtn" onclick="likeCurrentFilm()">♡ <span id="likeCount">0</span></button>
        <button class="action-btn" onclick="shareCurrentFilm()">↗ Share</button>
        <span class="view-count" id="viewCount"></span>
      </div>
      <div class="comments-section">
        <h3>Comments</h3>
        <form class="comment-form" id="commentForm">
          <input type="text" id="commentName" placeholder="Naam (optional)" maxlength="40">
          <textarea id="commentText" placeholder="Apna comment likho..." maxlength="500" required></textarea>
          <button type="submit">Post</button>
        </form>
        <div class="comment-list" id="commentList"></div>
      </div>
    </div>
  </div>
</div>

<!-- Comments bottom sheet, used by Shorts feed -->
<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-header">
      <h3>Comments</h3>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <form class="comment-form" id="sheetCommentForm">
      <input type="text" id="sheetCommentName" placeholder="Naam (optional)" maxlength="40">
      <textarea id="sheetCommentText" placeholder="Apna comment likho..." maxlength="500" required></textarea>
      <button type="submit">Post</button>
    </form>
    <div class="comment-list" id="sheetCommentList" style="max-height:280px;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentFilm = null;
let currentShortId = null;
let allFilms = [];

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function getViewedList(){ return JSON.parse(localStorage.getItem('viewedFilms') || '[]'); }
function markViewed(id){
  const list = getViewedList();
  if (!list.includes(id)) {
    list.push(id);
    localStorage.setItem('viewedFilms', JSON.stringify(list));
    return true; // first time — should count
  }
  return false; // already viewed on this device
}

function switchTab(tab){
  document.getElementById('tabHome').classList.toggle('active', tab === 'home');
  document.getElementById('tabShorts').classList.toggle('active', tab === 'shorts');
  document.getElementById('homeView').classList.toggle('hidden', tab !== 'home');
  document.getElementById('shortsView').classList.toggle('hidden', tab !== 'shorts');
  if (tab === 'shorts') {
    document.querySelectorAll('.short-item video').forEach(v => v.pause());
    setupShortsObserver();
  }
}

async function loadFilms(){
  const res = await fetch('/api/films');
  allFilms = await res.json();

  renderHome(allFilms.filter(f => f.type !== 'short'));
  renderShorts(allFilms.filter(f => f.type === 'short'));

  const params = new URLSearchParams(location.search);
  const sharedId = params.get('film');
  if (sharedId) playFilm(sharedId);
}

function renderHome(films){
  const grid = document.getElementById('grid');
  if(films.length === 0){
    grid.outerHTML = '<div class="empty" id="grid">Abhi koi film upload nahi hui. <a href="/admin.html">Pehli film upload karo</a></div>';
    return;
  }
  grid.innerHTML = films.map(f => `
    <div class="card" onclick="playFilm('${f.id}')">
      <div class="poster">
        ${f.posterUrl ? `<img src="${f.posterUrl}">` : ''}
        <div class="ptitle">${escapeHtml(f.title)}</div>
      </div>
      <div class="meta"><span>${escapeHtml(f.language || '')} ${f.genre ? '· '+escapeHtml(f.genre) : ''}</span><span>${escapeHtml(f.year || '')}</span></div>
    </div>
  `).join('');
}

function renderShorts(shorts){
  const container = document.getElementById('shortsContainer');
  if (shorts.length === 0) {
    container.innerHTML = '<div class="short-empty">Abhi koi Short upload nahi hui.<br><a href="/admin.html" style="color:var(--marigold);">Pehli Short upload karo</a></div>';
    return;
  }
  const likedList = JSON.parse(localStorage.getItem('likedFilms') || '[]');
  container.innerHTML = shorts.map(f => `
    <div class="short-item" data-id="${f.id}">
      <video src="${f.videoUrl}" loop playsinline muted data-id="${f.id}" onclick="toggleShortSound(this)"></video>
      <div class="short-info">
        <h3>${escapeHtml(f.title)}</h3>
        <p>${escapeHtml(f.description || '')}</p>
      </div>
      <div class="short-actions">
        <div>
          <button class="short-action-btn ${likedList.includes(f.id) ? 'liked' : ''}" onclick="likeShort('${f.id}', this)">♡</button>
          <div class="short-action-count" id="short-like-${f.id}">${f.likes || 0}</div>
        </div>
        <div>
          <button class="short-action-btn" onclick="openSheet('${f.id}')">💬</button>
          <div class="short-action-count" id="short-comment-${f.id}">${(f.comments || []).length}</div>
        </div>
        <div>
          <button class="short-action-btn" onclick="shareShort('${f.id}')">↗</button>
          <div class="short-action-count">Share</div>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleShortSound(video){
  video.muted = !video.muted;
}

let shortsObserver = null;
function setupShortsObserver(){
  if (shortsObserver) shortsObserver.disconnect();
  const videos = document.querySelectorAll('.short-item video');
  shortsObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        video.play().catch(() => {});
        const id = video.dataset.id;
        if (markViewed(id)) {
          fetch('/api/films/' + id + '/view', { method: 'POST' }).catch(() => {});
        }
      } else {
        video.pause();
      }
    });
  }, { threshold: [0.6] });
  videos.forEach(v => shortsObserver.observe(v));
}

async function likeShort(id, btn){
  const likedList = JSON.parse(localStorage.getItem('likedFilms') || '[]');
  if (likedList.includes(id)) return;
  try {
    const res = await fetch('/api/films/' + id + '/like', { method: 'POST' });
    const data = await res.json();
    document.getElementById('short-like-' + id).textContent = data.likes;
    btn.classList.add('liked');
    likedList.push(id);
    localStorage.setItem('likedFilms', JSON.stringify(likedList));
  } catch (err) {}
}

function shareShort(id){
  const film = allFilms.find(f => f.id === id);
  const url = location.origin + '/?film=' + id;
  if (navigator.share) {
    navigator.share({ title: film ? film.title : 'YouSeries', url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied!')).catch(() => {});
  }
}

function openSheet(id){
  currentShortId = id;
  const film = allFilms.find(f => f.id === id);
  renderCommentListInto('sheetCommentList', film ? film.comments : []);
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  currentShortId = null;
}

document.getElementById('sheetCommentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentShortId) return;
  const nameInput = document.getElementById('sheetCommentName');
  const textInput = document.getElementById('sheetCommentText');
  if (!textInput.value.trim()) return;
  try {
    const res = await fetch('/api/films/' + currentShortId + '/comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: nameInput.value, text: textInput.value })
    });
    const comment = await res.json();
    if (!res.ok) throw new Error(comment.error || 'Comment post nahi hua');
    const film = allFilms.find(f => f.id === currentShortId);
    if (film) {
      if (!film.comments) film.comments = [];
      film.comments.push(comment);
      document.getElementById('short-comment-' + currentShortId).textContent = film.comments.length;
    }
    renderCommentListInto('sheetCommentList', film ? film.comments : [comment]);
    textInput.value = '';
  } catch (err) {
    showToast(err.message);
  }
});

function renderCommentListInto(elId, comments){
  const listEl = document.getElementById(elId);
  if (!comments || comments.length === 0) {
    listEl.innerHTML = '<p class="comment-empty">Sabse pehla comment karo.</p>';
    return;
  }
  listEl.innerHTML = comments.slice().reverse().map(c => `
    <div class="comment-item">
      <div class="comment-name">${escapeHtml(c.name)}</div>
      <div class="comment-text">${escapeHtml(c.text)}</div>
    </div>
  `).join('');
}

// ---------------- Home modal (full films) ----------------
async function playFilm(id){
  const res = await fetch('/api/films/' + id);
  const f = await res.json();
  currentFilm = f;

  document.getElementById('player').src = f.videoUrl;
  document.getElementById('mTitle').textContent = f.title;
  document.getElementById('mMeta').textContent = [f.year, f.language, f.genre].filter(Boolean).join(' · ');
  document.getElementById('mDesc').textContent = f.description || '';
  document.getElementById('viewCount').textContent = (f.views || 0) + ' views';

  const likedList = JSON.parse(localStorage.getItem('likedFilms') || '[]');
  const likeBtn = document.getElementById('likeBtn');
  const alreadyLiked = likedList.includes(f.id);
  likeBtn.classList.toggle('liked', alreadyLiked);
  likeBtn.disabled = alreadyLiked;
  document.getElementById('likeCount').textContent = f.likes || 0;

  renderCommentListInto('commentList', f.comments);

  document.getElementById('overlay').classList.add('open');

  if (markViewed(f.id)) {
    fetch('/api/films/' + id + '/view', { method: 'POST' })
      .then(r => r.json())
      .then(data => { document.getElementById('viewCount').textContent = data.views + ' views'; })
      .catch(() => {});
  }
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('player').pause();
  document.getElementById('player').src = '';
  history.replaceState(null, '', location.pathname);
}

async function likeCurrentFilm(){
  if (!currentFilm) return;
  const likeBtn = document.getElementById('likeBtn');
  likeBtn.disabled = true;
  try {
    const res = await fetch('/api/films/' + currentFilm.id + '/like', { method: 'POST' });
    const data = await res.json();
    document.getElementById('likeCount').textContent = data.likes;
    likeBtn.classList.add('liked');
    const likedList = JSON.parse(localStorage.getItem('likedFilms') || '[]');
    likedList.push(currentFilm.id);
    localStorage.setItem('likedFilms', JSON.stringify(likedList));
  } catch (err) {
    likeBtn.disabled = false;
  }
}

function shareCurrentFilm(){
  if (!currentFilm) return;
  const url = location.origin + '/?film=' + currentFilm.id;
  if (navigator.share) {
    navigator.share({ title: currentFilm.title, text: 'Dekho ' + currentFilm.title + ' YouSeries pe!', url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied!')).catch(() => {});
  }
}

document.getElementById('commentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentFilm) return;
  const nameInput = document.getElementById('commentName');
  const textInput = document.getElementById('commentText');
  if (!textInput.value.trim()) return;
  try {
    const res = await fetch('/api/films/' + currentFilm.id + '/comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: nameInput.value, text: textInput.value })
    });
    const comment = await res.json();
    if (!res.ok) throw new Error(comment.error || 'Comment post nahi hua');
    if (!currentFilm.comments) currentFilm.comments = [];
    currentFilm.comments.push(comment);
    renderCommentListInto('commentList', currentFilm.comments);
    textInput.value = '';
  } catch (err) {
    showToast(err.message);
  }
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

loadFilms();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
