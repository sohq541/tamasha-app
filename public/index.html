<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YouSeries</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0A1F">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0A1F; --panel:#16122E; --marigold:#7C5CFF; --marigold-deep:#5B3FE0;
    --vermilion:#4361EE; --cream:#EDEBFF; --cream-dim:#A9A3C9; --gold-line: rgba(124,92,255,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;height:100%;overscroll-behavior:none;touch-action:manipulation;}
  a{color:inherit;text-decoration:none;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--gold-line);}
  .brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:var(--marigold);}
  .header-right{display:flex;align-items:center;gap:14px;}

  .tabs{display:flex;justify-content:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--gold-line);}
  .tab-btn{background:transparent;border:1px solid var(--gold-line);color:var(--cream-dim);padding:8px 18px;
    border-radius:999px;font-family:'Mukta',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .tab-btn.active{background:var(--marigold);color:#fff;border-color:var(--marigold);}

  body.shorts-mode header, body.shorts-mode .tabs{display:none;}

  .shorts-header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 0;}
  .section-title{font-family:'Baloo 2',sans-serif;font-size:18px;color:var(--marigold);margin:0;white-space:nowrap;}
  .search-wrap{flex:1;max-width:220px;}
  .search-wrap input{
    width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:999px;
    padding:9px 16px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
  }
  .search-results{padding:0 24px 10px;}
  .search-result-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;}
  .search-result-thumb{width:44px;height:62px;border-radius:6px;object-fit:cover;background:linear-gradient(150deg,#3A2E7A,#4361EE);flex-shrink:0;}
  .search-result-info{display:flex;flex-direction:column;}
  .search-result-title{font-size:14px;font-weight:600;color:var(--cream);}
  .search-result-tag{font-size:12px;color:var(--marigold);}

  .shorts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 24px 10px;}
  .shorts-grid-item{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:linear-gradient(150deg,#3A2E7A,#4361EE);cursor:pointer;}
  .shorts-grid-item img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .shorts-grid-play{position:absolute;top:8px;left:8px;color:#fff;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,0.7);}
  .shorts-grid-views{position:absolute;bottom:8px;left:8px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.7);display:flex;align-items:center;gap:4px;}

  .grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 10px 12px 30px;
  max-width: 520px;
  margin: 0 auto;
}
.card {
  background: var(--panel);
  border: 1px solid var(--gold-line);
  border-radius: 14px;
  overflow: hidden;
}
.card-header-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
}
.card-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  background: linear-gradient(150deg,#3A2E7A,#4361EE);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.card-username {
  font-weight: 700;
  font-size: 14px;
  color: var(--cream);
  cursor: pointer;
}
.card-media-box {
  width: 100%;
  max-height: 520px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.card-media-box img, .card-media-box video {
  width: 100%;
  max-height: 520px;
  object-fit: contain;
  display: block;
}
.mute-toggle-btn{
  position:absolute; bottom:12px; right:12px; z-index:5;
  width:34px; height:34px; border-radius:50%; border:none;
  background:rgba(0,0,0,0.55); color:#fff; font-size:15px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.card-actions-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 14px 4px;
}
.feed-act-btn {
  background: transparent;
  border: none;
  color: var(--cream);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Mukta', sans-serif;
  font-weight: 600;
}
.feed-act-btn.liked {
  color: #ff3366;
}
.card-caption-area {
  padding: 4px 14px 12px;
  font-size: 13.5px;
  line-height: 1.4;
}
  .empty{padding:60px 44px;color:var(--cream-dim);text-align:center;}
  .empty a{color:var(--marigold);}

  .modal-overlay{position:fixed;inset:0;background:rgba(5,4,15,0.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;max-width:820px;width:100%;overflow:hidden;margin:auto;}
  .modal video{width:100%;display:block;background:#000;max-height:60vh;}
  .modal-body{padding:20px 24px;}
  .modal-body h2{font-family:'Baloo 2',sans-serif;margin:0 0 4px;}
  .modal-owner{font-size:13px;color:var(--marigold);margin:0 0 8px;cursor:pointer;text-decoration:underline;display:inline-block;}
  .modal-body p{color:var(--cream-dim);line-height:1.6;}
  .modal-close{float:right;background:transparent;border:1px solid var(--gold-line);color:var(--cream);border-radius:8px;padding:6px 14px;cursor:pointer;}
  .action-row{display:flex;align-items:center;gap:14px;margin:16px 0 4px;}
  .action-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);
    color:var(--cream);padding:9px 16px;border-radius:999px;cursor:pointer;font-family:'Mukta',sans-serif;font-size:14px;}
  .action-btn:hover{background:rgba(255,255,255,0.12);}
  .action-btn.liked{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
  .action-btn:disabled{cursor:default;}
  .view-count{font-size:13px;color:var(--cream-dim);margin-left:auto;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--marigold);color:#fff;
    padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:200;display:none;}

  .comments-section{margin-top:22px;border-top:1px solid var(--gold-line);padding-top:16px;}
  .comments-section h3{font-family:'Baloo 2',sans-serif;font-size:16px;margin:0 0 12px;color:var(--marigold);}
  .comment-form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .comment-form input, .comment-form textarea{
    background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
  }
  .comment-form textarea{resize:vertical;min-height:50px;}
  .comment-form button{align-self:flex-end;background:var(--marigold);color:#fff;border:none;border-radius:8px;
    padding:8px 18px;font-weight:600;cursor:pointer;font-size:13.5px;}
  .comment-list{display:flex;flex-direction:column;gap:12px;max-height:220px;overflow-y:auto;}
  .comment-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 12px;}
  .comment-name{font-weight:600;font-size:13.5px;color:var(--marigold);}
  .comment-text{font-size:13.5px;color:var(--cream);margin-top:3px;line-height:1.5;}
  .comment-empty{color:var(--cream-dim);font-size:13.5px;}

  #shortsView{position:fixed;inset:0;z-index:40;display:none;}
  #shortsView.active{display:block;}
  .shorts-container{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;}
  .short-item{
    height:100vh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;position:relative;
    display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;
  }
  .short-item::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:260px;z-index:4;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);pointer-events:none;
  }
  .short-item video{width:100%;height:100%;object-fit:contain;background:#000;}
  .short-exit{
    position:fixed;top:18px;left:16px;z-index:60;background:rgba(0,0,0,0.45);border:none;
    color:#fff;width:62px;height:62px;border-radius:50%;font-size:36px;font-weight:700;
    display:flex;align-items:center;justify-content:center;text-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  .short-info{position:absolute;left:18px;bottom:34px;right:100px;color:#fff;z-index:5;}
  .short-owner{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;margin:0 0 10px;text-shadow:0 2px 12px rgba(0,0,0,0.9);cursor:pointer;}
  .short-info h3{font-family:'Baloo 2',sans-serif;font-size:36px;font-weight:800;margin:0 0 12px;text-shadow:0 2px 12px rgba(0,0,0,0.9);}
  .short-info p{font-size:21px;color:#fff;margin:0;text-shadow:0 2px 12px rgba(0,0,0,0.9);line-height:1.5;}
  .short-actions{
    position:absolute;right:14px;bottom:40px;display:flex;flex-direction:column;gap:24px;
    align-items:center;z-index:5;
  }
  .short-action-btn{
    background:transparent;border:none;color:#fff;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  .short-action-btn.liked{color:var(--vermilion);}
  .short-action-count{font-size:14px;font-weight:700;color:#fff;text-align:center;margin-top:5px;text-shadow:0 1px 5px rgba(0,0,0,0.8);}
  .short-center-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;
    color:rgba(255,255,255,0.9);z-index:6;pointer-events:none;text-shadow:0 4px 16px rgba(0,0,0,0.6);}
  .short-mute-btn{position:absolute;top:20px;right:20px;z-index:6;background:rgba(255,255,255,0.25);border:none;
    color:#fff;width:50px;height:50px;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .short-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--cream-dim);text-align:center;padding:40px;}

  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:150;}
  .sheet-overlay.open{display:flex;}
  .sheet{background:var(--panel);border-radius:16px 16px 0 0;max-width:600px;width:100%;max-height:70vh;
    display:flex;flex-direction:column;padding:18px 20px;}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sheet-header h3{font-family:'Baloo 2',sans-serif;margin:0;color:var(--marigold);font-size:16px;}
  .sheet-close{background:transparent;border:none;color:var(--cream);font-size:20px;cursor:pointer;}
  .menu-item{display:flex;align-items:center;gap:14px;padding:16px 22px;font-size:15px;color:var(--cream);cursor:pointer;}
  .menu-item:hover{background:rgba(255,255,255,0.06);}

  /* -------- Instagram-style profile -------- */
  .profile-wrap{max-width:560px;margin:0 auto;padding:24px 20px;}
  .profile-top-row{display:flex;align-items:center;gap:20px;margin-bottom:18px;}
  .profile-avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(150deg,#3A2E7A,#4361EE);
    display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-size:34px;font-weight:800;
    overflow:hidden;position:relative;flex-shrink:0;cursor:pointer;}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .avatar-camera{position:absolute;bottom:0;right:0;background:var(--marigold);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .profile-stats{display:flex;flex:1;justify-content:space-around;text-align:center;}
  .profile-stat-num{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:800;color:var(--cream);}
  .profile-stat-label{font-size:12.5px;color:var(--cream-dim);}
  .profile-username{font-family:'Baloo 2',sans-serif;font-size:17px;color:var(--marigold);margin-bottom:4px;}
  .profile-bio{font-size:14px;color:var(--cream);line-height:1.5;white-space:pre-wrap;margin-bottom:4px;}
  .profile-link{font-size:13.5px;color:var(--marigold-deep);word-break:break-all;}
  .profile-btn-row{display:flex;gap:8px;margin-top:16px;}
  .profile-btn{flex:1;background:rgba(255,255,255,0.08);border:1px solid var(--gold-line);color:var(--cream);
    border-radius:8px;padding:9px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;}
  .profile-btn.primary{background:var(--marigold);border-color:var(--marigold);color:#fff;}
  .profile-tabs-row{display:flex;gap:8px;margin:20px 0 12px;}
  .profile-mygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .profile-mygrid-item{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:linear-gradient(150deg,#3A2E7A,#4361EE);}
  .profile-mygrid-item img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}

  .settings-panel{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;padding:22px;margin-bottom:20px;}
  .settings-panel input, .settings-panel textarea, .settings-panel select{
    width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;margin-bottom:10px;
  }
  .settings-panel textarea{min-height:60px;resize:vertical;}
  .settings-save-btn{width:100%;background:var(--marigold);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;}

  .mini-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;}
  #quickUploadForm label{display:block;font-size:13px;color:var(--cream-dim);margin:12px 0 6px;}
#quickUploadForm input[type=text], #quickUploadForm textarea{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
  padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
}
#quickUploadForm textarea{min-height:60px;resize:vertical;}
#quickUploadForm input[type=file]{width:100%;color:var(--cream-dim);font-size:13px;margin-top:4px;}
#quickUploadForm .row{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;}
#quickUploadForm .row label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--cream);margin:0;}
#quickUploadForm .row input[type=radio]{width:auto;}
#quickUploadForm button[type=submit]{margin-top:18px;width:100%;background:var(--marigold);color:#fff;border:none;
  border-radius:8px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;}

.upload-banner{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:300;background:var(--panel);
  border:1px solid var(--gold-line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,0.5);
}
.upload-banner-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--cream);margin-bottom:8px;}
.upload-progress-track{background:rgba(255,255,255,0.1);border-radius:999px;height:8px;overflow:hidden;}
.upload-progress-fill{background:var(--marigold);height:100%;width:0%;transition:width 0.2s;}
.upload-banner-stats{font-size:12px;color:var(--cream-dim);margin-top:6px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/header-logo.png" alt="YouSeries" style="height:44px;display:block;"></div>
  <div class="header-right" id="headerRight"><a href="#" onclick="openUploadModal();return false;">+ Upload</a></div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabHome" onclick="switchTab('home')">🏠 Home</button>
  <button class="tab-btn" id="tabShorts" onclick="switchTab('shorts')">▶ Shorts</button>
  <button class="tab-btn" id="tabProfile" onclick="goToMyProfile()">👤 Profile</button>
</div>

<div id="homeView">
  <div class="shorts-header-row">
    <h3 class="section-title" id="shortsGridTitle" style="display:none;">Shorts</h3>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search..." oninput="doSearch(this.value)">
    </div>
  </div>
  <div class="search-results hidden" id="searchResults"></div>
  <div class="shorts-grid hidden" id="shortsGrid"></div>
  <div id="homeMainContent">
  <div id="grid" class="grid"></div>
  </div>
</div>

<div id="shortsView">
  <button class="short-exit" onclick="switchTab('home')">←</button>
  <div class="shorts-container" id="shortsContainer"></div>
</div>

<div id="profileView" class="hidden">
  <div class="profile-wrap" id="profileContent"></div>
</div>

<div class="modal-overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <video id="player" controls></video>
    <img id="playerImg" style="width:100%;display:none;max-height:70vh;object-fit:contain;background:#000;">
    <div class="modal-body">
      <button class="modal-close" onclick="closeModal()">Close</button>
      <h2 id="mTitle"></h2>
      <span class="modal-owner" id="mOwner"></span>
      <p id="mMeta" style="color:var(--marigold);"></p>
      <p id="mDesc"></p>
      <div class="action-row">
        <button class="action-btn" id="likeBtn" onclick="likeCurrentFilm()">♡ <span id="likeCount">0</span></button>
        <button class="action-btn" onclick="shareCurrentFilm()">↗ Share</button>
        <button class="action-btn hidden" id="modalEditBtn" onclick="editCurrentFilmModal()">✏️ Edit</button>
        <button class="action-btn hidden" id="modalDeleteBtn" onclick="deleteCurrentFilmModal()" style="color:#e88a8a;">🗑️ Delete</button>
        <span class="view-count" id="viewCount"></span>
      </div>
      <div class="comments-section">
        <h3>Comments</h3>
        <form class="comment-form" id="commentForm">
          <textarea id="commentText" placeholder="Apna comment likho..." maxlength="500" required></textarea>
          <button type="submit">Post</button>
        </form>
        <div class="comment-list" id="commentList"></div>
      </div>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-header"><h3>Comments</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <form class="comment-form" id="sheetCommentForm">
      <textarea id="sheetCommentText" placeholder="Apna comment likho..." maxlength="500" required></textarea>
      <button type="submit">Post</button>
    </form>
    <div class="comment-list" id="sheetCommentList" style="max-height:280px;"></div>
  </div>
</div>

<div class="sheet-overlay" id="menuOverlay" onclick="if(event.target===this) closeMenu()">
  <div class="sheet"><div id="menuItemsContainer"></div></div>
</div>

<div class="sheet-overlay" id="editSheetOverlay" onclick="if(event.target===this) closeEditSheet()">
  <div class="sheet" style="max-height:85vh;overflow-y:auto;">
    <div class="sheet-header"><h3>Edit</h3><button class="sheet-close" onclick="closeEditSheet()">✕</button></div>
    <form id="editShortForm">
      <label style="display:block;font-size:13px;color:var(--cream-dim);margin:10px 0 6px;">Title</label>
      <input type="text" id="editShortTitle" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;">
      <label style="display:block;font-size:13px;color:var(--cream-dim);margin:10px 0 6px;">Description</label>
      <textarea id="editShortDesc" style="width:100%;min-height:60px;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;"></textarea>
      <label style="display:block;font-size:13px;color:var(--cream-dim);margin:10px 0 6px;">Replace thumbnail (optional)</label>
      <input type="file" id="editShortPoster" accept="image/*" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;padding:9px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;">

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
  function normalizeUrl(url){
  if (!url) return '#';
  if (!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
  }
function getViewedList(){ return JSON.parse(localStorage.getItem('viewedFilms') || '[]'); }
function markViewed(id){
  const list = getViewedList();
  if (!list.includes(id)) { list.push(id); localStorage.setItem('viewedFilms', JSON.stringify(list)); return true; }
  return false;
}

function switchTab(tab){
  document.getElementById('tabHome').classList.toggle('active', tab === 'home');
  document.getElementById('tabShorts').classList.toggle('active', tab === 'shorts');
  document.getElementById('tabProfile').classList.toggle('active', tab === 'profile');
  document.getElementById('homeView').classList.toggle('hidden', tab !== 'home');
  document.getElementById('shortsView').classList.toggle('active', tab === 'shorts');
  document.getElementById('profileView').classList.toggle('hidden', tab !== 'profile');
  document.body.classList.toggle('shorts-mode', tab === 'shorts');

  if (tab === 'shorts') {
    setupShortsObserver();
    const firstVideo = document.querySelector('.short-item video');
    if (firstVideo) { if (!firstVideo.src && firstVideo.dataset.src) firstVideo.src = firstVideo.dataset.src; firstVideo.play().catch(() => {}); }
  } else {
    document.querySelectorAll('.short-item video').forEach(v => v.pause());
  }
  if (tab === 'home') setupHomeVideoObserver();
  if (tab === 'profile') renderProfile();
}

async function loadFilms() {
  const res = await fetch('/api/films');
  allFilms = shuffleArray(await res.json());
  const shorts = allFilms.filter(f => f.type === 'short');
  renderHome(allFilms);
  renderShortsGrid(shorts);
  renderShorts(shorts);
  
  const params = new URLSearchParams(location.search);
  const sharedId = params.get('film');
  const shortId = params.get('short');
  const profileId = params.get('profile');
  
  if (sharedId) playFilm(sharedId);
  if (shortId) openShortAt(shortId);
  if (profileId) {
    const f = allFilms.find(x => x.ownerId === profileId);
    viewProfile(profileId, f ? f.ownerUsername : 'user');
  }
}

    </div>

function openShortAt(id){
  switchTab('shorts');
  history.pushState({ page: 'shorts' }, '', location.pathname);
  setTimeout(() => {
    const item = document.querySelector('.short-item[data-id="' + id + '"]');
    if (item) item.scrollIntoView({ behavior: 'instant', block: 'start' });
  }, 50);
}

function doSearch(query){
  const resultsEl = document.getElementById('searchResults');
  const mainEl = document.getElementById('homeMainContent');
  const q = query.trim().toLowerCase();
  if (!q) { resultsEl.classList.add('hidden'); mainEl.classList.remove('hidden'); return; }

  const matches = allFilms.filter(f => f.title.toLowerCase().includes(q));

  const seenUsers = new Set();
  const userMatches = [];
  allFilms.forEach(f => {
    if (f.ownerUsername && f.ownerId && !seenUsers.has(f.ownerId) && f.ownerUsername.toLowerCase().includes(q)) {
      seenUsers.add(f.ownerId);
      userMatches.push({ id: f.ownerId, username: f.ownerUsername, profileImage: f.ownerProfileImage });
    }
  });

  mainEl.classList.add('hidden'); resultsEl.classList.remove('hidden');

  if (matches.length === 0 && userMatches.length === 0) {
    resultsEl.innerHTML = '<p class="comment-empty">Koi match nahi mila.</p>';
    return;
  }

  const userHtml = userMatches.map(u => `
    <div class="search-result-item" onclick="viewProfile('${u.id}','${escapeHtml(u.username)}')">
      ${u.profileImage
        ? `<img class="search-result-thumb" src="${u.profileImage}" style="border-radius:50%;aspect-ratio:1/1;">`
        : `<div class="search-result-thumb" style="border-radius:50%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;">${escapeHtml(u.username[0].toUpperCase())}</div>`}
      <div class="search-result-info">
        <span class="search-result-title">@${escapeHtml(u.username)}</span>
        <span class="search-result-tag">Profile</span>
      </div>
    </div>
  `).join('');

  const filmHtml = matches.map(f => `
    <div class="search-result-item" onclick="${f.type === 'short' ? `openShortAt('${f.id}')` : `playFilm('${f.id}')`}">
      <img class="search-result-thumb" src="${f.posterUrl || ''}">
      <div class="search-result-info">
        <span class="search-result-title">${escapeHtml(f.title)}</span>
        <span class="search-result-tag">${f.type === 'short' ? 'Short' : 'Film'}</span>
      </div>
    </div>
  `).join('');

  resultsEl.innerHTML = userHtml + filmHtml;
}

    grid.innerHTML = '<div class="empty">Abhi koi post upload nahi hui. <a href="#" onclick="openUploadModal();return false;">Pehli post upload karo</a></div>';
    return;
  }
  const likedList = JSON.parse(localStorage.getItem('likedFilms') || '[]');

  grid.innerHTML = films.map(f => {
    const isLiked = likedList.includes(f.id);
    const isPhoto = f.type === 'photo';
    const isShort = f.type === 'short';

function toggleCardMute(id, btnEl){

}

let homeVideoObserver = null;
function tryPlayHomeVideo(video){
  video.playsInline = true;
  const p = video.play();
  if (p && p.catch) {
    p.catch(() => {
      const retry = () => { video.play().catch(() => {}); };
      video.addEventListener('canplay', retry, { once: true });
    });
  }
}
function setupHomeVideoObserver(){
  if (homeVideoObserver) homeVideoObserver.disconnect();
  const videos = document.querySelectorAll('#grid .card-media-box video');
  homeVideoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
        tryPlayHomeVideo(video);
      } else {
        video.pause();
      }
    });
  }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
  videos.forEach(v => {
    v.muted = true;
    v.playsInline = true;
    homeVideoObserver.observe(v);
  });
}

let shortsObserver = null;
function setupShortsObserver(){
  if (shortsObserver) shortsObserver.disconnect();
  const videos = document.querySelectorAll('.short-item video');
  shortsObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        if (!video.src && video.dataset.src) video.src = video.dataset.src;
        video.play().catch(() => {
          video.muted = true;
          const btn = video.closest('.short-item').querySelector('.short-mute-btn');
          if (btn) btn.textContent = '🔇';
          video.play().catch(() => {});
        });
        const id = video.dataset.id;
        if (markViewed(id)) fetch('/api/films/' + id + '/view', { method: 'POST' }).catch(() => {});
      } else {
        video.pause();
      }
    });
  }, { threshold: [0.6] });
  videos.forEach(v => shortsObserver.observe(v));
}

    const canEdit = isMine && ageMs < 24 * 60 * 60 * 1000;

          ` : ''}
        </div>

        <div class="comment-text" id="comment-text-${c.id}">${escapeHtml(c.text)}</div>

        ${(canEdit || canDelete) ? `
          <div id="comment-actions-${c.id}" style="display:none;gap:12px;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,0.1);">

            ${canDelete ? `<button type="button" style="background:none;border:none;padding:0;font-size:12.5px;color:#e88a8a;cursor:pointer;font-weight:600;" onclick="event.stopPropagation(); deleteComment('${filmId}','${c.id}')">🗑️ Delete</button>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
  }

function openUploadModal(){
  if (!currentUser) { window.location.href = '/login.html'; return; }
  document.getElementById('uploadModalOverlay').classList.add('open');
}
function closeUploadModal(){
  document.getElementById('uploadModalOverlay').classList.remove('open');
}

document.getElementById('quickUploadForm').addEventListener('submit', function(e){
  e.preventDefault();
  const type = document.querySelector('input[name="qType"]:checked').value;
  const formData = new FormData();
  formData.append('title', document.getElementById('qTitle').value);
  formData.append('type', type);
  formData.append('year', document.getElementById('qYear').value);
  formData.append('language', document.getElementById('qLanguage').value);
  formData.append('genre', document.getElementById('qGenre').value);
  formData.append('description', document.getElementById('qDescription').value);

  if (type === 'photo') {
    const photoFile = document.getElementById('qPhoto').files[0];
    if (!photoFile) { alert('Photo file zaroori hai'); return; }
    formData.append('photo', photoFile);
  } else {
    const videoFile = document.getElementById('qVideo').files[0];
    if (!videoFile) { alert('Video file zaroori hai'); return; }
    formData.append('video', videoFile);
    const posterFile = document.getElementById('qPoster').files[0];
    if (posterFile) formData.append('poster', posterFile);
  }

  const titleForBanner = document.getElementById('qTitle').value;
  closeUploadModal();
  startUploadWithProgress(formData, titleForBanner);
  document.getElementById('quickUploadForm').reset();
  toggleQType('film');
});

function formatBytes(bytes){
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function startUploadWithProgress(formData, title){
  const banner = document.getElementById('uploadBanner');
  const fill = document.getElementById('uploadProgressFill');
  const percentEl = document.getElementById('uploadBannerPercent');
  const statsEl = document.getElementById('uploadBannerStats');
  const titleEl = document.getElementById('uploadBannerTitle');

  banner.classList.remove('hidden');
  titleEl.textContent = 'Uploading: ' + title;
  fill.style.width = '0%';
  percentEl.textContent = '0%';
  statsEl.textContent = '';

  let lastLoaded = 0;
  let lastTime = Date.now();

  const xhr = new XMLHttpRequest();
  uploadXhr = xhr;
  xhr.open('POST', '/api/films');

  xhr.upload.onprogress = function(e){
    if (!e.lengthComputable) return;
    const percent = Math.round((e.loaded / e.total) * 100);
    fill.style.width = percent + '%';
    percentEl.textContent = percent + '%';

    const now = Date.now();
    const timeDelta = (now - lastTime) / 1000;
    const bytesDelta = e.loaded - lastLoaded;
    if (timeDelta > 0.3) {
      const speedMBps = (bytesDelta / timeDelta) / (1024*1024);
      const remainingMB = ((e.total - e.loaded) / (1024*1024)).toFixed(1);
      statsEl.textContent = `${speedMBps.toFixed(1)} MB/s · ${formatBytes(e.loaded)} / ${formatBytes(e.total)} · ${remainingMB} MB left`;
      lastLoaded = e.loaded;
      lastTime = now;
    }
  };

  xhr.onload = function(){
    uploadXhr = null;
    if (xhr.status >= 200 && xhr.status < 300) {
      titleEl.textContent = '✅ Upload complete: ' + title;
      fill.style.width = '100%';
      percentEl.textContent = '100%';
      statsEl.textContent = 'Done!';
      showToast('Upload successful! 🎉');
      loadFilms();
      setTimeout(() => banner.classList.add('hidden'), 3000);
    } else {
      let msg = 'Upload failed';
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch(e){}
      titleEl.textContent = '❌ Failed: ' + msg;
      statsEl.textContent = '';
      setTimeout(() => banner.classList.add('hidden'), 4000);
    }
  };

  xhr.onerror = function(){
    uploadXhr = null;
    titleEl.textContent = '❌ Upload failed (network error)';
    setTimeout(() => banner.classList.add('hidden'), 4000);
  };

  xhr.send(formData);
      }
  window.addEventListener('popstate', function(e){
  if (document.getElementById('overlay').classList.contains('open')) {
    closeModal();
    return;
  }
  if (document.getElementById('sheetOverlay').classList.contains('open')) {
    closeSheet();
    return;
  }
  if (document.getElementById('shortsView').classList.contains('active')) {
    switchTab('home');
    history.pushState({ page: 'home' }, '', location.pathname);
    return;
  }
});
history.pushState({ page: 'home' }, '', location.pathname);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
async function likeFeedPost(id, btn) {
  const likedList = JSON.parse(localStorage.getItem('likedFilms') || '[]');
  if (likedList.includes(id)) return;
  try {
    const res = await fetch('/api/films/' + id + '/like', { method: 'POST' });
    const data = await res.json();
    btn.classList.add('liked');
    btn.innerHTML = `❤️ <span class="like-num">${data.likes}</span>`;
    likedList.push(id);
    localStorage.setItem('likedFilms', JSON.stringify(likedList));
  } catch (err) {}
}

function shareCurrentFilmById(id, title) {
  const film = allFilms.find(f => f.id === id);
  const isShort = film && film.type === 'short';
  const url = location.origin + (isShort ? '/?short=' + id : '/?film=' + id);
  if (navigator.share) {
    navigator.share({ title: title || 'YouSeries', url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied!')).catch(() => {});
  }
}
