<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouSeries — Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B0A1F;--panel:#16122E;--marigold:#7C5CFF;--cream:#EDEBFF;--cream-dim:#A9A3C9;--gold-line:rgba(124,92,255,0.35);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Mukta',sans-serif;display:flex;justify-content:center;padding:50px 20px;}
  .wrap{max-width:560px;width:100%;}
  .card{background:var(--panel);border:1px solid var(--gold-line);border-radius:14px;padding:32px;width:100%;margin-bottom:28px;}
  h1{font-family:'Baloo 2',sans-serif;color:var(--marigold);font-size:26px;margin:0 0 6px;}
  h2{font-family:'Baloo 2',sans-serif;color:var(--marigold);font-size:20px;margin:0 0 14px;}
  p.sub{color:var(--cream-dim);font-size:14px;margin:0 0 24px;}
  label{display:block;font-size:13.5px;color:var(--cream-dim);margin:16px 0 6px;}
  input[type=text], textarea, input[type=file]{
    width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--gold-line);border-radius:8px;
    padding:10px 12px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14.5px;
  }
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:12px;}
  .row > div{flex:1;}
  button{margin-top:24px;width:100%;background:var(--marigold);color:#fff;border:none;border-radius:8px;
    padding:13px;font-weight:600;font-size:15.5px;cursor:pointer;font-family:'Mukta',sans-serif;}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  #status{margin-top:14px;font-size:13.5px;}
  #status.ok{color:#8fd19e;}
  #status.err{color:#e88a8a;}
  a.back{color:var(--cream-dim);font-size:13px;display:inline-block;margin-bottom:18px;}
  a.link{color:var(--marigold);}

  .film-row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
  .film-row:last-child{border-bottom:none;}
  .film-row-top{display:flex;align-items:center;justify-content:space-between;}
  .film-info{display:flex;flex-direction:column;}
  .film-title{font-weight:600;font-size:15px;}
  .film-meta{font-size:12.5px;color:var(--cream-dim);}
  .row-btns{display:flex;gap:8px;}
  .small-btn{width:auto;margin:0;padding:7px 14px;font-size:13px;border-radius:6px;font-weight:600;cursor:pointer;}
  .edit-btn{background:transparent;border:1px solid var(--marigold);color:var(--marigold);}
  .del-btn{background:transparent;border:1px solid #E63950;color:#e88a8a;}
  .empty-msg{color:var(--cream-dim);font-size:14px;}

  .edit-form{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--gold-line);}
  .edit-form.open{display:block;}
  .edit-cancel{background:transparent;border:1px solid var(--gold-line);color:var(--cream-dim);margin-top:8px;}
  .hidden{display:none !important;}
  .claim-btn{background:transparent;border:1px solid var(--marigold);color:var(--marigold);margin-top:10px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back to YouSeries</a>

  <div id="loginGate" class="card hidden">
    <h1>Login required</h1>
    <p class="sub">Upload karne ke liye pehle login ya signup karo.</p>
    <a class="link" href="/login.html">Login karo</a> &nbsp;|&nbsp;
    <a class="link" href="/signup.html">Sign up karo</a>
  </div>

  <div id="uploadArea" class="hidden">
    <div class="card">
      <h1>Upload a film</h1>
      <p class="sub" id="welcomeText"></p>
      <form id="form">
        <label>Title *</label>
        <input type="text" name="title" required placeholder="e.g. Sholay">

        <label>Content Type</label>
        <div class="row">
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cream);margin:0;">
            <input type="radio" name="type" value="film" checked style="width:auto;" onclick="toggleUploadType('film')"> Full Film
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cream);margin:0;">
            <input type="radio" name="type" value="short" style="width:auto;" onclick="toggleUploadType('short')"> Short
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cream);margin:0;">
            <input type="radio" name="type" value="photo" style="width:auto;" onclick="toggleUploadType('photo')"> Photo
          </label>
        </div>

        <div class="row">
          <div>
            <label>Year</label>
            <input type="text" name="year" placeholder="2024">
          </div>
          <div>
            <label>Language</label>
            <input type="text" name="language" placeholder="Hindi / Tamil / Bengali...">
          </div>
        </div>

        <label>Genre</label>
        <input type="text" name="genre" placeholder="Action / Drama / Romance">

        <label>Description</label>
        <textarea name="description" placeholder="Short synopsis..."></textarea>

        <div id="videoFields">
          <label>Poster image (optional — auto-generated from video if left empty)</label>
          <input type="file" name="poster" accept="image/*">

          <label>Video file *</label>
          <input type="file" name="video" accept="video/*" id="videoInput" required>
        </div>
        <div id="photoFields" class="hidden">
          <label>Photo *</label>
          <input type="file" name="photo" accept="image/*" id="photoInput">
        </div>

        <button type="submit" id="submitBtn">Upload</button>
        <div id="status"></div>
      </form>
    </div>

    <div class="card">
      <h2>Manage my uploads</h2>
      <div id="filmList"><p class="empty-msg">Loading...</p></div>
    </div>
  </div>
</div>

<script>
let currentUser = null;

function toggleUploadType(type){
  const videoFields = document.getElementById('videoFields');
  const photoFields = document.getElementById('photoFields');
  const videoInput = document.getElementById('videoInput');
  const photoInput = document.getElementById('photoInput');
  if (type === 'photo') {
    videoFields.classList.add('hidden');
    photoFields.classList.remove('hidden');
    videoInput.required = false;
    photoInput.required = true;
  } else {
    videoFields.classList.remove('hidden');
    photoFields.classList.add('hidden');
    videoInput.required = true;
    photoInput.required = false;
  }
}

async function init(){
  const res = await fetch('/api/me');
  currentUser = await res.json();

  if (!currentUser) {
    document.getElementById('loginGate').classList.remove('hidden');
    return;
  }

  document.getElementById('uploadArea').classList.remove('hidden');
  document.getElementById('welcomeText').textContent = `Logged in as @${currentUser.username}. Video upload karo.`;
  loadFilmList();
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = 'Uploading...';
  status.className = ''; status.textContent = '';

  const formData = new FormData(e.target);
  try {
    const res = await fetch('/api/films', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    status.className = 'ok';
    status.textContent = 'Uploaded!';
    e.target.reset();
    loadFilmList();
  } catch (err) {
    status.className = 'err';
    status.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Upload';
  }
});

async function claimOldFilms(){
  const statusEl = document.getElementById('claimStatus');
  statusEl.textContent = 'Claiming...';
  try {
    const res = await fetch('/api/claim-existing-films', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    statusEl.style.color = '#8fd19e';
    statusEl.textContent = data.claimed + ' films claimed!';
    loadFilmList();
  } catch (err) {
    statusEl.style.color = '#e88a8a';
    statusEl.textContent = err.message;
  }
}

let filmsData = [];

async function loadFilmList() {
  const listEl = document.getElementById('filmList');
  try {
    const res = await fetch('/api/films');
    const allFilms = await res.json();
    filmsData = allFilms.filter(f => f.ownerId === currentUser.id);

    if (filmsData.length === 0) {
      listEl.innerHTML = '<p class="empty-msg">Tumne abhi koi upload nahi ki.</p>';
      return;
    }
    listEl.innerHTML = filmsData.map(f => `
      <div class="film-row" id="row-${f.id}">
        <div class="film-row-top">
          <div class="film-info">
            <span class="film-title">${escapeHtml(f.title)}</span>
            <span class="film-meta">${escapeHtml(f.year || '')} ${f.language ? '· ' + escapeHtml(f.language) : ''} ${f.type === 'short' ? '· Short' : ''}</span>
          </div>
          <div class="row-btns">
            <button class="small-btn edit-btn" onclick="toggleEdit('${f.id}')">Edit</button>
            <button class="small-btn del-btn" onclick="deleteFilm('${f.id}', '${escapeHtml(f.title).replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </div>

        <div class="edit-form" id="edit-${f.id}">
          <label>Title</label>
          <input type="text" id="edit-title-${f.id}" value="${escapeHtml(f.title)}">
          <div class="row">
            <div>
              <label>Year</label>
              <input type="text" id="edit-year-${f.id}" value="${escapeHtml(f.year || '')}">
            </div>
            <div>
              <label>Language</label>
              <input type="text" id="edit-language-${f.id}" value="${escapeHtml(f.language || '')}">
            </div>
          </div>
          <label>Genre</label>
          <input type="text" id="edit-genre-${f.id}" value="${escapeHtml(f.genre || '')}">
          <label>Description</label>
          <textarea id="edit-description-${f.id}">${escapeHtml(f.description || '')}</textarea>
          <label>Video Type</label>
          <div class="row">
            <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cream);margin:0;">
              <input type="radio" name="edit-type-${f.id}" value="film" ${f.type !== 'short' ? 'checked' : ''} onclick="document.getElementById('edit-type-val-${f.id}').value='film'" style="width:auto;"> Full Film
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cream);margin:0;">
              <input type="radio" name="edit-type-${f.id}" value="short" ${f.type === 'short' ? 'checked' : ''} onclick="document.getElementById('edit-type-val-${f.id}').value='short'" style="width:auto;"> Short
            </label>
          </div>
          <input type="hidden" id="edit-type-val-${f.id}" value="${f.type === 'short' ? 'short' : 'film'}">
          <label>Replace thumbnail (optional)</label>
          <input type="file" id="edit-poster-${f.id}" accept="image/*">
          <button onclick="saveEdit('${f.id}')">Save changes</button>
          <button class="edit-cancel" onclick="toggleEdit('${f.id}')">Cancel</button>
          <div id="edit-status-${f.id}" style="margin-top:8px;font-size:13px;"></div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    listEl.innerHTML = '<p class="empty-msg">List load nahi ho payi.</p>';
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function toggleEdit(id){
  document.getElementById('edit-' + id).classList.toggle('open');
}

async function saveEdit(id){
  const statusEl = document.getElementById('edit-status-' + id);
  statusEl.textContent = 'Saving...';
  statusEl.style.color = 'var(--cream-dim)';

  const formData = new FormData();
  formData.append('title', document.getElementById('edit-title-' + id).value);
  formData.append('year', document.getElementById('edit-year-' + id).value);
  formData.append('language', document.getElementById('edit-language-' + id).value);
  formData.append('genre', document.getElementById('edit-genre-' + id).value);
  formData.append('description', document.getElementById('edit-description-' + id).value);
  formData.append('type', document.getElementById('edit-type-val-' + id).value);
  const posterInput = document.getElementById('edit-poster-' + id);
  if (posterInput.files[0]) formData.append('poster', posterInput.files[0]);

  try {
    const res = await fetch('/api/films/' + id, { method: 'PUT', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Save failed');
    statusEl.style.color = '#8fd19e';
    statusEl.textContent = 'Saved!';
    setTimeout(() => loadFilmList(), 800);
  } catch (err) {
    statusEl.style.color = '#e88a8a';
    statusEl.textContent = err.message;
  }
}

async function deleteFilm(id, title) {
  if (!confirm(`"${title}" ko permanently delete karna hai?`)) return;
  const row = document.getElementById('row-' + id);
  row.style.opacity = '0.5';
  try {
    const res = await fetch('/api/films/' + id, { method: 'DELETE' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Delete failed');
    }
    row.remove();
  } catch (err) {
    alert(err.message);
    row.style.opacity = '1';
  }
}

init();
</script>
</body>
</html>
